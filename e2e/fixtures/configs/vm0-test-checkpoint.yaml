agent:
  name: vm0-test-checkpoint
  image: vm0-claude-code:test
  provider: claude-code
  model: claude-3-5-sonnet-20241022
  working_dir: /home/user
  volumes:
    - name: claude-files
      driver: github
      metadata:
        repository: lancy/claude-files
        ref: main
        path: /home/user/claude-files
    - name: question
      driver: github
      metadata:
        repository: lancy/question
        ref: main
        path: /home/user/question
