version: "1.0"

agents:
  vm0-experimental-shorthand:
    description: "Test agent for experimental_secrets and experimental_vars shorthand"
    provider: claude-code
    image: "vm0/claude-code:dev"
    working_dir: /home/user/workspace
    experimental_secrets:
      - API_KEY
      - DB_URL
    experimental_vars:
      - CLOUD_NAME
      - REGION
    volumes:
      - claude-files:/home/user/.claude

volumes:
  claude-files:
    name: claude-files
    version: latest
