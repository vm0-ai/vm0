    <script id="theme-bootstrap">
      // Inline theme detection — mirrors signals/theme.ts resolveTheme() + applyTheme()
      (function () {
        var root = document.documentElement;
        var isOkou = root.dataset.appBrandName === "Okou";
        if (!isOkou) {
          var vm0Preference = localStorage.getItem("theme");
          var vm0Theme =
            vm0Preference === "dark" || vm0Preference === "light"
              ? vm0Preference
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          root.dataset.theme = vm0Theme;
          if (vm0Theme === "dark") root.classList.add("dark");
          return;
        }
        var p = null;
        try {
          var prefix = "__Secure-okou-theme=";
          var cookies = document.cookie.split(";");
          for (var i = 0; i < cookies.length; i += 1) {
            var cookie = cookies[i].trim();
            if (cookie.indexOf(prefix) === 0) {
              var value = cookie.slice(prefix.length);
              if (
                value === "v1.light" ||
                value === "v1.dark" ||
                value === "v1.system"
              ) {
                p = value.slice(3);
              }
              if (p) break;
            }
          }
        } catch (_) {}
        if (!p) {
          try {
            var saved = localStorage.getItem("theme");
            if (saved === "light" || saved === "dark" || saved === "system") {
              p = saved;
            }
          } catch (_) {}
        }
        if (!p) p = "system";
        var t =
          p === "dark" || p === "light"
            ? p
            : window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        root.dataset.theme = t;
        root.classList.toggle("dark", t === "dark");
      })();
    </script>

    <script data-vm0-clerk-bootstrap="">
      (function () {
        var hostname = location.hostname.toLowerCase();
        var production =
          hostname === "vm0.ai" ||
          hostname.endsWith(".vm0.ai") ||
          hostname === "okou.ai" ||
          hostname.endsWith(".okou.ai");
        var publishableKey = production
          ? "%VITE_CLERK_PUBLISHABLE_KEY_PROD%"
          : "%VITE_CLERK_PUBLISHABLE_KEY_PREVIEW%";
        var productionPrimaryAppDomain =
          "__VM0_CLERK_PRODUCTION_PRIMARY_APP_DOMAIN__" === "app.okou.ai"
            ? "app.okou.ai"
            : "app.vm0.ai";
        var okouPrimary = productionPrimaryAppDomain === "app.okou.ai";
        var satelliteDomain = null;
        if (
          production &&
          okouPrimary &&
          isDomainOrSubdomain(hostname, "vm0.ai")
        ) {
          satelliteDomain = "vm0.ai";
        } else if (
          production &&
          !okouPrimary &&
          isDomainOrSubdomain(hostname, "app.okou.ai")
        ) {
          satelliteDomain = "app.okou.ai";
        }
        var satellite = satelliteDomain !== null;
        var authOrigin = satellite
          ? "https://" + productionPrimaryAppDomain
          : location.origin;
        var loadOptions = {
          afterSignOutUrl: new URL("/sign-in", authOrigin).toString(),
          signInUrl: new URL("/sign-in", authOrigin).toString(),
          signUpUrl: new URL("/sign-up", authOrigin).toString(),
        };
        if (satellite) {
          loadOptions.isSatellite = true;
          loadOptions.satelliteAutoSync = true;
        }

        var bootstrap = {
          domain: satelliteDomain || undefined,
          loadOptions: loadOptions,
          productionPrimaryAppDomain: productionPrimaryAppDomain,
          publishableKey: publishableKey,
        };
        window.__vm0ClerkBootstrap = bootstrap;

        function isDomainOrSubdomain(value, domain) {
          return value === domain || value.endsWith("." + domain);
        }

        function startClerk() {
          var clerk = window.Clerk;
          if (
            !clerk ||
            typeof clerk.load !== "function" ||
            typeof clerk.on !== "function"
          ) {
            return;
          }
          if (bootstrap.loaded) return;

          var subscribeToStatus = clerk.on.bind(clerk);
          clerk.on = function (event, handler, options) {
            subscribeToStatus(
              event,
              handler,
              Object.assign({}, options, { notify: true }),
            );
          };

          var loadClerk = clerk.load.bind(clerk);
          var loadPromise;
          clerk.load = function (options) {
            if (!loadPromise) loadPromise = loadClerk(options);
            return loadPromise;
          };

          bootstrap.clerk = clerk;
          bootstrap.loaded = clerk.load(loadOptions);
        }

        var script = document.getElementById("vm0-clerk-core-script");
        if (!script) throw new Error("Clerk core script is unavailable");
        script.dataset.clerkJsScript = "";
        script.dataset.clerkPublishableKey = publishableKey;
        if (satellite) {
          script.dataset.clerkDomain = satelliteDomain;
        }
        script.onerror = function () {
          script.remove();
        };
        script.onload = startClerk;
      })();
    </script>
