    <style>
      body {
        margin: 0;
      }

      #root {
        display: none;
      }

      .browser-upgrade {
        background: #ffffff;
        box-sizing: border-box;
        color: #14171d;
        display: flex;
        font-family:
          "Noto Sans",
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        overflow: hidden;
        padding: 24px;
        position: relative;
        width: 100%;
      }

      .browser-upgrade * {
        box-sizing: border-box;
      }

      .browser-upgrade::before {
        background-image: radial-gradient(
          ellipse 120% 80% at 50% -20%,
          rgba(248, 249, 251, 0.9),
          transparent 50%
        );
        background-size: 100% 100%;
        content: "";
        inset: 0;
        position: absolute;
        z-index: 0;
      }

      [data-browser-supported="true"] #root {
        display: block;
      }

      [data-browser-supported="true"] .browser-upgrade {
        display: none;
      }

      .browser-upgrade__center {
        position: relative;
        width: 100%;
        z-index: 1;
      }

      .browser-upgrade__panel {
        background: #ffffff;
        border: 0.7px solid #dce1e8;
        border-radius: 16px;
        box-shadow:
          0 2px 12px rgba(113, 120, 133, 0.04),
          0 0 0 0.5px rgba(113, 120, 133, 0.02);
        display: flex;
        flex-direction: column;
        gap: 24px;
        align-items: center;
        margin: 0 auto;
        max-width: 384px;
        padding: 32px;
        text-align: center;
      }

      .browser-upgrade__icon {
        align-items: center;
        display: flex;
        height: 40px;
        justify-content: center;
        width: 40px;
      }

      .browser-upgrade__icon img {
        display: block;
        height: 40px;
        width: 40px;
      }

      .browser-upgrade__copy {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .browser-upgrade h1 {
        color: #14171d;
        font-size: 16px;
        font-weight: 600;
        letter-spacing: 0;
        line-height: 24px;
        margin: 0;
      }

      .browser-upgrade p {
        color: #5d6572;
        font-size: 14px;
        line-height: 22px;
        margin: 0;
      }

      .browser-upgrade__actions {
        width: 100%;
      }

      .browser-upgrade a {
        background: #ed4e01;
        border: 1px solid #ed4e01;
        border-radius: 8px;
        box-sizing: border-box;
        color: #ffffff;
        display: inline-block;
        font-size: 14px;
        font-weight: 600;
        line-height: 20px;
        min-height: 40px;
        padding: 9px 14px;
        text-align: center;
        text-decoration: none;
        width: 100%;
      }

      .browser-upgrade a:hover {
        background: #d94600;
        border-color: #d94600;
      }

      @media (max-width: 520px) {
        .browser-upgrade__panel {
          padding: 24px 20px;
        }
      }
    </style>
    <script>
      (function () {
        var ua = navigator.userAgent || "";
        var supported = true;
        var upgradeTarget = {
          actionLabel: "Update browser",
          actionUrl: "https://www.google.com/chrome/",
          description:
            "Zero does not support your current browser version. Update your browser to continue.",
          title: "Update your browser to continue",
        };
        var iosPattern = /\b(?:iPhone|iPad|iPod)\b.*\bOS (\d+)(?:_(\d+))?/;
        var iosMatch = iosPattern.exec(ua);
        var chromiumMatch = /\bChromium\/(\d+)/.exec(ua);
        var chromeMatch = /\b(?:Chrome|CriOS|HeadlessChrome)\/(\d+)/.exec(ua);

        if (iosMatch) {
          upgradeTarget = {
            actionLabel: "Update iOS",
            actionUrl: "https://support.apple.com/HT204204",
            description:
              "Zero does not support your current browser version. Update iOS to continue.",
            title: "Update iOS to continue",
          };
          var iosMajor = parseInt(iosMatch[1], 10);
          var iosMinor = iosMatch[2] ? parseInt(iosMatch[2], 10) : 0;
          if (!isNaN(iosMajor) && !isNaN(iosMinor)) {
            supported = iosMajor > 16 || (iosMajor === 16 && iosMinor >= 4);
          }
        } else if (
          (chromiumMatch || chromeMatch) &&
          !/\b(?:Edg|OPR|SamsungBrowser)\//.test(ua)
        ) {
          var chromiumBrowser = !!chromiumMatch;
          upgradeTarget = {
            actionLabel: chromiumBrowser ? "Update Chromium" : "Update Chrome",
            actionUrl: chromiumBrowser
              ? "https://www.chromium.org/getting-involved/download-chromium/"
              : "https://www.google.com/chrome/",
            description:
              "Zero does not support your current browser version. Update " +
              (chromiumBrowser ? "Chromium" : "Chrome") +
              " to continue.",
            title:
              "Update " +
              (chromiumBrowser ? "Chromium" : "Chrome") +
              " to continue",
          };
          var chromeMajor = parseInt(
            chromiumBrowser ? chromiumMatch[1] : chromeMatch[1],
            10,
          );
          if (!isNaN(chromeMajor)) {
            supported = chromeMajor >= 111;
          }
        } else {
          var safariMatch = /\bVersion\/(\d+)(?:\.(\d+))?.*\bSafari\//.exec(ua);
          if (
            safariMatch &&
            !/\b(?:Chrome|CriOS|Chromium|Edg|OPR|FxiOS)\//.test(ua)
          ) {
            upgradeTarget = {
              actionLabel: "Update Safari",
              actionUrl: "https://support.apple.com/safari",
              description:
                "Zero does not support your current browser version. Update Safari to continue.",
              title: "Update Safari to continue",
            };
            var safariMajor = parseInt(safariMatch[1], 10);
            var safariMinor = safariMatch[2] ? parseInt(safariMatch[2], 10) : 0;
            if (!isNaN(safariMajor) && !isNaN(safariMinor)) {
              supported =
                safariMajor > 16 || (safariMajor === 16 && safariMinor >= 4);
            }
          }
        }

        window.__vm0BrowserUpgrade = upgradeTarget;
        window.__vm0BrowserSupported = supported;
        document.documentElement.setAttribute(
          "data-browser-supported",
          supported ? "true" : "false",
        );
      })();
    </script>
    <script>
      (function () {
        var hostname = window.location.hostname;
        var isProductionHost =
          hostname === "vm0.ai" ||
          hostname.endsWith(".vm0.ai") ||
          hostname === "okou.ai" ||

        if (!isProductionHost) return;

        var initialized = false;

        function loadMarketingScripts() {
          window.dataLayer = window.dataLayer || [];
          window.gtag = function () {
            window.dataLayer.push(arguments);
          };
          window.gtag("js", new Date());
          window.gtag("config", "AW-18144854014");

          var gtagScript = document.createElement("script");
          gtagScript.async = true;
          gtagScript.src =
            "https://www.googletagmanager.com/gtag/js?id=AW-18144854014";
          document.head.appendChild(gtagScript);

          var linkedInPartnerId = "9378804";
          window._linkedin_data_partner_ids =
            window._linkedin_data_partner_ids || [];
          window._linkedin_data_partner_ids.push(linkedInPartnerId);

          (function (l) {
            if (!l) {
              window.lintrk = function (a, b) {
                window.lintrk.q.push([a, b]);
              };
              window.lintrk.q = [];
            }
            var s = document.getElementsByTagName("script")[0];
            var b = document.createElement("script");
            b.type = "text/javascript";
            b.async = true;
            b.src = "https://snap.licdn.com/li.lms-analytics/insight.min.js";
            s.parentNode.insertBefore(b, s);
          })(window.lintrk);
        }

        function scheduleMarketingScripts() {
          if (initialized) return;
          initialized = true;

          if (typeof window.requestIdleCallback === "function") {
            window.requestIdleCallback(loadMarketingScripts, {
              timeout: 1500,
            });
            return;
          }

          window.setTimeout(loadMarketingScripts, 0);
        }

        // Optimize loading performance: attribution scripts can wait until
        // the app skeleton is visible, with a fallback for failed bootstraps.
        window.addEventListener(
          "vm0:app-skeleton-visible",
          scheduleMarketingScripts,
          { once: true },
        );
        window.setTimeout(scheduleMarketingScripts, 5000);
      })();

    <script>
      // Preconnect to the Clerk Frontend API host so the DNS+TCP+TLS
      // handshake overlaps with bundle download. The publishable key is
      // shaped pk_<env>_<base64(host$)>; decoding it here avoids hard-coding
      // the FAPI domain per environment.
      (function () {
        var h = location.hostname.toLowerCase();
        var production =
          h === "vm0.ai" ||
          h.endsWith(".vm0.ai") ||
          h === "okou.ai" ||
          h.endsWith(".okou.ai");
        var k = production
          ? "%VITE_CLERK_PUBLISHABLE_KEY_PROD%"
          : "%VITE_CLERK_PUBLISHABLE_KEY_PREVIEW%";
        var m = /^pk_(?:test|live)_(.+)$/.exec(k);
        if (!m) return;
        var host = atob(m[1]).replace(/\$+$/, "");
        if (!/^[a-z0-9.-]+$/i.test(host)) return;
        var l = document.createElement("link");
        l.rel = "preconnect";
        l.href = "https://" + host;
        l.crossOrigin = "anonymous";
        document.head.appendChild(l);
      })();
    </script>

    <script>
      // Inline theme detection — mirrors signals/theme.ts resolveTheme() + applyTheme()
      (function () {
        var p = localStorage.getItem("theme");
        var t =
          p === "dark" || p === "light"
            ? p
            : window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        document.documentElement.dataset.theme = t;
        if (t === "dark") document.documentElement.classList.add("dark");
      })();
    </script>
    <script>
      // Resolve locale before the app bundle runs so refreshes use the cached
      // workspace language while the server preference is loading.
      (function () {
        var orgId = sessionStorage.getItem("clerk-active-org-id");
        var cacheKey = orgId ? "vm0:locale:" + orgId : null;
        var cached = cacheKey ? localStorage.getItem(cacheKey) : null;
        // Browser-language auto-selection stays disabled during rollout.
        // Locale changes come from the workspace cache or gated preference UI.
        var locale =
          cached === "en-US" || cached === "pt-BR" ? cached : "en-US";

        document.documentElement.lang = locale;
        if (cacheKey) localStorage.setItem(cacheKey, locale);
      })();
    </script>

    <script>

        if (title) title.textContent = target.title;

    <div id="app-bootstrap-skeleton">
      <style>
        :root {
          --zero-viewport-height: 100dvh;
        }
        @supports (height: 100lvh) {
          @media (display-mode: standalone) {
            :root {
              --zero-viewport-height: 100lvh;
            }
          }
        }
        html,
        body {
          margin: 0;
        }
        html,
        body,
        #root {
          width: 100%;
          height: var(--zero-viewport-height);
          min-height: var(--zero-viewport-height);
          overflow: hidden;
        }
        #root {
          position: fixed;
          top: 0;
          right: 0;
          left: 0;
        }
        #app-bootstrap-skeleton {
          position: fixed;
          inset: 0;
          z-index: 60;
          box-sizing: border-box;
          display: none;
          align-items: center;
          justify-content: center;
          height: var(--zero-viewport-height);
          min-height: var(--zero-viewport-height);
          background: #fdfdfe;
          color: rgba(20, 23, 29, 0.7);
          font-family:
            system-ui,
            -apple-system,
            BlinkMacSystemFont,
            "Segoe UI",
            sans-serif;
          opacity: 1;
          transition: opacity 300ms ease;
        }
        [data-browser-supported="true"] #app-bootstrap-skeleton {
          display: flex;
        }
        [data-theme="dark"] #app-bootstrap-skeleton {
          background: #19191b;
          color: rgba(232, 233, 237, 0.7);
        }
        #app-bootstrap-skeleton.app-bootstrap-skeleton--hidden {
          pointer-events: none;
          opacity: 0;
        }
        .app-bootstrap-skeleton__content {
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 20px;
        }
        .app-bootstrap-skeleton__avatar {
          position: relative;
          width: 64px;
          height: 64px;
          overflow: hidden;
          border-radius: 9999px;
        }
        .app-bootstrap-skeleton__avatar-layers {
          position: absolute;
          inset: 0;
          transform: scale(1.25);
        }
        .app-bootstrap-skeleton__avatar img {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          object-fit: cover;
        }
        .app-bootstrap-skeleton__message {
          position: relative;
          height: 24px;
          font-size: 16px;
          font-weight: 500;
          line-height: 24px;
        }
        .app-bootstrap-skeleton__message p {
          margin: 0;
          white-space: nowrap;
        }
        .app-bootstrap-skeleton__message-spacer {
          visibility: hidden;
        }
        .app-bootstrap-skeleton__message-static {
          position: absolute;
          top: 0;
          left: 50%;
          transform: translateX(-50%);
        }
        .app-bootstrap-skeleton__message-typewriter {
          position: absolute;
          inset: 0;
          width: 0;
          overflow: hidden;
          border-right: 2px solid currentColor;
          visibility: hidden;
        }
        @keyframes app-bootstrap-skeleton-hide-static {
          0%,
          99.9% {
            opacity: 1;
          }
          100% {
            opacity: 0;
          }
        }
        @keyframes app-bootstrap-skeleton-show-typewriter {
          0%,
          99.9% {
            visibility: hidden;
          }
          100% {
            visibility: visible;
          }
        }
        @keyframes app-bootstrap-skeleton-type {
          from {
            width: 0;
          }
          to {
            width: 100%;
          }
        }
        @keyframes app-bootstrap-skeleton-blink {
          0%,
          100% {
            border-color: transparent;
          }
          50% {
            border-color: currentColor;
          }
        }

    <script>
      (function () {
        if (window.__vm0BrowserSupported !== true) return;

        var skeleton = document.getElementById("app-bootstrap-skeleton");
        var messages = [
          "Warming up the neurons...",
          "Brewing some ideas...",
          "Getting things ready...",
          "Almost there...",
          "Loading your workspace...",
          "Tuning the instruments...",
          "Connecting the dots...",
          "Spinning up the team...",
        ];
        var avatarPresets = [
          {
            rotation: 1,
            skin: 0,
            hairStyle: 1,
            hairColor: 5,
            expression: 1,
            intensity: "h",
          },
          {
            rotation: 2,
            skin: 1,
            hairStyle: 3,
            hairColor: 3,
            expression: 1,
            intensity: "m",
          },
          {
            rotation: 4,
            skin: 2,
            hairStyle: 5,
            hairColor: 4,
            expression: 3,
            intensity: "d",
          },
          {
            rotation: 3,
            skin: 3,
            hairStyle: 4,
            hairColor: 1,
            expression: 4,
            intensity: "h",
          },
          {
            rotation: 5,
            skin: 4,
            hairStyle: 2,
            hairColor: 2,
            expression: 5,
            intensity: "m",
          },
        ];
        var avatarAssetBase =
          "https://static.vm0.io/platform/views/zero-page/assets/avatar-svg/";
        var avatar =
          avatarPresets[Math.floor(Math.random() * avatarPresets.length)];
        var messageIndex = Math.floor(Math.random() * messages.length);
        var staticMessage = skeleton.querySelector(
          ".app-bootstrap-skeleton__message-static",
        );
        var spacerMessage = skeleton.querySelector(
          ".app-bootstrap-skeleton__message-spacer",
        );
        var typewriterMessage = skeleton.querySelector(
          ".app-bootstrap-skeleton__message-typewriter",
        );

        skeleton.querySelector('[data-app-bootstrap-avatar-layer="head"]').src =
          avatarAssetBase +
          "head-r" +
          avatar.rotation +
          "-s" +
          avatar.skin +
          ".svg";
        skeleton.querySelector('[data-app-bootstrap-avatar-layer="face"]').src =
          avatarAssetBase +
          "face-r" +
          avatar.rotation +
          "-f" +
          avatar.expression +
          "-" +
          avatar.intensity +
          ".svg";
        skeleton.querySelector('[data-app-bootstrap-avatar-layer="hair"]').src =
          avatarAssetBase +
          "hair-r" +
          avatar.rotation +
          "-h" +
          avatar.hairStyle +
          "-c" +
          avatar.hairColor +
          ".svg";

        function typewriterAnimation(message, delay) {
          return (
            "app-bootstrap-skeleton-show-typewriter " +
            delay +
            "ms forwards, app-bootstrap-skeleton-type 1.5s steps(" +
            message.length +
            ") " +
            delay +
            "ms forwards, app-bootstrap-skeleton-blink 0.6s step-end " +
            delay +
            "ms infinite"
          );
        }

        function setMessages(isFirst) {
          var currentMessage = messages[messageIndex % messages.length];
          var nextMessage = messages[(messageIndex + 1) % messages.length];
          var nextTypewriterMessage = typewriterMessage.cloneNode(true);

          staticMessage.textContent = currentMessage;
          staticMessage.style.display = isFirst ? "block" : "none";
          staticMessage.style.animation = isFirst
            ? "app-bootstrap-skeleton-hide-static 800ms forwards"
            : "none";
          spacerMessage.textContent = nextMessage;
          nextTypewriterMessage.textContent = nextMessage;
          nextTypewriterMessage.style.animation = typewriterAnimation(
            nextMessage,
            isFirst ? 800 : 0,
          );
          typewriterMessage.replaceWith(nextTypewriterMessage);
          typewriterMessage = nextTypewriterMessage;
        }

        setMessages(true);

        var cycles = 0;
        var interval = window.setInterval(function () {
          if (!document.getElementById("app-bootstrap-skeleton")) {
            window.clearInterval(interval);
            return;
          }

          messageIndex += 1;
          setMessages(false);
          cycles += 1;
          if (cycles >= 3) {
            window.clearInterval(interval);
          }
        }, 4000);
      })();
    </script>
