name: "Web/API Vercel Environment"
description: "Render the shared Web and API Vercel environment into a key=value file"

outputs:
  file:
    description: "Path to the rendered environment file"
    value: ${{ steps.render.outputs.file }}

inputs:
  app:
    description: "App receiving the environment (web or api)"
    required: true
  environment:
    description: "Deployment environment (preview or production)"
    required: true
  database-url:
    description: "Database URL for the deployment"
    required: false
    default: ""
  job-ref:
    description: "Preview job reference, such as pr-123 or staging"
    required: false
    default: ""
  web-url:
    description: "Preview or production web URL"
    required: false
    default: ""
  app-url:
    description: "Preview or production platform app URL"
    required: false
    default: ""
  api-backend-url:
    description: "Backend API URL used by web proxy routes"
    required: false
    default: ""
  cli-pkg-url:
    description: "Commit-addressed Okou CLI npm-format package URL"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Render environment file
      id: render
      shell: bash
      env:
        INPUT_APP: ${{ inputs.app }}
        INPUT_ENVIRONMENT: ${{ inputs.environment }}
        INPUT_DATABASE_URL: ${{ inputs.database-url }}
        INPUT_JOB_REF: ${{ inputs.job-ref }}
        INPUT_WEB_URL: ${{ inputs.web-url }}
        INPUT_APP_URL: ${{ inputs.app-url }}
        INPUT_API_BACKEND_URL: ${{ inputs.api-backend-url }}
        INPUT_CLI_PKG_URL: ${{ inputs.cli-pkg-url }}
      run: |
        set -euo pipefail
        set +x

        if [[ "$INPUT_APP" != "web" && "$INPUT_APP" != "api" ]]; then
          echo "::error::app must be web or api"
          exit 1
        fi

        if [[ "$INPUT_ENVIRONMENT" != "preview" && "$INPUT_ENVIRONMENT" != "production" ]]; then
          echo "::error::environment must be preview or production"
          exit 1
        fi

        vars_json="${REPO_VARS_JSON:-}"
        secrets_json="${REPO_SECRETS_JSON:-}"
        doppler_secrets_json="${DOPPLER_SECRETS_JSON:-}"
        if [[ -z "$vars_json" ]]; then
          vars_json="{}"
        fi
        if [[ -z "$secrets_json" ]]; then
          secrets_json="{}"
        fi
        if [[ -z "$doppler_secrets_json" ]]; then
          doppler_secrets_json="{}"
        fi
        env_file="${RUNNER_TEMP}/web-api-${INPUT_APP}-${INPUT_ENVIRONMENT}.env"

        json_get() {
          local json="$1"
          local key="$2"
          jq -r --arg key "$key" '.[$key] // ""' <<< "$json"
        }

        repo_var() {
          json_get "$vars_json" "$1"
        }

        repo_secret() {
          json_get "$secrets_json" "$1"
        }

        # Stage 1 protects repository configuration consumed by checked-out
        # deployment workflows during the supported old-workflow rerun and
        # rollback window. Remove legacy reads only after #28914 establishes
        # equal canonical config, retires old-only rollback targets, and
        # records zero legacy-only source evidence.
        resolve_repo_alias() {
          local accessor="$1"
          local canonical_key="$2"
          local legacy_key="$3"
          local source_label="${4:-GitHub App}"
          local canonical_value
          local legacy_value
          local state
          local value

          canonical_value="$("$accessor" "$canonical_key")"
          legacy_value="$("$accessor" "$legacy_key")"
          if [[ -n "$canonical_value" && -n "$legacy_value" ]]; then
            if [[ "$canonical_value" != "$legacy_value" ]]; then
              printf '::error::%s source conflict canonical_key=%s legacy_key=%s state=conflict\n' \
                "$source_label" \
                "$canonical_key" \
                "$legacy_key" \
                >&2
              return 1
            fi
            state="dual"
            value="$canonical_value"
          elif [[ -n "$canonical_value" ]]; then
            state="canonical-only"
            value="$canonical_value"
          elif [[ -n "$legacy_value" ]]; then
            state="legacy-only"
            value="$legacy_value"
          else
            return 0
          fi

          printf '::notice::%s source canonical_key=%s legacy_key=%s state=%s\n' \
            "$source_label" \
            "$canonical_key" \
            "$legacy_key" \
            "$state" \
            >&2
          printf '%s' "$value"
        }

        doppler_secret() {
          json_get "$doppler_secrets_json" "$1"
        }

        first_non_empty() {
          local value
          for value in "$@"; do
            if [[ -n "$value" ]]; then
              printf '%s' "$value"
              return
            fi
          done
        }

        add_env() {
          local key="$1"
          local value="${2:-}"
          printf '%s=%s\n' "$key" "$value" >> "$env_file"
        }

        add_var() {
          add_env "$1" "$(repo_var "$2")"
        }

        add_secret() {
          add_env "$1" "$(repo_secret "$2")"
        }

        add_oauth_client_config_key() {
          local key="$1"
          local value
          value="$(doppler_secret "$key")"
          if [[ -z "$value" ]]; then
            echo "::error::${key} is missing from Doppler OAuth config"
            exit 1
          fi
          add_env "$key" "$value"
        }

        add_oauth_client_config() {
          local prefix="$1"
          add_oauth_client_config_key "${prefix}_OAUTH_CLIENT_ID"
          add_oauth_client_config_key "${prefix}_OAUTH_CLIENT_SECRET"
        }

        github_app_slug="$(resolve_repo_alias repo_var OKOU_GITHUB_APP_SLUG VM0_GITHUB_APP_SLUG)"
        github_app_id="$(resolve_repo_alias repo_var OKOU_GITHUB_APP_ID VM0_GITHUB_APP_ID)"
        github_app_client_id="$(resolve_repo_alias repo_var OKOU_GITHUB_APP_CLIENT_ID VM0_GITHUB_APP_CLIENT_ID)"
        github_app_client_secret="$(resolve_repo_alias repo_secret OKOU_GITHUB_APP_CLIENT_SECRET VM0_GITHUB_APP_CLIENT_SECRET)"
        github_app_webhook_secret="$(resolve_repo_alias repo_secret OKOU_GITHUB_APP_WEBHOOK_SECRET VM0_GITHUB_APP_WEBHOOK_SECRET)"
        github_app_private_key="$(resolve_repo_alias repo_secret OKOU_GITHUB_APP_PRIVATE_KEY VM0_GITHUB_APP_PRIVATE_KEY)"
        machine_secret_key="$(resolve_repo_alias repo_secret OKOU_MACHINE_SECRET_KEY VM0_MACHINE_SECRET_KEY "API machine secret")"
        api_backend_url="$INPUT_API_BACKEND_URL"

        : > "$env_file"

        if [[ -n "$INPUT_DATABASE_URL" ]]; then
          add_env DATABASE_URL "$INPUT_DATABASE_URL"
        fi

        if [[ "$INPUT_ENVIRONMENT" == "production" ]]; then
          web_url="${INPUT_WEB_URL:-https://www.vm0.ai}"
          app_url="${INPUT_APP_URL:-https://app.vm0.ai}"
          axiom_dataset_suffix="prod"
          deploy_env="production"
          runner_default_group="vm0/production"
          concurrent_run_limit_cap="10"
          slack_redirect_base_url="$(repo_var SLACK_REDIRECT_BASE_URL)"
          plausible_script_url="$(first_non_empty "$(repo_var PLAUSIBLE_SCRIPT_URL_PROD)" "$(repo_var PLAUSIBLE_SCRIPT_URL)")"
          strapi_url="$(repo_var STRAPI_URL)"
          user_artifacts_bucket="$(repo_var R2_USER_ARTIFACTS_BUCKET_NAME)"
          user_artifacts_access_key_id="$(repo_secret R2_USER_ARTIFACTS_ACCESS_KEY_ID)"
          user_artifacts_secret_access_key="$(repo_secret R2_USER_ARTIFACTS_SECRET_ACCESS_KEY)"
          public_artifacts_base_url="$(repo_var PUBLIC_ARTIFACTS_BASE_URL)"
          static_assets_base_url="$(first_non_empty "$(repo_var STATIC_ASSETS_BASE_URL_PROD)" "$(repo_var STATIC_ASSETS_BASE_URL)" "https://static.vm0.io")"
          atom_url="$(repo_var ATOM_URL)"
        else
          web_url="$INPUT_WEB_URL"
          app_url="$INPUT_APP_URL"
          axiom_dataset_suffix="dev"
          deploy_env="preview"
          runner_default_group="vm0/development-${INPUT_JOB_REF}"
          concurrent_run_limit_cap="0"
          slack_redirect_base_url="$INPUT_WEB_URL"
          plausible_script_url="$(repo_var PLAUSIBLE_SCRIPT_URL)"
          strapi_url=""
          user_artifacts_bucket="$(first_non_empty "$(repo_var R2_USER_ARTIFACTS_BUCKET_NAME_DEV)" "$(repo_var R2_USER_ARTIFACTS_BUCKET_NAME)" "user-artifact-dev")"
          user_artifacts_access_key_id="$(first_non_empty "$(repo_secret R2_USER_ARTIFACTS_ACCESS_KEY_ID)" "$(repo_secret R2_ACCESS_KEY_ID)")"
          user_artifacts_secret_access_key="$(first_non_empty "$(repo_secret R2_USER_ARTIFACTS_SECRET_ACCESS_KEY)" "$(repo_secret R2_SECRET_ACCESS_KEY)")"
          public_artifacts_base_url="$(first_non_empty "$(repo_var PUBLIC_ARTIFACTS_BASE_URL_DEV)" "$(repo_var PUBLIC_ARTIFACTS_BASE_URL)" "https://cdn.vm7.io")"
          static_assets_base_url="$(first_non_empty "$(repo_var STATIC_ASSETS_BASE_URL_DEV)" "$(repo_var STATIC_ASSETS_BASE_URL)" "https://static.vm7.io")"
          atom_url="https://tunnel-yuma-atom-api.vm7.ai"
        fi

        if [[ -n "$api_backend_url" ]]; then
          add_env OKOU_API_BACKEND_URL "$api_backend_url"
        fi
        if [[ "$INPUT_APP" == "api" ]]; then
          if [[ -z "$INPUT_CLI_PKG_URL" ]]; then
            echo "::error::cli-pkg-url is required for API deployments"
            exit 1
          fi
          add_env FEISHU_CALLBACK_BASE_URL "$api_backend_url"
          add_env FINICITY_WEBHOOK_BASE_URL "$api_backend_url"
          add_env OKOU_WEB_URL "$web_url"
          add_env ENV "$deploy_env"
          add_env CLI_PKG_URL "$INPUT_CLI_PKG_URL"
          if [[ "$INPUT_ENVIRONMENT" == "production" ]]; then
            add_secret CLOUDFLARE_BROWSER_RENDERING_API_TOKEN CLOUDFLARE_BROWSER_RENDERING_API_TOKEN
            add_secret ARTIFACT_PREVIEW_WAF_SECRET ARTIFACT_PREVIEW_WAF_SECRET
          fi
          if [[ "$INPUT_ENVIRONMENT" == "preview" && -n "$INPUT_JOB_REF" ]]; then
            add_env OKOU_PREVIEW_JOB_REF "$INPUT_JOB_REF"
          fi
          if [[ -n "$atom_url" ]]; then
            add_env ATOM_URL "$atom_url"
          fi
          if [[ -n "$machine_secret_key" ]]; then
            add_env OKOU_MACHINE_SECRET_KEY "$machine_secret_key"
          fi
        fi
        # Inject the checked-out build commit explicitly so OTel / Sentry can
        # tag service.version and release on every deploy. Vercel CLI prebuilt
        # deploys do not reliably populate Vercel's own VERCEL_GIT_* system
        # vars, and we don't want runtime to depend on Vercel auto-injection.
        build_commit_sha="$(bash .github/scripts/resolve-build-commit-sha.sh)"
        add_env GIT_COMMIT_SHA "$build_commit_sha"
        add_env BLOG_BASE_URL "$web_url"
        add_env STRAPI_URL "$strapi_url"
        add_var CLERK_PUBLISHABLE_KEY CLERK_PUBLISHABLE_KEY
        add_secret CLERK_SECRET_KEY CLERK_SECRET_KEY
        add_var CF_ACCOUNT_ID CF_ACCOUNT_ID
        add_var R2_ACCOUNT_ID R2_ACCOUNT_ID
        add_secret R2_ACCESS_KEY_ID R2_ACCESS_KEY_ID
        add_secret R2_SECRET_ACCESS_KEY R2_SECRET_ACCESS_KEY
        add_var R2_USER_STORAGES_BUCKET_NAME R2_USER_STORAGES_BUCKET_NAME
        add_env R2_USER_ARTIFACTS_BUCKET_NAME "$user_artifacts_bucket"
        add_env R2_USER_ARTIFACTS_ACCESS_KEY_ID "$user_artifacts_access_key_id"
        add_env R2_USER_ARTIFACTS_SECRET_ACCESS_KEY "$user_artifacts_secret_access_key"
        add_env PUBLIC_ARTIFACTS_BASE_URL "$public_artifacts_base_url"
        add_var OKOU_PUBLIC_ARTIFACTS_BASE_URL OKOU_PUBLIC_ARTIFACTS_BASE_URL
        add_env STATIC_ASSETS_BASE_URL "$static_assets_base_url"
        if [[ "$INPUT_APP" == "web" ]]; then
          add_env NEXT_PUBLIC_STATIC_ASSETS_BASE_URL "$static_assets_base_url"
        fi
        add_var R2_HOSTED_SITES_BUCKET_NAME R2_HOSTED_SITES_BUCKET_NAME
        add_secret R2_HOSTED_SITES_ACCESS_KEY_ID R2_HOSTED_SITES_ACCESS_KEY_ID
        add_secret R2_HOSTED_SITES_SECRET_ACCESS_KEY R2_HOSTED_SITES_SECRET_ACCESS_KEY
        add_var OKOU_PUBLIC_HOST_DOMAIN OKOU_PUBLIC_HOST_DOMAIN
        add_var OKOU_HOST_SCHEME OKOU_HOST_SCHEME
        add_secret SECRETS_ENCRYPTION_KEY SECRETS_ENCRYPTION_KEY
        add_secret SECRETS_KMS_KEY_ID SECRETS_KMS_KEY_ID
        add_var AWS_REGION AWS_REGION
        add_secret AWS_ACCESS_KEY_ID AWS_ACCESS_KEY_ID
        add_secret AWS_SECRET_ACCESS_KEY AWS_SECRET_ACCESS_KEY
        add_secret OFFICIAL_RUNNER_SECRET OFFICIAL_RUNNER_SECRET
        add_env RUNNER_DEFAULT_GROUP "$runner_default_group"
        add_secret AXIOM_TOKEN_SESSIONS AXIOM_TOKEN_SESSIONS
        add_secret AXIOM_TOKEN_TELEMETRY AXIOM_TOKEN_TELEMETRY
        add_env AXIOM_DATASET_SUFFIX "$axiom_dataset_suffix"
        if [[ "$INPUT_ENVIRONMENT" == "preview" ]]; then
          add_env USE_MOCK_CLAUDE "true"
        fi
        add_secret CRON_SECRET CRON_SECRET
        add_secret ABLY_API_KEY ABLY_API_KEY
        add_secret OPENROUTER_API_KEY OPENROUTER_API_KEY
        add_secret OPENAI_API_KEY OPENAI_API_KEY
        add_secret FAL_KEY FAL_KEY
        add_secret JOGGAI_API_KEY JOGGAI_API_KEY
        if [[ "$INPUT_APP" == "api" ]]; then
          add_secret JOGGAI_WEBHOOK_SECRET JOGGAI_WEBHOOK_SECRET
        fi
        add_secret BYTEPLUS_API_KEY BYTEPLUS_API_KEY
        add_secret MINIMAX_API_KEY MINIMAX_API_KEY
        add_secret BYTEPLUS_STT_API_KEY BYTEPLUS_STT_API_KEY
        add_var VAPID_PUBLIC_KEY VAPID_PUBLIC_KEY
        add_secret VAPID_PRIVATE_KEY VAPID_PRIVATE_KEY
        add_env CONCURRENT_RUN_LIMIT_CAP "$concurrent_run_limit_cap"
        if [[ "$INPUT_ENVIRONMENT" == "preview" ]]; then
          add_env OKOU_DEBUG "*"
        fi
        add_var CLAUDE_CODE_VERSION_URL CLAUDE_CODE_VERSION_URL
        add_secret SLACK_SIGNING_SECRET SLACK_SIGNING_SECRET
        add_secret TELEGRAM_OFFICIAL_BOT_TOKEN TELEGRAM_OFFICIAL_BOT_TOKEN
        add_var TELEGRAM_OFFICIAL_BOT_USERNAME TELEGRAM_OFFICIAL_BOT_USERNAME
        add_secret TELEGRAM_OFFICIAL_WEBHOOK_SECRET TELEGRAM_OFFICIAL_WEBHOOK_SECRET
        if [[ "$INPUT_APP" == "api" ]]; then
          add_var MICROSOFT_TEAMS_BOT_APP_ID MICROSOFT_TEAMS_BOT_APP_ID
          add_secret MICROSOFT_TEAMS_BOT_APP_PASSWORD MICROSOFT_TEAMS_BOT_APP_PASSWORD
          add_var MICROSOFT_TEAMS_APP_TENANT_ID MICROSOFT_TEAMS_APP_TENANT_ID
        fi
        add_env SLACK_REDIRECT_BASE_URL "$slack_redirect_base_url"
        add_env PLAUSIBLE_SCRIPT_URL "$plausible_script_url"
        if [[ "$INPUT_APP" == "web" && "$INPUT_ENVIRONMENT" == "production" ]]; then
          add_var POSTHOG_KEY POSTHOG_KEY
          add_var POSTHOG_HOST POSTHOG_HOST
        fi
        add_secret SENTRY_DSN_WEB SENTRY_DSN_WEB
        if [[ "$INPUT_APP" == "api" ]]; then
          sentry_dsn="$(first_non_empty "$(repo_secret SENTRY_DSN_API)" "$(repo_secret SENTRY_DSN_WEB)" "$(repo_secret SENTRY_DSN)")"
          add_env SENTRY_DSN_API "$sentry_dsn"
          add_env SENTRY_DSN "$sentry_dsn"
          add_env SENTRY_PROJECT "$(first_non_empty "$(repo_var SENTRY_PROJECT_API)" "$(repo_var SENTRY_PROJECT_WEB)")"
        else
          add_var SENTRY_PROJECT SENTRY_PROJECT_WEB
        fi
        add_secret SENTRY_AUTH_TOKEN SENTRY_AUTH_TOKEN
        add_var SENTRY_ORG SENTRY_ORG

        oauth_client_config_prefixes=(
          GH
          SLACK
          NOTION
          GOOGLE
          MICROSOFT
          LINEAR
          FIGMA
          DEEL
          DOCUSIGN
          BOX
          DROPBOX
          NEON
          REDDIT
          STRAVA
          X
          VERCEL
          SENTRY
          INTERVALS_ICU
          SUPABASE
          XERO
          MONDAY
          WEBFLOW
          CANVA
          CLOUDFLARE
          HUBSPOT
          CLOSE
          META_ADS
          TIKTOK_ADS
          AHREFS
          AIRTABLE
          TODOIST
          ASANA
          POSTHOG
          QUICKBOOKS
          GUMROAD
          MERCURY
          SPOTIFY
          STRIPE
          ZOOM
        )
        for prefix in "${oauth_client_config_prefixes[@]}"; do
          add_oauth_client_config "$prefix"
        done

        add_secret GOOGLE_ADS_DEVELOPER_TOKEN GOOGLE_ADS_DEVELOPER_TOKEN
        add_secret GOOGLE_ADS_LOGIN_CUSTOMER_ID GOOGLE_ADS_LOGIN_CUSTOMER_ID
        okou_provider_secret_suffixes=(
          MAPS_GOOGLE_MAPS_TOKEN
          WEATHER_GOOGLE_WEATHER_TOKEN
          SCRAPE_FIRECRAWL_TOKEN
          WEB_SEARCH_PERPLEXITY_TOKEN
          FINANCE_APIDOJO_TOKEN
        )
        for suffix in "${okou_provider_secret_suffixes[@]}"; do
          add_secret "OKOU_${suffix}" "OKOU_${suffix}"
        done
        if [[ "$INPUT_APP" == "api" ]]; then
          add_secret OKOU_SOCIAL_SOCIALKIT_TOKEN OKOU_SOCIAL_SOCIALKIT_TOKEN
          add_secret OKOU_SEO_DATAFORSEO_LOGIN OKOU_SEO_DATAFORSEO_LOGIN
          add_secret OKOU_SEO_DATAFORSEO_PASSWORD OKOU_SEO_DATAFORSEO_PASSWORD
          add_secret OKOU_BROWSER_USE_API_KEY OKOU_BROWSER_USE_API_KEY
        fi
        add_secret STEAM_WEB_API_KEY STEAM_WEB_API_KEY
        add_secret FINICITY_APP_KEY FINICITY_APP_KEY
        add_secret FINICITY_APP_SECRET FINICITY_APP_SECRET
        add_var FINICITY_PARTNER_ID FINICITY_PARTNER_ID
        add_var VERCEL_INTEGRATION_SLUG VERCEL_INTEGRATION_SLUG
        add_var MERCURY_OAUTH_ENVIRONMENT MERCURY_OAUTH_ENVIRONMENT
        add_var MONDAY_OAUTH_APP_ID MONDAY_OAUTH_APP_ID
        add_secret STRIPE_SECRET_KEY STRIPE_SECRET_KEY
        add_var STRIPE_CONCURRENCY_PORTAL_CONFIGURATION_ID STRIPE_CONCURRENCY_PORTAL_CONFIGURATION_ID
        add_secret STRIPE_WEBHOOK_SECRET STRIPE_WEBHOOK_SECRET
        add_secret STRIPE_AUTOMATION_WEBHOOK_SECRET STRIPE_AUTOMATION_WEBHOOK_SECRET
        add_secret CLERK_WEBHOOK_SIGNING_SECRET CLERK_WEBHOOK_SIGNING_SECRET
        okou_price_var_suffixes=(
          PRICE_PRO
          PRICE_TEAM
          PRICE_USAGE_PACK_PLAN_PRO
          PRICE_USAGE_PACK_PLAN_TEAM
          PRICE_CUSTOM
          PRICE_USAGE_PACK_20
          PRICE_USAGE_PACK_50
          PRICE_USAGE_PACK_100
          PRICE_USAGE_PACK_200
          PRICE_CUSTOM_CREDITS
          PRICE_CUSTOM_CREDIT_UNIT
          PRICE_CONCURRENCY
          ONE_TIME_CAMPAIGN
        )
        for suffix in "${okou_price_var_suffixes[@]}"; do
          add_var "OKOU_${suffix}" "OKOU_${suffix}"
        done
        add_var ATOM_GRANT_PRICE ATOM_GRANT_PRICE
        add_secret AGENTPHONE_API_KEY AGENTPHONE_API_KEY
        add_var AGENTPHONE_API_BASE_URL AGENTPHONE_API_BASE_URL
        add_var AGENTPHONE_AGENT_ID AGENTPHONE_AGENT_ID
        add_var AGENTPHONE_PHONE_NUMBER AGENTPHONE_PHONE_NUMBER
        add_secret AGENTPHONE_WEBHOOK_SECRET AGENTPHONE_WEBHOOK_SECRET
        add_env APP_URL "$app_url"
        add_secret RESEND_API_KEY RESEND_API_KEY
        add_secret RESEND_WEBHOOK_SECRET RESEND_WEBHOOK_SECRET
        add_var RESEND_FROM_DOMAIN RESEND_FROM_DOMAIN
        add_var GMAIL_PUBSUB_TOPIC_NAME GMAIL_PUBSUB_TOPIC_NAME
        add_var GMAIL_PUBSUB_PUSH_AUDIENCE GMAIL_PUBSUB_PUSH_AUDIENCE
        add_var GMAIL_PUBSUB_PUSH_SERVICE_ACCOUNT_EMAIL GMAIL_PUBSUB_PUSH_SERVICE_ACCOUNT_EMAIL
        add_var GOOGLE_FORMS_PUBSUB_TOPIC_NAME GOOGLE_FORMS_PUBSUB_TOPIC_NAME
        add_var GOOGLE_FORMS_PUBSUB_PUSH_AUDIENCE GOOGLE_FORMS_PUBSUB_PUSH_AUDIENCE
        add_var GOOGLE_FORMS_PUBSUB_PUSH_SERVICE_ACCOUNT_EMAIL GOOGLE_FORMS_PUBSUB_PUSH_SERVICE_ACCOUNT_EMAIL
        add_var GOOGLE_WORKSPACE_EVENTS_PUBSUB_TOPIC_NAME GOOGLE_WORKSPACE_EVENTS_PUBSUB_TOPIC_NAME
        add_var GOOGLE_WORKSPACE_EVENTS_PUBSUB_PUSH_AUDIENCE GOOGLE_WORKSPACE_EVENTS_PUBSUB_PUSH_AUDIENCE
        add_var GOOGLE_WORKSPACE_EVENTS_PUBSUB_PUSH_SERVICE_ACCOUNT_EMAIL GOOGLE_WORKSPACE_EVENTS_PUBSUB_PUSH_SERVICE_ACCOUNT_EMAIL
        add_env GITHUB_APP_SLUG "$github_app_slug"
        add_env GITHUB_APP_ID "$github_app_id"
        add_env GITHUB_APP_CLIENT_ID "$github_app_client_id"
        add_env GITHUB_APP_CLIENT_SECRET "$github_app_client_secret"
        add_env GITHUB_APP_WEBHOOK_SECRET "$github_app_webhook_secret"
        add_env GITHUB_APP_PRIVATE_KEY "$github_app_private_key"
        add_var GCP_PROJECT_ID GCP_PROJECT_ID
        add_var GCP_PROJECT_NUMBER GCP_PROJECT_NUMBER
        add_var GCP_SERVICE_ACCOUNT_EMAIL GCP_SERVICE_ACCOUNT_EMAIL
        add_var GCP_WORKLOAD_IDENTITY_POOL_ID GCP_WORKLOAD_IDENTITY_POOL_ID
        add_var GCP_WORKLOAD_IDENTITY_POOL_PROVIDER_ID GCP_WORKLOAD_IDENTITY_POOL_PROVIDER_ID
        add_secret VERCEL_AUTOMATION_BYPASS_SECRET VERCEL_AUTOMATION_BYPASS_SECRET

        echo "file=$env_file" >> "$GITHUB_OUTPUT"
        echo "Rendered $(wc -l < "$env_file") Web/API environment variables to $env_file"
