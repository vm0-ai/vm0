name: "Runner E2E Shard"
description: "Run one isolated runner E2E shard against a selected API runtime"

inputs:
  runtime:
    description: "API runtime under test"
    required: true
  credential-index:
    description: "Credential artifact index for the shard"
    required: true
  shard-index:
    description: "One-based shard index"
    required: true
  shard-total:
    description: "Total shard count for the runtime"
    required: true
  test-files-json:
    description: "JSON array of BATS test files assigned to the shard"
    required: true
  cf-access-client-id:
    description: "Cloudflare Access service token client ID"
    required: false
  cf-access-client-secret:
    description: "Cloudflare Access service token client secret"
    required: false
  vercel-automation-bypass-secret:
    description: "Vercel preview protection bypass secret"
    required: true
  codecov-token:
    description: "Codecov upload token"
    required: true

runs:
  using: "composite"
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
      with:
        node-version: 22

    - name: Install pnpm
      shell: bash
      run: corepack enable pnpm

    - name: Install E2E dependencies
      shell: bash
      run: cd e2e && pnpm install --frozen-lockfile

    - name: Download runner E2E API tokens
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: e2e-tokens-${{ inputs.runtime }}
        path: /tmp

    - name: Setup runner E2E API credentials
      shell: bash
      env:
        E2E_RUNNER_CREDENTIAL_INDEX: ${{ inputs.credential-index }}
      run: |
        set -euo pipefail
        for credential_file in \
          /tmp/e2e-api-credentials-runner-1.json \
          /tmp/e2e-api-credentials-runner-2.json \
          /tmp/e2e-api-credentials-runner-3.json \
          /tmp/e2e-api-credentials-runner-4.json \
          /tmp/e2e-api-credentials-runner-real-codex.json \
          /tmp/e2e-api-credentials-runner-real-claude.json \
          /tmp/e2e-api-credentials-runner-mock-claude.json; do
          jq -er '.token | select(type == "string" and length > 0)' "$credential_file" >/dev/null
          jq -er '.apiUrl | select(type == "string" and length > 0)' "$credential_file" >/dev/null
        done
        : "${E2E_RUNNER_CREDENTIAL_INDEX:?runner credential index is required}"
        credential_file="/tmp/e2e-api-credentials-runner-${E2E_RUNNER_CREDENTIAL_INDEX}.json"
        token=$(jq -er '.token' "$credential_file")
        api_url=$(jq -er '.apiUrl' "$credential_file")
        organization_index=$((E2E_RUNNER_CREDENTIAL_INDEX - 1))
        echo "::add-mask::$token"
        {
          echo "E2E_API_TOKEN=$token"
          echo "E2E_API_URL=$api_url"
          echo "E2E_CLERK_ORG_ID=$(jq -er --argjson index "$organization_index" '.runnerOrganizationIds[$index]' /tmp/e2e-runner-accounts.json)"
          echo "E2E_RUNNER_CODEX_ORG_ID=$(jq -er '.codexOrganizationId' /tmp/e2e-runner-accounts.json)"
          echo "E2E_RUNNER_CLAUDE_ORG_ID=$(jq -er '.claudeOrganizationId' /tmp/e2e-runner-accounts.json)"
          echo "E2E_RUNNER_MOCK_CLAUDE_ORG_ID=$(jq -er '.mockClaudeOrganizationId' /tmp/e2e-runner-accounts.json)"
          echo "E2E_RUNNER_EMAIL=$(jq -er --argjson index "$organization_index" '.runnerEmails[$index]' /tmp/e2e-runner-accounts.json)"
          echo "E2E_RUNNER_CODEX_EMAIL=$(jq -er '.codexEmail' /tmp/e2e-runner-accounts.json)"
          echo "E2E_RUNNER_CLAUDE_EMAIL=$(jq -er '.claudeEmail' /tmp/e2e-runner-accounts.json)"
          echo "E2E_RUNNER_MOCK_CLAUDE_EMAIL=$(jq -er '.mockClaudeEmail' /tmp/e2e-runner-accounts.json)"
        } >> "$GITHUB_ENV"

    - name: Initialize runner E2E shard
      shell: bash
      env:
        E2E_RUNNER_RUNTIME: ${{ inputs.runtime }}
        E2E_RUNNER_CREDENTIAL_INDEX: ${{ inputs.credential-index }}
        E2E_RUNNER_SHARD_INDEX: ${{ inputs.shard-index }}
        E2E_RUNNER_SHARD_TOTAL: ${{ inputs.shard-total }}
        E2E_RUNNER_TEST_FILES_JSON: ${{ inputs.test-files-json }}
      run: |
        set -euo pipefail
        : "${E2E_CLERK_ORG_ID:?runner E2E organization is required}"
        : "${E2E_RUNNER_CODEX_ORG_ID:?runner Codex E2E organization is required}"
        : "${E2E_RUNNER_CLAUDE_ORG_ID:?runner Claude E2E organization is required}"
        : "${E2E_RUNNER_MOCK_CLAUDE_ORG_ID:?runner mock Claude E2E organization is required}"
        : "${E2E_RUNNER_EMAIL:?runner E2E account is required}"
        : "${E2E_RUNNER_CODEX_EMAIL:?runner Codex E2E account is required}"
        : "${E2E_RUNNER_CLAUDE_EMAIL:?runner Claude E2E account is required}"
        : "${E2E_RUNNER_MOCK_CLAUDE_EMAIL:?runner mock Claude E2E account is required}"
        : "${E2E_API_TOKEN:?runner E2E API token is required}"
        : "${E2E_API_URL:?runner E2E API URL is required}"
        : "${E2E_RUNNER_RUNTIME:?runner E2E runtime is required}"
        : "${E2E_RUNNER_CREDENTIAL_INDEX:?runner credential index is required}"
        jq -e '
          type == "array" and length > 0 and
          all(.[]; type == "string" and length > 0)
        ' <<<"$E2E_RUNNER_TEST_FILES_JSON" >/dev/null
        test_count="$(jq 'length' <<<"$E2E_RUNNER_TEST_FILES_JSON")"
        echo "Runner E2E shard ${E2E_RUNNER_SHARD_INDEX}/${E2E_RUNNER_SHARD_TOTAL} has ${test_count} file(s)"

    - name: Run runner E2E tests
      shell: bash
      env:
        E2E_RUNNER_RUNTIME: ${{ inputs.runtime }}
        E2E_RUNNER_SHARD_INDEX: ${{ inputs.shard-index }}
        E2E_RUNNER_TEST_FILES_JSON: ${{ inputs.test-files-json }}
        CF_ACCESS_CLIENT_ID: ${{ inputs.cf-access-client-id }}
        CF_ACCESS_CLIENT_SECRET: ${{ inputs.cf-access-client-secret }}
        VERCEL_AUTOMATION_BYPASS_SECRET: ${{ inputs.vercel-automation-bypass-secret }}
      run: |
        set -euo pipefail
        mapfile -t test_files < <(jq -er '.[]' <<<"$E2E_RUNNER_TEST_FILES_JSON")
        if (( ${#test_files[@]} == 0 )); then
          echo "::error::Runner E2E shard has no test files"
          exit 1
        fi

        cd e2e
        for test_file in "${test_files[@]}"; do
          if [[ ! -f "$test_file" ]]; then
            echo "::error::Runner E2E test file does not exist: $test_file"
            exit 1
          fi
        done

        result_directory="results/runner-${E2E_RUNNER_RUNTIME}-${E2E_RUNNER_SHARD_INDEX}"
        mkdir -p "$result_directory"
        BATS_TEST_TIMEOUT=240 ./test/libs/bats/bin/bats \
          -T \
          --report-formatter junit \
          --output "$result_directory" \
          "${test_files[@]}"

    - name: Print runner E2E trace log
      if: always()
      shell: bash
      run: |
        if [[ -f /tmp/e2e-trace.log ]]; then
          cat /tmp/e2e-trace.log
        fi

    - name: Upload runner E2E test results to Codecov
      if: ${{ !cancelled() }}
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
      with:
        token: ${{ inputs.codecov-token }}
        flags: e2e-runner
        files: e2e/results/runner-${{ inputs.runtime }}-${{ inputs.shard-index }}/*.xml
        report_type: test_results

    - name: Upload runner E2E JUnit XML
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: e2e-runner-junit-${{ inputs.runtime }}-${{ inputs.shard-index }}
        path: e2e/results/runner-${{ inputs.runtime }}-${{ inputs.shard-index }}/
        retention-days: 7
