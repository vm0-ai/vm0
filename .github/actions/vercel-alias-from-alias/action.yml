name: "Vercel Alias From Alias"
description: "Create a predictable alias URL that points at the deployment behind an existing Vercel alias"

inputs:
  vercel-token:
    description: "Vercel authentication token"
    required: true
  vercel-org-id:
    description: "Vercel team/org ID"
    required: true
  source-alias-url:
    description: "Existing Vercel alias URL whose deployment should receive the new alias"
    required: true
  app-name:
    description: "App identifier"
    required: true
  job-ref:
    description: "Job reference identifier (e.g., pr-123)"
    required: true
  preview-domain:
    description: "Preview domain (e.g., vm6.ai)"
    required: true

outputs:
  url:
    description: "The aliased URL"
    value: ${{ steps.alias.outputs.url }}

runs:
  using: "composite"
  steps:
    - name: Create Vercel alias from source alias
      id: alias
      shell: bash
      env:
        VERCEL_TOKEN: ${{ inputs.vercel-token }}
        VERCEL_ORG_ID: ${{ inputs.vercel-org-id }}
        SOURCE_ALIAS_URL: ${{ inputs.source-alias-url }}
        APP_NAME: ${{ inputs.app-name }}
        JOB_REF: ${{ inputs.job-ref }}
        PREVIEW_DOMAIN: ${{ inputs.preview-domain }}
      run: |
        ALIAS_URL="${JOB_REF}-${APP_NAME}.${PREVIEW_DOMAIN}"
        SOURCE_ALIAS="${SOURCE_ALIAS_URL#https://}"
        SOURCE_ALIAS="${SOURCE_ALIAS#http://}"
        SOURCE_ALIAS="${SOURCE_ALIAS%%/*}"
        SOURCE_ALIAS="${SOURCE_ALIAS%%/}"

        if [ -z "$SOURCE_ALIAS" ]; then
          echo "::error::source-alias-url is empty"
          exit 1
        fi

        echo "Creating alias: ${ALIAS_URL} -> deployment behind ${SOURCE_ALIAS}"

        RESPONSE_FILE="$(mktemp)"
        trap 'rm -f "$RESPONSE_FILE"' EXIT

        HTTP_STATUS="$(node - "$SOURCE_ALIAS" "$ALIAS_URL" "$VERCEL_ORG_ID" "$VERCEL_TOKEN" "$RESPONSE_FILE" <<'NODE'
        const fs = require("node:fs");

        function parsePayload(text) {
          try {
            return JSON.parse(text);
          } catch {
            return undefined;
          }
        }

        function responseMessage(text) {
          const payload = parsePayload(text);
          return payload?.error?.message ?? payload?.message ?? text;
        }

        async function fetchText(url, init) {
          const response = await fetch(url, init);
          return {
            status: response.status,
            text: await response.text(),
          };
        }

        function deploymentRefFromAlias(alias) {
          return (
            alias?.deploymentId ?? alias?.deployment?.id ?? alias?.deployment?.url
          );
        }

        function parentDomain(aliasRef) {
          const parts = aliasRef.split(".");
          return parts.length > 2 ? parts.slice(-2).join(".") : aliasRef;
        }

        async function getAlias(aliasRef, teamId, token) {
          const requestUrl = new URL(
            `https://api.vercel.com/v4/aliases/${encodeURIComponent(aliasRef)}`,
          );
          requestUrl.searchParams.set("teamId", teamId);

          return fetchText(requestUrl, {
            headers: {
              Authorization: `Bearer ${token}`,
              "Content-Type": "application/json",
            },
          });
        }

        async function listAliases(domain, teamId, token) {
          const requestUrl = new URL("https://api.vercel.com/v4/aliases");
          requestUrl.searchParams.set("domain", domain);
          requestUrl.searchParams.set("teamId", teamId);

          return fetchText(requestUrl, {
            headers: {
              Authorization: `Bearer ${token}`,
              "Content-Type": "application/json",
            },
          });
        }

        async function resolveAliasDeploymentRef(aliasRef, teamId, token) {
          const aliasResult = await getAlias(aliasRef, teamId, token);
          if (aliasResult.status >= 200 && aliasResult.status < 300) {
            const deploymentRef = deploymentRefFromAlias(
              parsePayload(aliasResult.text),
            );
            if (deploymentRef) {
              return deploymentRef;
            }
          } else if (aliasResult.status !== 404) {
            throw new Error(
              `Could not resolve source alias ${aliasRef}: ${responseMessage(aliasResult.text)}`,
            );
          }

          const domains = Array.from(new Set([aliasRef, parentDomain(aliasRef)]));
          let matchedAlias;

          for (const domain of domains) {
            const result = await listAliases(domain, teamId, token);
            if (result.status < 200 || result.status >= 300) {
              throw new Error(
                `Could not resolve source alias ${aliasRef}: ${responseMessage(result.text)}`,
              );
            }

            const payload = parsePayload(result.text);
            const aliases = Array.isArray(payload?.aliases)
              ? payload.aliases
              : [];
            matchedAlias = aliases.find((entry) => entry.alias === aliasRef);
            const deploymentRef = deploymentRefFromAlias(matchedAlias);
            if (deploymentRef) {
              return deploymentRef;
            }
          }

          if (matchedAlias) {
            throw new Error(
              `Could not resolve source alias ${aliasRef} to a deployment`,
            );
          }

          throw new Error(`Could not find source alias ${aliasRef}`);
        }

        function aliasesUrl(deploymentRef, teamId) {
          const requestUrl = new URL(
            `https://api.vercel.com/v2/deployments/${encodeURIComponent(deploymentRef)}/aliases`,
          );
          requestUrl.searchParams.set("teamId", teamId);
          return requestUrl;
        }

        async function assignAlias(deploymentRef, alias, teamId, token) {
          return fetchText(aliasesUrl(deploymentRef, teamId), {
            method: "POST",
            headers: {
              Authorization: `Bearer ${token}`,
              "Content-Type": "application/json",
            },
            body: JSON.stringify({ alias }),
          });
        }

        async function main() {
          const [sourceAlias, alias, teamId, token, responseFile] =
            process.argv.slice(2);
          const deploymentRef = await resolveAliasDeploymentRef(
            sourceAlias,
            teamId,
            token,
          );
          const result = await assignAlias(deploymentRef, alias, teamId, token);

          fs.writeFileSync(responseFile, result.text);
          process.stdout.write(String(result.status));
        }

        main().catch((error) => {
          fs.writeFileSync(
            process.argv[6],
            JSON.stringify({ error: { message: error.message } }),
          );
          process.stdout.write("500");
        });
        NODE
        )"

        RESPONSE_MESSAGE="$(node - "$RESPONSE_FILE" <<'NODE'
        const fs = require("node:fs");

        const raw = fs.readFileSync(process.argv[2], "utf8");
        try {
          const payload = JSON.parse(raw);
          process.stdout.write(payload.error?.message ?? payload.message ?? raw);
        } catch {
          process.stdout.write(raw);
        }
        NODE
        )"

        if [ "$HTTP_STATUS" -eq 409 ] && { [[ "$RESPONSE_MESSAGE" == *"already assigned"* ]] || [[ "$RESPONSE_MESSAGE" == *"already associated with this deployment"* ]]; }; then
          echo "Alias already exists: ${ALIAS_URL}"
          HTTP_STATUS=200
        fi

        if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
          echo "::error::Failed to create Vercel alias (${HTTP_STATUS}): ${RESPONSE_MESSAGE}"
          exit 1
        fi

        FULL_URL="https://${ALIAS_URL}"
        echo "url=${FULL_URL}" >> "$GITHUB_OUTPUT"
        echo "Alias created: ${FULL_URL}"
