name: "Vercel Build"
description: "Build application using Vercel and upload artifacts"

inputs:
  vercel-token:
    description: "Vercel authentication token"
    required: true
  vercel-org-id:
    description: "Vercel organization ID"
    required: true
  vercel-project-id:
    description: "Vercel project ID"
    required: true
  artifact-name:
    description: "Name for the build artifact"
    required: true
  environment-variables:
    description: "Environment variables for build (key=value pairs, one per line)"
    required: false
    default: ""

outputs:
  artifact-name:
    description: "Name of the uploaded artifact"
    value: ${{ inputs.artifact-name }}

runs:
  using: "composite"
  steps:
    - name: Setup Vercel
      uses: ./.github/actions/vercel-setup
      with:
        vercel-token: ${{ inputs.vercel-token }}
        vercel-org-id: ${{ inputs.vercel-org-id }}
        vercel-project-id: ${{ inputs.vercel-project-id }}

    - name: Build application
      shell: bash
      run: |
        # Build command
        BUILD_CMD="vercel build"

        # Add environment variables for build if provided
        ENV_VARS="${{ inputs.environment-variables }}"
        if [ -n "$ENV_VARS" ]; then
          echo "Setting build environment variables..."
          while IFS= read -r line; do
            # Skip empty lines
            line=$(echo "$line" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
            if [ -n "$line" ]; then
              # Extract key and value
              KEY="${line%%=*}"
              VALUE="${line#*=}"
              echo "Setting env: $KEY"
              # Export for current shell and subprocesses
              export "$KEY=$VALUE"
            fi
          done <<< "$ENV_VARS"
        fi

        # Execute build
        eval $BUILD_CMD

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        include-hidden-files: true
        path: |
          .vercel/output
          turbo/apps/*/.next
        retention-days: 7
        overwrite: true
