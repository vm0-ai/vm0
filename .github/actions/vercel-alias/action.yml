name: "Vercel Alias"
description: "Create a predictable alias URL for a Vercel deployment and optionally finish GitHub deployment"

inputs:
  vercel-token:
    description: "Vercel authentication token"
    required: true
  vercel-org-id:
    description: "Vercel team/org ID (for --scope)"
    required: true
  deployment-url:
    description: "Vercel deployment URL to alias"
    required: true
  app-name:
    description: "App identifier (web, platform, site, www)"
    required: true
  job-ref:
    description: "Job reference identifier (e.g., pr-123, staging)"
    required: true
  preview-domain:
    description: "Preview domain (e.g., vm6.ai)"
    required: true
  deployment-id:
    description: "GitHub deployment ID (if provided, will finish the deployment with alias URL)"
    required: false
    default: ""
  deployment-env:
    description: "GitHub deployment environment name (required if deployment-id is provided)"
    required: false
    default: ""

outputs:
  url:
    description: "The aliased URL"
    value: ${{ steps.alias.outputs.url }}

runs:
  using: "composite"
  steps:
    - name: Create Vercel alias
      id: alias
      shell: bash
      env:
        VERCEL_TOKEN: ${{ inputs.vercel-token }}
        VERCEL_ORG_ID: ${{ inputs.vercel-org-id }}
        DEPLOYMENT_URL: ${{ inputs.deployment-url }}
        APP_NAME: ${{ inputs.app-name }}
        JOB_REF: ${{ inputs.job-ref }}
        PREVIEW_DOMAIN: ${{ inputs.preview-domain }}
      run: |
        # Build alias URL: {job-ref}-{app}.{preview-domain}
        ALIAS_URL="${JOB_REF}-${APP_NAME}.${PREVIEW_DOMAIN}"
        DEPLOYMENT_REF="${DEPLOYMENT_URL#https://}"
        DEPLOYMENT_REF="${DEPLOYMENT_REF#http://}"
        DEPLOYMENT_REF="${DEPLOYMENT_REF%%/}"

        echo "Creating alias: ${ALIAS_URL} -> ${DEPLOYMENT_URL}"

        RESPONSE_FILE="$(mktemp)"
        HTTP_STATUS="$(node - "$DEPLOYMENT_REF" "$ALIAS_URL" "$VERCEL_ORG_ID" "$VERCEL_TOKEN" "$RESPONSE_FILE" <<'NODE'
        const fs = require("node:fs");

        function parsePayload(text) {
          try {
            return JSON.parse(text);
          } catch {
            return undefined;
          }
        }

        function responseMessage(text) {
          const payload = parsePayload(text);
          return payload?.error?.message ?? payload?.message ?? text;
        }

        async function fetchText(url, init) {
          const response = await fetch(url, init);
          return {
            status: response.status,
            text: await response.text(),
          };
        }

        function aliasesUrl(deploymentRef, teamId) {
          const requestUrl = new URL(
            `https://api.vercel.com/v2/deployments/${encodeURIComponent(deploymentRef)}/aliases`,
          );
          requestUrl.searchParams.set("teamId", teamId);
          return requestUrl;
        }

        async function assignAlias(deploymentRef, alias, teamId, token) {
          return fetchText(aliasesUrl(deploymentRef, teamId), {
            method: "POST",
            headers: {
              Authorization: `Bearer ${token}`,
              "Content-Type": "application/json",
            },
            body: JSON.stringify({ alias }),
          });
        }

        async function resolveAliasDeploymentRef(aliasRef, teamId, token) {
          const requestUrl = new URL("https://api.vercel.com/v4/aliases");
          requestUrl.searchParams.set("domain", aliasRef);
          requestUrl.searchParams.set("teamId", teamId);

          const result = await fetchText(requestUrl, {
            headers: {
              Authorization: `Bearer ${token}`,
              "Content-Type": "application/json",
            },
          });

          if (result.status < 200 || result.status >= 300) {
            throw new Error(
              `Could not resolve source alias ${aliasRef}: ${responseMessage(result.text)}`,
            );
          }

          const payload = parsePayload(result.text);
          const aliases = Array.isArray(payload?.aliases) ? payload.aliases : [];
          const alias =
            aliases.find((entry) => entry.alias === aliasRef) ?? aliases[0];
          const deploymentRef =
            alias?.deploymentId ?? alias?.deployment?.id ?? alias?.deployment?.url;

          if (!deploymentRef) {
            throw new Error(
              `Could not resolve source alias ${aliasRef} to a deployment`,
            );
          }

          return deploymentRef;
        }

        async function main() {
          const [deploymentRef, alias, teamId, token, responseFile] =
            process.argv.slice(2);

          let result = await assignAlias(deploymentRef, alias, teamId, token);
          if (result.status === 404) {
            const resolvedDeploymentRef = await resolveAliasDeploymentRef(
              deploymentRef,
              teamId,
              token,
            );
            result = await assignAlias(resolvedDeploymentRef, alias, teamId, token);
          }

          fs.writeFileSync(responseFile, result.text);
          process.stdout.write(String(result.status));
        }

        main().catch((error) => {
          fs.writeFileSync(
            process.argv[6],
            JSON.stringify({ error: { message: error.message } }),
          );
          process.stdout.write("500");
        });
        NODE
        )"

        if [ "$HTTP_STATUS" -eq 409 ]; then
          RESPONSE_MESSAGE="$(node - "$RESPONSE_FILE" <<'NODE'
        const fs = require("node:fs");

        const raw = fs.readFileSync(process.argv[2], "utf8");
        try {
          const payload = JSON.parse(raw);
          process.stdout.write(payload.error?.message ?? payload.message ?? raw);
        } catch {
          process.stdout.write(raw);
        }
        NODE
          )"
          if [[ "$RESPONSE_MESSAGE" == *"already assigned"* ]]; then
            echo "Alias already exists: ${ALIAS_URL}"
            HTTP_STATUS=200
          fi
        fi

        if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
          RESPONSE_MESSAGE="$(node - "$RESPONSE_FILE" <<'NODE'
        const fs = require("node:fs");

        const raw = fs.readFileSync(process.argv[2], "utf8");
        try {
          const payload = JSON.parse(raw);
          process.stdout.write(payload.error?.message ?? payload.message ?? raw);
        } catch {
          process.stdout.write(raw);
        }
        NODE
          )"
          echo "::error::Failed to create Vercel alias (${HTTP_STATUS}): ${RESPONSE_MESSAGE}"
          exit 1
        fi

        # Output the full URL
        FULL_URL="https://${ALIAS_URL}"
        echo "url=${FULL_URL}" >> $GITHUB_OUTPUT
        echo "Alias created: ${FULL_URL}"

    - name: Finish GitHub deployment
      if: inputs.deployment-id != ''
      uses: bobheadxi/deployments@v1
      with:
        step: finish
        token: ${{ github.token }}
        status: success
        env: ${{ inputs.deployment-env }}
        env_url: ${{ steps.alias.outputs.url }}
        deployment_id: ${{ inputs.deployment-id }}
