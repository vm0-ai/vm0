name: One-time publish presentation reverse-template guide

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/presentation-reverse-template-release/**"
      - ".github/workflows/one-time-publish-presentation-reverse-template.yml"

concurrency:
  group: one-time-publish-presentation-reverse-template-0a52be7
  cancel-in-progress: false

env:
  npm_config_audit: "false"

jobs:
  verify:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'chore/publish-presentation-reverse-template-0a52be7'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.19.0
      - name: Verify pinned release bundle
        shell: bash
        run: |
          set -euo pipefail
          release_dir="$RUNNER_TEMP/presentation-reverse-template-release"
          output_dir="$RUNNER_TEMP/presentation-reverse-template-output"
          mkdir -p "$release_dir" "$output_dir"
          cp .github/presentation-reverse-template-release/publish.mjs "$release_dir/publish.mjs"
          cp .github/presentation-reverse-template-release/presentation-reverse-template-release.json "$release_dir/presentation-reverse-template-release.json"
          cp .github/presentation-reverse-template-release/prebuilt/* "$output_dir/"
          cd "$release_dir"
          npm init --yes >/dev/null
          npm install --ignore-scripts --no-audit --no-fund \
            @aws-sdk/client-s3@3.1106.0 postgres@3.4.9 tar@7.5.22
          node publish.mjs verify --output-dir "$output_dir"
      - name: Upload verified release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: presentation-reverse-template-0a52be7
          path: ${{ runner.temp }}/presentation-reverse-template-output
          if-no-files-found: error
          retention-days: 30

  publish-production:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
      R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_USER_STORAGES_BUCKET_NAME: ${{ vars.R2_USER_STORAGES_BUCKET_NAME }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.19.0
      - name: Download verified release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: presentation-reverse-template-0a52be7
          path: ${{ runner.temp }}/presentation-reverse-template-output
      - name: Publish immutable archive and register version
        shell: bash
        run: |
          set -euo pipefail
          : "${NEON_API_KEY:?NEON_API_KEY is required}"
          : "${NEON_PROJECT_ID:?NEON_PROJECT_ID is required}"
          : "${R2_ACCOUNT_ID:?R2_ACCOUNT_ID is required}"
          : "${R2_ACCESS_KEY_ID:?R2_ACCESS_KEY_ID is required}"
          : "${R2_SECRET_ACCESS_KEY:?R2_SECRET_ACCESS_KEY is required}"
          : "${R2_USER_STORAGES_BUCKET_NAME:?R2_USER_STORAGES_BUCKET_NAME is required}"

          release_dir="$RUNNER_TEMP/presentation-reverse-template-release"
          mkdir -p "$release_dir"
          cp .github/presentation-reverse-template-release/publish.mjs "$release_dir/publish.mjs"
          cp .github/presentation-reverse-template-release/presentation-reverse-template-release.json "$release_dir/presentation-reverse-template-release.json"
          cd "$release_dir"
          npm init --yes >/dev/null
          npm install --ignore-scripts --no-audit --no-fund \
            @aws-sdk/client-s3@3.1106.0 postgres@3.4.9 tar@7.5.22

          branch_id=$(curl -fsS \
            "https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}/branches" \
            -H "Authorization: Bearer ${NEON_API_KEY}" \
            | jq -r '.branches[] | select(.name == "production") | .id')
          test -n "$branch_id"
          database_url=$(curl -fsS \
            "https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}/connection_uri?branch_id=${branch_id}&database_name=neondb&role_name=neondb_owner" \
            -H "Authorization: Bearer ${NEON_API_KEY}" \
            | jq -r '.uri')
          test -n "$database_url"

          DATABASE_URL="$database_url" node publish.mjs publish \
            --output-dir "$RUNNER_TEMP/presentation-reverse-template-output"
