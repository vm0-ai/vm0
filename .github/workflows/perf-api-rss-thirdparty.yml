name: Perf API RSS Third-Party Floor

on:
  push:
    branches:
      - "perf/api-rss-thirdparty**"

permissions:
  contents: read

concurrency:
  group: perf-api-rss-thirdparty-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ablate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ghcr.io/vm0-ai/vm0-toolchain:20260622
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1
      - uses: ./.github/actions/toolchain-init
      - name: Measure per-package floor
        run: bash .github/scripts/rss-thirdparty-floor.sh
