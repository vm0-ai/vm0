name: KMS Production Business Verification

env:
  npm_config_audit: "false"

on:
  workflow_dispatch:
    inputs:
      expected_deployment_id:
        description: "Current production API deployment ID, recorded before approval"
        required: true
        type: string
      user_id:
        description: "Approving operator's Clerk user ID (must be an org admin)"
        required: true
        type: string
      org_id:
        description: "Operator's internal organization for temporary canary fixtures"
        required: true
        type: string
      agent_id:
        description: "Existing visible agent; no agent run will be started"
        required: true
        type: string

concurrency:
  group: kms-production-operation-32264
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify-business:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - name: Install verification dependencies
        working-directory: turbo
        run: |
          corepack enable pnpm
          pnpm install --frozen-lockfile --ignore-scripts --filter @okouai/db...
          command -v aws
      - name: Verify operator rollback and deployed API ciphertext reads and writes
        working-directory: turbo/packages/db
        env:
          KMS_OPERATION: verify-business
          EXPECTED_BACKUP_SHA256: 60d1500d90c83a8b40996c3e9e6fbb9453ffbf598a9ae1c670d38f60b340e9f8
          EXPECTED_DEPLOYMENT_ID: ${{ inputs.expected_deployment_id }}
          BUSINESS_USER_ID: ${{ inputs.user_id }}
          BUSINESS_ORG_ID: ${{ inputs.org_id }}
          BUSINESS_AGENT_ID: ${{ inputs.agent_id }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY }}
          KMS_MIGRATION_ROLE_ARN: ${{ vars.KMS_MIGRATION_ROLE_ARN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ""
          AWS_REGION: ${{ vars.AWS_REGION }}
          SECRETS_KMS_KEY_ID: ${{ secrets.SECRETS_KMS_KEY_ID }}
          DOPPLER_SERVICE_IDENTITY_ID: ${{ vars.DOPPLER_SERVICE_IDENTITY_ID }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: python3 ../../../.github/scripts/kms-production-migration.py
      - name: Retain sanitized verification and cleanup checkpoint
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kms-production-business-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/kms-production-reports/*.json
          if-no-files-found: warn
          retention-days: 7
