name: Security Scanning

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read
  security-events: write

jobs:
  # Detect release-please context across all event types (PR, push, merge queue).
  detect-release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: Check for release-please
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_REF: ${{ github.head_ref || '' }}
          COMMIT_MSG: ${{ github.event.head_commit.message || '' }}
          EVENT_NAME: ${{ github.event_name }}
          MQ_HEAD_REF: ${{ github.event.merge_group.head_ref || '' }}
          REPO: ${{ github.repository }}
        run: |
          if [[ "$HEAD_REF" == release-please--branches--* ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Release-please PR detected (branch: $HEAD_REF)"
            exit 0
          fi
          if [[ "$EVENT_NAME" == "push" ]] && [[ "$COMMIT_MSG" == chore:\ release* ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Release-please push detected (message: $COMMIT_MSG)"
            exit 0
          fi
          if [[ "$EVENT_NAME" == "merge_group" ]] && [[ -n "$MQ_HEAD_REF" ]]; then
            PR_NUM=$(echo "$MQ_HEAD_REF" | grep -oE 'pr-[0-9]+' | head -1 | sed 's/pr-//')
            if [[ -n "$PR_NUM" ]]; then
              PR_BRANCH=$(gh pr view "$PR_NUM" --repo "$REPO" --json headRefName --jq .headRefName 2>/dev/null || echo "")
              if [[ "$PR_BRANCH" == release-please--branches--* ]]; then
                echo "skip=true" >> "$GITHUB_OUTPUT"
                echo "Release-please merge queue entry detected (PR #$PR_NUM, branch: $PR_BRANCH)"
                exit 0
              fi
            fi
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "Not a release-please context"

  pr-title:
    needs: [detect-release]
    name: Pull Request Title
    if: needs.detect-release.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Validate pull request title
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          MQ_HEAD_REF: ${{ github.event.merge_group.head_ref || '' }}
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          title="$(.github/scripts/resolve-pr-title.sh)"

          if [ -z "$title" ]; then
            echo "No pull request title to validate for $EVENT_NAME"
            exit 0
          fi

          .github/scripts/check-pr-title.sh "$title"

  semgrep:
    needs: [detect-release]
    name: Semgrep SAST
    # Skip for release-please PRs, commits, and merge queue entries
    if: needs.detect-release.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Trust checked out repository
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Run Semgrep
        run: sh .github/scripts/run-semgrep.sh
        env:
          EVENT_NAME: ${{ github.event_name }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

      - name: Check against baseline
        run: >-
          python3 .github/scripts/semgrep-results.py check
          "$SEMGREP_SCAN_MODE"
          .github/semgrep-baseline.json
          semgrep-results.json
        env:
          SEMGREP_SCAN_MODE: ${{ github.event_name == 'push' && 'full' || 'diff' }}

      - name: Filter Semgrep SARIF for Code Scanning upload
        if: always()
        run: >-
          python3 .github/scripts/semgrep-results.py filter
          "$SEMGREP_SCAN_MODE"
          .github/semgrep-baseline.json
          semgrep-results.sarif
          semgrep-results-for-code-scanning.sarif
        env:
          SEMGREP_SCAN_MODE: ${{ github.event_name == 'push' && 'full' || 'diff' }}

      - name: Upload Semgrep SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always() && github.event_name != 'merge_group'
        with:
          sarif_file: semgrep-results-for-code-scanning.sarif
          category: semgrep

  codeql:
    needs: [detect-release]
    name: CodeQL SAST
    # PR and main results are uploaded for CASA; merge groups cannot upload SARIF.
    if: needs.detect-release.outputs.skip != 'true' && github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          trap-caching: false
        env:
          CODEQL_ACTION_OVERLAY_DATABASE_CACHE: false

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: codeql

  pnpm-audit:
    needs: [detect-release]
    name: pnpm audit (SCA)
    # Skip for release-please PRs, commits, and merge queue entries
    if: needs.detect-release.outputs.skip != 'true'
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: turbo
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.19.0

      - name: Install pnpm
        run: corepack enable pnpm

      - name: Run pnpm audit
        run: |
          set -o pipefail
          echo "## pnpm audit results" >> "$GITHUB_STEP_SUMMARY"
          # --ignore-registry-errors: temporary workaround for transient npm registry
          # connectivity failures in CI that cause false audit failures unrelated to
          # actual vulnerability findings.
          pnpm audit --prod --ignore-registry-errors 2>&1 | tee audit-output.txt
          {
            echo '```'
            cat audit-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  actionlint:
    needs: [detect-release]
    name: Workflow Lint
    # Skip for release-please PRs, commits, and merge queue entries
    if: needs.detect-release.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install actionlint
        run: bash <(curl -fsSL --retry 5 --retry-delay 2 --retry-max-time 60 --retry-all-errors https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)

      - name: Install Ansible
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ansible-core

      - name: Run workflow script tests
        run: |
          shopt -s nullglob
          script_files=(
            .github/scripts/*.sh
            .github/scripts/tests/*.sh
          )
          bash -n "${script_files[@]}"
          shellcheck \
            .github/scripts/check-release-please-component-releases.sh \
            .github/scripts/check-workflow-shell-compatibility.sh \
            .github/scripts/cloudflare-ssh-preconnect.sh \
            .github/scripts/run-semgrep.sh \
            .github/scripts/runner-behavior-*.sh \
            .github/scripts/tests/ansible-ssh-control-path-test.sh \
            .github/scripts/tests/check-release-please-component-releases-test.sh \
            .github/scripts/tests/check-workflow-shell-compatibility-test.sh \
            .github/scripts/tests/cloudflare-ssh-preconnect-test.sh \
            .github/scripts/tests/cloudflare-ssh-proxy-test.sh \
            .github/scripts/tests/run-semgrep-test.sh \
            .github/scripts/tests/semgrep-results-test.sh \
            .github/scripts/tests/runner-behavior-balloon-test.sh
          # actionlint assumes Bash when shell is omitted and does not model the
          # sh default used by container jobs.
          .github/scripts/check-workflow-shell-compatibility.sh
          for test_script in .github/scripts/tests/*.sh; do
            bash "$test_script"
          done

      - name: Run actionlint
        run: ./actionlint

  gitleaks:
    needs: [detect-release]
    name: Gitleaks Secrets Detection
    # Skip for release-please PRs, commits, and merge queue entries
    if: needs.detect-release.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          GITLEAKS_VERSION=8.30.1
          curl -sSfL \
            --retry 5 \
            --retry-delay 2 \
            --retry-max-time 60 \
            --retry-all-errors \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar xz -C /usr/local/bin gitleaks

      - name: Run Gitleaks
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            gitleaks detect --source . --log-opts="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" --verbose --redact
          else
            gitleaks detect --source . --log-opts="HEAD~1..HEAD" --verbose --redact
          fi

  ci-gate-security:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - detect-release
      - pr-title
      - semgrep
      - codeql
      - pnpm-audit
      - actionlint
      - gitleaks
    # Always run so the gate reports an explicit result (not "skipped").
    if: always()
    steps:
      - name: Validate CI results
        env:
          EVENT_NAME: ${{ github.event_name }}
          IS_RELEASE: ${{ needs.detect-release.outputs.skip }}
        run: |
          # Auto-pass for release-please PRs, commits, and merge queue entries
          if [[ "$IS_RELEASE" == "true" ]]; then
            echo "✅ Release-please — skipping CI gate"
            exit 0
          fi
          echo "::group::CI Gate Results"
          FAILED=0

          check_result() {
            local job="$1" result="$2"
            if [ "$result" = "success" ]; then
              echo "✅ $job: $result"
            else
              echo "::error::$job: expected success, got $result"
              FAILED=1
            fi
          }

          check_result "pr-title" "${{ needs.pr-title.result }}"
          check_result "semgrep" "${{ needs.semgrep.result }}"
          if [[ "$EVENT_NAME" == "merge_group" ]]; then
            echo "⏭️ codeql: skipped (merge_group cannot upload SARIF)"
          else
            check_result "codeql" "${{ needs.codeql.result }}"
          fi
          check_result "pnpm-audit" "${{ needs.pnpm-audit.result }}"
          check_result "actionlint" "${{ needs.actionlint.result }}"
          check_result "gitleaks" "${{ needs.gitleaks.result }}"

          echo "::endgroup::"
          exit $FAILED
