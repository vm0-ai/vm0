  # Deploy API application with preview database and E2E bootstrap data
  deploy-api:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: deploy-api-${{ needs.prepare.outputs.job-ref }}
      cancel-in-progress: true
    container:
      image: ghcr.io/vm0-ai/vm0-toolchain:20260622
    needs: [prepare, deploy-stripe-listener]
    # Deploy if job-ref is set (PR or main), not a release-please commit, and anything
    # that needs a live API preview or E2E API token changed.
    # Runs in merge queue too, but skips GitHub Deployment creation (the bobheadxi/deployments action
    # cannot resolve the temporary `gh-readonly-queue/*` ref via the GitHub API).
    if: |
      always() &&
      (github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore: release')) &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) &&
      (github.event_name == 'push' || needs.deploy-stripe-listener.result == 'success') &&
      needs.prepare.outputs.job-ref != '' && (
        needs.prepare.outputs.api-changed == 'true' ||
        needs.prepare.outputs.cli-changed == 'true' ||
        needs.prepare.outputs.platform-changed == 'true' ||
        needs.prepare.outputs.crates-changed == 'true' ||
        needs.prepare.outputs.ci-changed == 'true' ||
        needs.prepare.outputs.e2e-changed == 'true'
      )
    outputs:
      preview-url: ${{ steps.api-deploy.outputs.url }}
    permissions:
      contents: read
      pull-requests: write
      issues: write
      deployments: write
      id-token: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/toolchain-init

      - name: Setup SSH for preview Stripe listener secret
        if: github.event_name != 'push'
        uses: ./.github/actions/setup-ssh-tunnel
        with:
          ssh-user: ${{ vars.AWS_METAL_RUNNER_USER }}
          ssh-hosts: ${{ secrets.AWS_METAL_RUNNER_HOSTS }}
          require-all-hosts: "false"
          ssh-key: ${{ secrets.AWS_METAL_RUNNER_SSH_KEY }}
          cf-access-client-id: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          cf-access-client-secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}

      - name: Fetch development Doppler OAuth config
        id: doppler-oauth
        uses: dopplerhq/secrets-fetch-action@v2.0.0
        with:
          auth-method: oidc
          doppler-identity-id: ${{ vars.DOPPLER_SERVICE_IDENTITY_ID }}
          doppler-project: vm0
          doppler-config: dev

      - name: Resolve API seed environment
        id: api-seed-env
        uses: ./.github/actions/web-api-env
        with:
          app: api
          environment: preview
          job-ref: ${{ needs.prepare.outputs.job-ref }}
          # Preview API routes that historically used VM0_WEB_URL now stay on
          # the matching preview API instead of depending on a PR WWW proxy.
          web-url: ${{ needs.prepare.outputs.api-preview-url }}
          app-url: ${{ needs.prepare.outputs.app-preview-url }}
          api-backend-url: ${{ needs.prepare.outputs.api-preview-url }}
          cli-pkg-url: https://static.vm0.io/okou-cli/${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}/package.tgz
        env:
          REPO_VARS_JSON: ${{ toJSON(vars) }}
          REPO_SECRETS_JSON: ${{ toJSON(secrets) }}
          DOPPLER_SECRETS_JSON: ${{ toJSON(steps.doppler-oauth.outputs) }}

      - name: Create Neon Branch
        id: neon
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          WEB_API_ENV_FILE: ${{ steps.api-seed-env.outputs.file }}
          ANTHROPIC_API_KEY: ${{ secrets.CI_ANTHROPIC_API_KEY }}
          DEV_MODEL_ANTHROPIC_KEY: ${{ secrets.CI_ANTHROPIC_API_KEY }}
          DEV_MODEL_OPENAI_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEV_MODEL_OPENROUTER_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          DEV_MODEL_DEEPSEEK_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEV_MODEL_MOONSHOT_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          DEV_MODEL_MINIMAX_KEY: ${{ secrets.MINIMAX_API_KEY }}
        run: |
          while IFS= read -r line; do
            if [ -n "$line" ]; then
              key="${line%%=*}"
              value="${line#*=}"
              export "$key=$value"
            fi
          done < "$WEB_API_ENV_FILE"

          required_seed_env=(
            DEV_MODEL_ANTHROPIC_KEY
            DEV_MODEL_OPENAI_KEY
            DEV_MODEL_OPENROUTER_KEY
            DEV_MODEL_DEEPSEEK_KEY
            DEV_MODEL_MOONSHOT_KEY
            DEV_MODEL_MINIMAX_KEY
          )
          missing_seed_env=()
          for key in "${required_seed_env[@]}"; do
            value="${!key:-}"
            if [ -z "$value" ]; then
              missing_seed_env+=("$key")
            fi
          done
          if [ "${#missing_seed_env[@]}" -gt 0 ]; then
            printf '::error::Missing preview seed model key env(s): %s\n' "${missing_seed_env[*]}"
            exit 1
          fi

          npm install -g neonctl@2.15.0

          # On pushes to main, migrate the test project's default (parent) branch
          # BEFORE creating/resetting the preview branch off it. Neon branches are
          # copy-on-write, so a preview branched from an already-migrated parent
          # inherits the up-to-date schema and its own db:migrate below becomes a
          # near no-op -- this is what keeps preview migrate (and deploy-api) fast.
          # Safe by construction: this job has no `environment: production`, so
          # NEON_PROJECT_ID resolves to the Neon TEST project, never production.
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF" = "refs/heads/main" ]; then
            echo "main push: pre-migrating test project default (parent) branch"
            PARENT_DATABASE_URL=$(neonctl connection-string --project-id "$NEON_PROJECT_ID" --database-name neondb --role-name neondb_owner --pooled)
            if [ -z "$PARENT_DATABASE_URL" ]; then
              PARENT_DATABASE_URL=$(neonctl connection-string --project-id "$NEON_PROJECT_ID" --database-name neondb --role-name neondb_owner)
            fi
            (cd turbo && DATABASE_URL="$PARENT_DATABASE_URL" pnpm -F @vm0/db db:migrate)
          fi

          BRANCH_NAME="preview/${{ needs.prepare.outputs.job-ref }}"

          if neonctl branches list --project-id "$NEON_PROJECT_ID" --output json | jq -e --arg name "$BRANCH_NAME" '.[] | select(.name == $name)' > /dev/null; then
            neonctl branches reset "$BRANCH_NAME" --project-id "$NEON_PROJECT_ID" --parent

            for attempt in {1..30}; do
              CURRENT_STATE=$(neonctl branches list --project-id "$NEON_PROJECT_ID" --output json | jq -r --arg name "$BRANCH_NAME" '.[] | select(.name == $name) | .current_state')
              [ "$CURRENT_STATE" = "ready" ] && break
              echo "Branch state: $CURRENT_STATE (attempt $attempt/30)"
              sleep 2
            done
          else
            neonctl branches create --name "$BRANCH_NAME" --project-id "$NEON_PROJECT_ID"
          fi

          DATABASE_URL=$(neonctl connection-string "$BRANCH_NAME" --project-id "$NEON_PROJECT_ID" --database-name neondb --role-name neondb_owner --pooled)
          if [ -z "$DATABASE_URL" ]; then
            DATABASE_URL=$(neonctl connection-string "$BRANCH_NAME" --project-id "$NEON_PROJECT_ID" --database-name neondb --role-name neondb_owner)
          fi

          cd turbo
          DATABASE_URL="$DATABASE_URL" pnpm -F @vm0/db db:migrate
          ENV=preview DATABASE_URL="$DATABASE_URL" pnpm -F api db:dev-seed

          echo "database-url=$DATABASE_URL" >> "$GITHUB_OUTPUT"

      - name: Resolve API deploy environment
        id: api-deploy-env
        uses: ./.github/actions/web-api-env
        with:
          app: api
          environment: preview
          database-url: ${{ steps.neon.outputs.database-url }}
          job-ref: ${{ needs.prepare.outputs.job-ref }}
          # Keep the deployed API environment aligned with the seed environment.
          web-url: ${{ needs.prepare.outputs.api-preview-url }}
          app-url: ${{ needs.prepare.outputs.app-preview-url }}
          api-backend-url: ${{ needs.prepare.outputs.api-preview-url }}
          cli-pkg-url: https://static.vm0.io/okou-cli/${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}/package.tgz
        env:
          REPO_VARS_JSON: ${{ toJSON(vars) }}
          REPO_SECRETS_JSON: ${{ toJSON(secrets) }}
          DOPPLER_SECRETS_JSON: ${{ toJSON(steps.doppler-oauth.outputs) }}

      - name: Use preview Stripe listener webhook secret
        if: github.event_name != 'push'
        env:
          API_ENV_FILE: ${{ steps.api-deploy-env.outputs.file }}
          METAL_USER: ${{ vars.AWS_METAL_RUNNER_USER }}
          METAL_HOSTS: ${{ secrets.AWS_METAL_RUNNER_HOSTS }}
          JOB_REF: ${{ needs.prepare.outputs.job-ref }}
        run: |
          set -euo pipefail

          stripe_listener_host="$(printf '%s\n' "$METAL_HOSTS" | tr ',' '\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | sed '/^$/d' | head -n 1)"
          if [[ -z "$stripe_listener_host" ]]; then
            echo "::error::AWS_METAL_RUNNER_HOSTS is empty"
            exit 1
          fi

          remote="${METAL_USER}@${stripe_listener_host}"
          secret_file="/var/lib/vm0-runner/stripe/${JOB_REF}/webhook-secret"
          stripe_webhook_secret="$(
            printf '%s\n' "$secret_file" |
              ssh "$remote" 'read -r secret_file; sudo cat -- "$secret_file"'
          )"
          echo "::add-mask::$stripe_webhook_secret"
          if [[ "$stripe_webhook_secret" != whsec_* ]]; then
            echo "::error::Stripe listener did not provide a webhook secret"
            exit 1
          fi

          grep -q '^STRIPE_WEBHOOK_SECRET=' "$API_ENV_FILE" || {
            echo "::error::Resolved API environment is missing STRIPE_WEBHOOK_SECRET"
            exit 1
          }
          updated_env="$(mktemp)"
          while IFS= read -r line || [[ -n "$line" ]]; do
            if [[ "$line" == STRIPE_WEBHOOK_SECRET=* ]]; then
              printf 'STRIPE_WEBHOOK_SECRET=%s\n' "$stripe_webhook_secret"
            else
              printf '%s\n' "$line"
            fi
          done < "$API_ENV_FILE" > "$updated_env"
          mv "$updated_env" "$API_ENV_FILE"

      - name: Build Worker secret shards
        id: worker-secrets
        env:
          API_ENV_FILE: ${{ steps.api-deploy-env.outputs.file }}
          CF_ACCESS_TEAM_DOMAIN: ${{ vars.CF_ACCESS_TEAM_DOMAIN }}
          TEST_ENDPOINT_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set -euo pipefail
          : "${TEST_ENDPOINT_BYPASS_SECRET:?VERCEL_AUTOMATION_BYPASS_SECRET is required}"
          : "${CF_ACCESS_TEAM_DOMAIN:?CF_ACCESS_TEAM_DOMAIN variable is required}"
          grep -Fxq 'ENV=preview' "$API_ENV_FILE" || {
            echo "::error::Worker API environment must be preview"
            exit 1
          }
          grep -Fxq "VERCEL_AUTOMATION_BYPASS_SECRET=${TEST_ENDPOINT_BYPASS_SECRET}" "$API_ENV_FILE" || {
            echo "::error::Worker test endpoint bypass secret does not match the CI caller"
            exit 1
          }
          grep -q '^CF_ACCESS_CLIENT_ID=.' "$API_ENV_FILE" || {
            echo "::error::CF_API_PREVIEW_ACCESS_CLIENT_ID secret is required"
            exit 1
          }
          grep -q '^CF_ACCESS_CLIENT_SECRET=.' "$API_ENV_FILE" || {
            echo "::error::CF_API_PREVIEW_ACCESS_CLIENT_SECRET secret is required"
            exit 1
          }
          grep -q '^CF_ACCESS_AUD=.' "$API_ENV_FILE" || {
            echo "::error::CF_API_PREVIEW_ACCESS_AUD variable is required"
            exit 1
          }
          grep -Fxq "CF_ACCESS_TEAM_DOMAIN=${CF_ACCESS_TEAM_DOMAIN}" "$API_ENV_FILE" || {
            echo "::error::CF_ACCESS_TEAM_DOMAIN variable is missing or inconsistent"
            exit 1
          }

          case "$CF_ACCESS_TEAM_DOMAIN" in
            https://*) access_origin="${CF_ACCESS_TEAM_DOMAIN%/}" ;;
            *) access_origin="https://${CF_ACCESS_TEAM_DOMAIN%/}" ;;
          esac
          access_jwks="$(curl \
            --fail \
            --show-error \
            --silent \
            --max-time 30 \
            --retry 3 \
            --retry-delay 2 \
            --retry-all-errors \
            "${access_origin}/cdn-cgi/access/certs" | jq -ce '
              select(
                (.keys | type) == "array" and
                (.keys | length) > 0 and
                all(.keys[];
                  .kty == "RSA" and
                  .alg == "RS256" and
                  .use == "sig" and
                  ((.kid | type) == "string") and
                  ((.e | type) == "string") and
                  ((.n | type) == "string")
                )
              ) | {keys}
            ')"
          printf 'CF_ACCESS_JWKS=%s\n' "$access_jwks" >> "$API_ENV_FILE"

          pnpm --dir turbo --filter api worker:secrets:test
          secrets_file="${RUNNER_TEMP}/vm0-api-worker-secrets.json"
          node turbo/apps/api/scripts/build-worker-secrets.mjs "$API_ENV_FILE" "$secrets_file"
          echo "file=$secrets_file" >> "$GITHUB_OUTPUT"

      - name: Deploy API Worker Preview
        id: api-deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_WORKER_DEPLOY_API_TOKEN }}
          CF_WORKERS_SUBDOMAIN: ${{ vars.CF_WORKERS_SUBDOMAIN }}
          JOB_REF: ${{ needs.prepare.outputs.job-ref }}
          WORKER_SECRETS_FILE: ${{ steps.worker-secrets.outputs.file }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.json
        run: |
          set -euo pipefail
          : "${CLOUDFLARE_ACCOUNT_ID:?CF_ACCOUNT_ID variable is required}"
          : "${CLOUDFLARE_API_TOKEN:?CF_API_WORKER_DEPLOY_API_TOKEN secret is required}"
          : "${CF_WORKERS_SUBDOMAIN:?CF_WORKERS_SUBDOMAIN variable is required}"

          upload_log="${RUNNER_TEMP}/vm0-api-worker-upload.log"
          pnpm --dir turbo --filter api exec wrangler versions upload \
            --env preview \
            --preview-alias "$JOB_REF" \
            --secrets-file "$WORKER_SECRETS_FILE" \
            --upload-source-maps 2>&1 | tee "$upload_log"

          version_id="$(jq -rs '[.[] | select(.type == "version-upload")][0].version_id // empty' "$WRANGLER_OUTPUT_FILE_PATH")"
          if [[ -z "$version_id" ]]; then
            echo "::error::Wrangler did not report an uploaded Worker version id"
            cat "$WRANGLER_OUTPUT_FILE_PATH"
            exit 1
          fi
          startup_time_ms="$(grep -oE 'Worker Startup Time: [0-9]+ ms' "$upload_log" | tail -1 | grep -oE '[0-9]+' || true)"
          if [[ -z "$startup_time_ms" || "$startup_time_ms" -ge 1000 ]]; then
            echo "::error::Worker startup time must be reported below 1000 ms; got ${startup_time_ms:-missing}"
            exit 1
          fi
          expected_url="https://${JOB_REF}-vm0-api-preview.${CF_WORKERS_SUBDOMAIN}.workers.dev"
          url="$(jq -rs '[.[] | select(.type == "version-upload")][0].preview_alias_url // empty' "$WRANGLER_OUTPUT_FILE_PATH")"
          if [[ "$url" != "$expected_url" ]]; then
            echo "::error::Wrangler preview alias URL mismatch: expected ${expected_url}, got ${url:-missing}"
            exit 1
          fi
          CF_API_WORKER_NAME=vm0-api-preview \
            TARGET_VERSION_ID="$version_id" \
            bash .github/scripts/api-worker-version.sh verify-runtime
          {
            echo "url=$url"
            echo "version-id=$version_id"
            echo "startup-time-ms=$startup_time_ms"
          } >> "$GITHUB_OUTPUT"
          echo "Uploaded vm0-api-preview version ${version_id} at ${url} (startup ${startup_time_ms} ms)"

      # `wrangler versions upload` does not apply the non-versioned
      # workers.dev/Preview URL routing settings from wrangler.jsonc. Reconcile
      # only those settings without deploying the version or cron triggers.
      - name: Reconcile API Worker Preview routing
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_WORKER_DEPLOY_API_TOKEN }}
        run: |
          set -euo pipefail
          : "${CLOUDFLARE_ACCOUNT_ID:?CF_ACCOUNT_ID variable is required}"
          : "${CLOUDFLARE_API_TOKEN:?CF_API_WORKER_DEPLOY_API_TOKEN secret is required}"

          response="$(curl \
            --request POST \
            --fail-with-body \
            --show-error \
            --silent \
            --max-time 30 \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data '{"enabled":false,"previews_enabled":true}' \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/vm0-api-preview/subdomain")"
          jq -e '
            .success == true and
            .result.enabled == false and
            .result.previews_enabled == true
          ' <<< "$response" >/dev/null || {
            echo "::error::Cloudflare did not enable API Worker Preview URLs"
            exit 1
          }

      - name: Check API Worker Access and health
        env:
          API_DEPLOYMENT_URL: ${{ steps.api-deploy.outputs.url }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_API_PREVIEW_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_API_PREVIEW_ACCESS_CLIENT_SECRET }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set -euo pipefail
          : "${CF_ACCESS_CLIENT_ID:?CF_API_PREVIEW_ACCESS_CLIENT_ID secret is required}"
          : "${CF_ACCESS_CLIENT_SECRET:?CF_API_PREVIEW_ACCESS_CLIENT_SECRET secret is required}"

          unauthenticated_status="$(curl \
            --output /dev/null \
            --silent \
            --max-time 20 \
            --write-out '%{http_code}' \
            "${API_DEPLOYMENT_URL}/health")"
          if [[ "$unauthenticated_status" == "200" ]]; then
            echo "::error::Worker Preview health is reachable without Cloudflare Access"
            exit 1
          fi

          expected_commit_sha="$(git rev-parse --verify HEAD)"
          build_info=""
          alias_ready="false"
          for attempt in {1..10}; do
            if build_info="$(curl "${API_DEPLOYMENT_URL}/api/build-info" \
              -H "CF-Access-Client-Id: ${CF_ACCESS_CLIENT_ID}" \
              -H "CF-Access-Client-Secret: ${CF_ACCESS_CLIENT_SECRET}" \
              --fail \
              --show-error \
              --silent \
              --max-time 20)" &&
              jq -e --arg expected "$expected_commit_sha" \
                '.commitSha == $expected' <<< "$build_info" >/dev/null; then
              alias_ready="true"
              break
            fi
            echo "Worker Preview alias has not reached this commit (attempt ${attempt}/10)"
            sleep 3
          done
          if [[ "$alias_ready" != "true" ]]; then
            echo "::error::Worker Preview alias did not reach commit ${expected_commit_sha}; last build info: ${build_info:-unavailable}"
            exit 1
          fi

          curl "${API_DEPLOYMENT_URL}/health" \
            -H "CF-Access-Client-Id: ${CF_ACCESS_CLIENT_ID}" \
            -H "CF-Access-Client-Secret: ${CF_ACCESS_CLIENT_SECRET}" \
            --fail \
            --show-error \
            --silent \
            --max-time 20 \
            --retry 3 \
            --retry-delay 2 \
            --retry-all-errors

          webhook_status="$(curl \
            --output /dev/null \
            --silent \
            --max-time 20 \
            --write-out '%{http_code}' \
            "${API_DEPLOYMENT_URL}/api/webhooks/clerk")"
          if [[ "$webhook_status" == "302" || "$webhook_status" == "403" ]]; then
            echo "::error::Webhook path is unexpectedly blocked by Cloudflare Access"
            exit 1
          fi

      - name: Verify API Worker Stripe webhook signing
        if: github.event_name != 'push'
        env:
          API_DEPLOYMENT_URL: ${{ steps.api-deploy.outputs.url }}
          API_ENV_FILE: ${{ steps.api-deploy-env.outputs.file }}
        run: |
          set -euo pipefail

          stripe_webhook_secret="$(sed -n 's/^STRIPE_WEBHOOK_SECRET=//p' "$API_ENV_FILE")"
          echo "::add-mask::$stripe_webhook_secret"
          if [[ "$stripe_webhook_secret" != whsec_* ]]; then
            echo "::error::Deployed API environment is missing the Stripe webhook secret"
            exit 1
          fi

          probe_body='{"id":"evt_vm0_worker_preview_probe","object":"event","type":"vm0.worker-preview.probe","data":{"object":{}}}'
          probe_timestamp="$(date +%s)"
          probe_signature="$(
            STRIPE_PROBE_SECRET="$stripe_webhook_secret" \
            STRIPE_PROBE_BODY="$probe_body" \
            STRIPE_PROBE_TIMESTAMP="$probe_timestamp" \
              node <<'NODE'
          const { createHmac } = require("node:crypto");

          const secret = process.env.STRIPE_PROBE_SECRET;
          const body = process.env.STRIPE_PROBE_BODY;
          const timestamp = process.env.STRIPE_PROBE_TIMESTAMP;
          if (!secret || !body || !timestamp) {
            throw new Error("Stripe probe inputs are required");
          }
          process.stdout.write(
            createHmac("sha256", secret)
              .update(`${timestamp}.${body}`)
              .digest("hex"),
          );
          NODE
          )"

          curl "${API_DEPLOYMENT_URL}/api/webhooks/stripe" \
            --fail-with-body \
            --show-error \
            --silent \
            --max-time 30 \
            -H 'Content-Type: application/json' \
            -H "stripe-signature: t=${probe_timestamp},v1=${probe_signature}" \
            --data-binary "$probe_body"

      - name: Probe Worker outbound safety
        env:
          API_DEPLOYMENT_URL: ${{ steps.api-deploy.outputs.url }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_API_PREVIEW_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_API_PREVIEW_ACCESS_CLIENT_SECRET }}
          TEST_ENDPOINT_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set -euo pipefail

          response="$(curl "${API_DEPLOYMENT_URL}/api/test/worker-runtime/outbound-safety" \
            --fail \
            --show-error \
            --silent \
            --max-time 30 \
            -H 'Content-Type: application/json' \
            -H "CF-Access-Client-Id: ${CF_ACCESS_CLIENT_ID}" \
            -H "CF-Access-Client-Secret: ${CF_ACCESS_CLIENT_SECRET}" \
            -H "x-vm0-test-endpoint-bypass: ${TEST_ENDPOINT_BYPASS_SECRET}" \
            --data '{}')"
          jq -e '
            .ok == true and
            .dns_private_address_blocked == true and
            .native_private_fetch_blocked == true
          ' <<< "$response" >/dev/null || {
            echo "::error::Worker outbound safety probe failed: ${response}"
            exit 1
          }

      # Worker preview aliases do not run cron schedules. Reconcile directly
      # before allowing downstream runner and E2E consumers to start.
      - name: Reconcile preview connector catalog
        env:
          API_DEPLOYMENT_URL: ${{ steps.api-deploy.outputs.url }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_API_PREVIEW_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_API_PREVIEW_ACCESS_CLIENT_SECRET }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set -euo pipefail

          response=""
          for attempt in 1 2 3; do
            if ! response=$(curl \
              --fail-with-body \
              --show-error \
              --silent \
              --max-time 120 \
              -H "Authorization: Bearer ${CRON_SECRET}" \
              -H "CF-Access-Client-Id: ${CF_ACCESS_CLIENT_ID}" \
              -H "CF-Access-Client-Secret: ${CF_ACCESS_CLIENT_SECRET}" \
              "${API_DEPLOYMENT_URL}/api/cron/sync-connector-catalog"); then
              echo "::warning::Connector catalog reconcile request failed (attempt ${attempt}/3)"
            elif summary=$(jq -c '{
              outcome,
              state,
              active,
              lastAttempt,
              filtering: {
                capabilityDigest: .filtering.capabilityDigest,
                evaluatedAt: .filtering.evaluatedAt,
                stale: .filtering.stale,
                filteredAuthMethodCount: (.filtering.filteredAuthMethods | length)
              }
            }' <<< "$response"); then
              echo "Connector catalog reconcile: ${summary}"

              if jq -e '
                .state == "current"
                and .active != null
                and .filtering.stale == false
              ' <<< "$response" >/dev/null; then
                exit 0
              fi
              echo "::warning::Connector catalog is not ready (attempt ${attempt}/3)"
            else
              echo "::warning::Connector catalog reconcile returned invalid JSON (attempt ${attempt}/3)"
            fi

            if [ "$attempt" -lt 3 ]; then
              sleep 2
            fi
          done

          echo "::error::Connector catalog reconcile did not produce a current accepted snapshot"
          exit 1

      # System-skill migrations can touch the full catalog. The route performs
      # a bounded batch per invocation so it stays below Worker CPU and memory
      # limits; preview CI drives those batches to convergence before E2E.
      - name: Converge preview system skills
        env:
          API_DEPLOYMENT_URL: ${{ steps.api-deploy.outputs.url }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_API_PREVIEW_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_API_PREVIEW_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail

          for attempt in $(seq 1 64); do
            response="$(curl "${API_DEPLOYMENT_URL}/api/cron/sync-skills" \
              --fail-with-body \
              --show-error \
              --silent \
              --max-time 180 \
              -H "Authorization: Bearer ${CRON_SECRET}" \
              -H "CF-Access-Client-Id: ${CF_ACCESS_CLIENT_ID}" \
              -H "CF-Access-Client-Secret: ${CF_ACCESS_CLIENT_SECRET}")"
            summary="$(jq -c '{
              commitSha,
              synced,
              skipped,
              failed,
              removed,
              remaining,
              total
            }' <<< "$response")"
            echo "System skill convergence ${attempt}/64: ${summary}"

            jq -e '
              .success == true and
              (.remaining | type == "number") and
              (.failed | type == "number")
            ' <<< "$response" >/dev/null || {
              echo "::error::System skill convergence returned an invalid response"
              exit 1
            }
            if jq -e '.remaining == 0 and .failed == 0' <<< "$response" >/dev/null; then
              exit 0
            fi
          done

          echo "::error::System skills did not converge after 64 bounded invocations"
          exit 1

      - name: Simulate Worker cron routes
        env:
          API_DEPLOYMENT_URL: ${{ steps.api-deploy.outputs.url }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_API_PREVIEW_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_API_PREVIEW_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail

          mapfile -t cron_routes < <(
            pnpm --dir turbo --filter api worker:cron-routes |
              grep '^/api/cron/' |
              grep -v -E '^/api/cron/(sync-connector-catalog|sync-skills)$'
          )
          expected_cron_routes="$(jq '[
            .crons[].path |
            select(
              . != "/api/cron/sync-connector-catalog" and
              . != "/api/cron/sync-skills"
            )
          ] | unique | length' turbo/apps/api/vercel.json)"
          if [[ "${#cron_routes[@]}" -ne "$expected_cron_routes" ]]; then
            echo "::error::Expected ${expected_cron_routes} remaining cron routes, found ${#cron_routes[@]}"
            exit 1
          fi

          cron_diagnostics_dir="$(mktemp -d)"
          run_cron_route() {
            local path="$1"
            local name="${path#/api/cron/}"
            local status

            status="$(curl "${API_DEPLOYMENT_URL}${path}" \
              --show-error \
              --silent \
              --output "${cron_diagnostics_dir}/${name}.body" \
              --dump-header "${cron_diagnostics_dir}/${name}.headers" \
              --write-out '%{http_code}' \
              --max-time 180 \
              -H "Authorization: Bearer ${CRON_SECRET}" \
              -H "CF-Access-Client-Id: ${CF_ACCESS_CLIENT_ID}" \
              -H "CF-Access-Client-Secret: ${CF_ACCESS_CLIENT_SECRET}")"
            printf '%s' "$status" > "${cron_diagnostics_dir}/${name}.status"
            [[ "$status" =~ ^2[0-9][0-9]$ ]]
          }

          failures=0
          for ((offset = 0; offset < ${#cron_routes[@]}; offset += 6)); do
            pids=()
            paths=()
            for path in "${cron_routes[@]:offset:6}"; do
              echo "Simulating ${path}"
              run_cron_route "$path" &
              pids+=("$!")
              paths+=("$path")
            done
            for index in "${!pids[@]}"; do
              if ! wait "${pids[$index]}"; then
                path="${paths[$index]}"
                name="${path#/api/cron/}"
                http_status="$(cat "${cron_diagnostics_dir}/${name}.status" 2>/dev/null || echo unavailable)"
                error_summary="$(sed -n \
                  's/^[Xx]-[Vv][Mm]0-[Pp]review-[Ee]rror-[Ss]ummary:[[:space:]]*//p' \
                  "${cron_diagnostics_dir}/${name}.headers" 2>/dev/null | tr -d '\r' || true)"
                response_body="$(head -c 500 \
                  "${cron_diagnostics_dir}/${name}.body" 2>/dev/null | tr '\r\n' ' ' || true)"
                echo "::error::Cron simulation failed for ${path} with HTTP ${http_status}"
                if [[ -n "$error_summary" ]]; then
                  echo "Sanitized preview error for ${path}: ${error_summary}"
                fi
                if [[ -n "$response_body" ]]; then
                  echo "Response body for ${path}: ${response_body}"
                fi
                failures=$((failures + 1))
              fi
            done
          done

          if [[ "$failures" -ne 0 ]]; then
            echo "::error::${failures} Worker cron route simulations failed"
            exit 1
          fi

      - name: Post API preview URL
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: api-preview
          message: |
            API Worker preview: ${{ steps.api-deploy.outputs.url }}

  # Keep the Vercel rollback runtime deployable from every candidate commit.
  # It owns an isolated database, app origin, Stripe listener, and E2E identity
  # namespace so the Worker and Vercel lanes can execute concurrently.
  deploy-api-vercel:
    name: deploy-api (vercel)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: deploy-api-vercel-${{ needs.prepare.outputs.job-ref }}
      cancel-in-progress: true
    container:
      image: ghcr.io/vm0-ai/vm0-toolchain:20260622
    needs: [prepare, deploy-stripe-listener]
    if: |
      always() &&
      (github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore: release')) &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) &&
      (github.event_name == 'push' || needs.deploy-stripe-listener.result == 'success') &&
      needs.prepare.outputs.job-ref != '' && (
        needs.prepare.outputs.api-changed == 'true' ||
        needs.prepare.outputs.cli-changed == 'true' ||
        needs.prepare.outputs.platform-changed == 'true' ||
        needs.prepare.outputs.crates-changed == 'true' ||
        needs.prepare.outputs.ci-changed == 'true' ||
        needs.prepare.outputs.e2e-changed == 'true'
      )
    outputs:
      preview-url: ${{ steps.api-preview.outputs.url }}
    permissions:
      contents: read
      pull-requests: write
      issues: write
      deployments: write
      id-token: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/toolchain-init

      - name: Setup SSH for Vercel preview Stripe listener secret
        if: github.event_name != 'push'
        uses: ./.github/actions/setup-ssh-tunnel
        with:
          ssh-user: ${{ vars.AWS_METAL_RUNNER_USER }}
          ssh-hosts: ${{ secrets.AWS_METAL_RUNNER_HOSTS }}
          require-all-hosts: "false"
          ssh-key: ${{ secrets.AWS_METAL_RUNNER_SSH_KEY }}
          cf-access-client-id: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          cf-access-client-secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}

      - name: Fetch development Doppler OAuth config
        id: doppler-oauth
        uses: dopplerhq/secrets-fetch-action@451892f16195f9ac360e1a5bcbf0b5fd0e957534 # v2.0.0
        with:
          auth-method: oidc
          doppler-identity-id: ${{ vars.DOPPLER_SERVICE_IDENTITY_ID }}
          doppler-project: vm0
          doppler-config: dev

      - name: Resolve Vercel API seed environment
        id: api-seed-env
        uses: ./.github/actions/web-api-env
        with:
          app: api
          environment: preview
          job-ref: ${{ format('{0}-vercel', needs.prepare.outputs.job-ref) }}
          web-url: ${{ needs.prepare.outputs.vercel-api-preview-url }}
          app-url: ${{ needs.prepare.outputs.vercel-app-preview-url }}
          api-backend-url: ${{ needs.prepare.outputs.vercel-api-preview-url }}
          cli-pkg-url: https://static.vm0.io/okou-cli/${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}/package.tgz
        env:
          REPO_VARS_JSON: ${{ toJSON(vars) }}
          REPO_SECRETS_JSON: ${{ toJSON(secrets) }}
          DOPPLER_SECRETS_JSON: ${{ toJSON(steps.doppler-oauth.outputs) }}

      - name: Create isolated Vercel Neon branch
        id: neon
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          WEB_API_ENV_FILE: ${{ steps.api-seed-env.outputs.file }}
          ANTHROPIC_API_KEY: ${{ secrets.CI_ANTHROPIC_API_KEY }}
          DEV_MODEL_ANTHROPIC_KEY: ${{ secrets.CI_ANTHROPIC_API_KEY }}
          DEV_MODEL_OPENAI_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEV_MODEL_OPENROUTER_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          DEV_MODEL_DEEPSEEK_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEV_MODEL_MOONSHOT_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          DEV_MODEL_MINIMAX_KEY: ${{ secrets.MINIMAX_API_KEY }}
        run: |
          while IFS= read -r line; do
            if [ -n "$line" ]; then
              key="${line%%=*}"
              value="${line#*=}"
              export "$key=$value"
            fi
          done < "$WEB_API_ENV_FILE"

          required_seed_env=(
            DEV_MODEL_ANTHROPIC_KEY
            DEV_MODEL_OPENAI_KEY
            DEV_MODEL_OPENROUTER_KEY
            DEV_MODEL_DEEPSEEK_KEY
            DEV_MODEL_MOONSHOT_KEY
            DEV_MODEL_MINIMAX_KEY
          )
          missing_seed_env=()
          for key in "${required_seed_env[@]}"; do
            value="${!key:-}"
            if [ -z "$value" ]; then
              missing_seed_env+=("$key")
            fi
          done
          if [ "${#missing_seed_env[@]}" -gt 0 ]; then
            printf '::error::Missing preview seed model key env(s): %s\n' "${missing_seed_env[*]}"
            exit 1
          fi

          npm install -g neonctl@2.15.0
          BRANCH_NAME="preview/${{ needs.prepare.outputs.job-ref }}-vercel"

          if neonctl branches list --project-id "$NEON_PROJECT_ID" --output json | jq -e --arg name "$BRANCH_NAME" '.[] | select(.name == $name)' > /dev/null; then
            neonctl branches reset "$BRANCH_NAME" --project-id "$NEON_PROJECT_ID" --parent

            for attempt in {1..30}; do
              CURRENT_STATE=$(neonctl branches list --project-id "$NEON_PROJECT_ID" --output json | jq -r --arg name "$BRANCH_NAME" '.[] | select(.name == $name) | .current_state')
              [ "$CURRENT_STATE" = "ready" ] && break
              echo "Branch state: $CURRENT_STATE (attempt $attempt/30)"
              sleep 2
            done
          else
            neonctl branches create --name "$BRANCH_NAME" --project-id "$NEON_PROJECT_ID"
          fi

          DATABASE_URL=$(neonctl connection-string "$BRANCH_NAME" --project-id "$NEON_PROJECT_ID" --database-name neondb --role-name neondb_owner --pooled)
          if [ -z "$DATABASE_URL" ]; then
            DATABASE_URL=$(neonctl connection-string "$BRANCH_NAME" --project-id "$NEON_PROJECT_ID" --database-name neondb --role-name neondb_owner)
          fi

          cd turbo
          DATABASE_URL="$DATABASE_URL" pnpm -F @vm0/db db:migrate
          ENV=preview DATABASE_URL="$DATABASE_URL" pnpm -F api db:dev-seed

          echo "database-url=$DATABASE_URL" >> "$GITHUB_OUTPUT"

      - name: Resolve Vercel API deploy environment
        id: api-deploy-env
        uses: ./.github/actions/web-api-env
        with:
          app: api
          environment: preview
          database-url: ${{ steps.neon.outputs.database-url }}
          job-ref: ${{ format('{0}-vercel', needs.prepare.outputs.job-ref) }}
          web-url: ${{ needs.prepare.outputs.vercel-api-preview-url }}
          app-url: ${{ needs.prepare.outputs.vercel-app-preview-url }}
          api-backend-url: ${{ needs.prepare.outputs.vercel-api-preview-url }}
          cli-pkg-url: https://static.vm0.io/okou-cli/${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}/package.tgz
        env:
          REPO_VARS_JSON: ${{ toJSON(vars) }}
          REPO_SECRETS_JSON: ${{ toJSON(secrets) }}
          DOPPLER_SECRETS_JSON: ${{ toJSON(steps.doppler-oauth.outputs) }}

      - name: Use isolated Vercel Stripe listener webhook secret
        if: github.event_name != 'push'
        env:
          API_ENV_FILE: ${{ steps.api-deploy-env.outputs.file }}
          METAL_USER: ${{ vars.AWS_METAL_RUNNER_USER }}
          METAL_HOSTS: ${{ secrets.AWS_METAL_RUNNER_HOSTS }}
          JOB_REF: ${{ format('{0}-vercel', needs.prepare.outputs.job-ref) }}
        run: |
          set -euo pipefail

          stripe_listener_host="$(printf '%s\n' "$METAL_HOSTS" | tr ',' '\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | sed '/^$/d' | head -n 1)"
          if [[ -z "$stripe_listener_host" ]]; then
            echo "::error::AWS_METAL_RUNNER_HOSTS is empty"
            exit 1
          fi

          remote="${METAL_USER}@${stripe_listener_host}"
          secret_file="/var/lib/vm0-runner/stripe/${JOB_REF}/webhook-secret"
          stripe_webhook_secret="$(
            printf '%s\n' "$secret_file" |
              ssh "$remote" 'read -r secret_file; sudo cat -- "$secret_file"'
          )"
          echo "::add-mask::$stripe_webhook_secret"
          if [[ "$stripe_webhook_secret" != whsec_* ]]; then
            echo "::error::Stripe listener did not provide a webhook secret"
            exit 1
          fi

          grep -q '^STRIPE_WEBHOOK_SECRET=' "$API_ENV_FILE" || {
            echo "::error::Resolved API environment is missing STRIPE_WEBHOOK_SECRET"
            exit 1
          }
          updated_env="$(mktemp)"
          while IFS= read -r line || [[ -n "$line" ]]; do
            if [[ "$line" == STRIPE_WEBHOOK_SECRET=* ]]; then
              printf 'STRIPE_WEBHOOK_SECRET=%s\n' "$stripe_webhook_secret"
            else
              printf '%s\n' "$line"
            fi
          done < "$API_ENV_FILE" > "$updated_env"
          mv "$updated_env" "$API_ENV_FILE"

      - name: Deploy API to Vercel
        id: api-deploy
        uses: ./.github/actions/vercel-deploy
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ vars.VERCEL_TEAM_ID }}
          vercel-project-id: ${{ vars.VERCEL_PROJECT_ID_API }}
          environment: preview
          deployment-env: api-vercel
          prebuilt: "true"
          prebuilt-build-command: |
            pnpm --dir turbo/apps/api build
            rm -rf .vercel/output
            cp -R turbo/apps/api/.vercel/output .vercel/output
          environment-file: ${{ steps.api-deploy-env.outputs.file }}
          meta-branch: ${{ github.head_ref || github.ref_name }}
          meta-pr: ${{ format('{0}-vercel', needs.prepare.outputs.job-ref) }}
          skip-start: ${{ github.event_name == 'merge_group' }}
          skip-finish: "true"

      - name: Create isolated Vercel API alias
        id: api-alias
        uses: ./.github/actions/vercel-alias
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ vars.VERCEL_TEAM_ID }}
          deployment-url: ${{ steps.api-deploy.outputs.url }}
          app-name: api
          job-ref: ${{ format('{0}-vercel', needs.prepare.outputs.job-ref) }}
          preview-domain: ${{ vars.PREVIEW_DOMAIN }}
          deployment-id: ${{ steps.api-deploy.outputs.deployment-id }}
          deployment-env: ${{ steps.api-deploy.outputs.deployment-env }}

      - name: Resolve isolated Vercel API preview URL
        id: api-preview
        env:
          ACTUAL_URL: ${{ steps.api-alias.outputs.url }}
          EXPECTED_URL: ${{ needs.prepare.outputs.vercel-api-preview-url }}
        run: |
          set -euo pipefail
          if [[ "$ACTUAL_URL" != "$EXPECTED_URL" ]]; then
            echo "::error::Vercel API alias mismatch: expected ${EXPECTED_URL}, got ${ACTUAL_URL:-missing}"
            exit 1
          fi
          echo "url=$ACTUAL_URL" >> "$GITHUB_OUTPUT"

      - name: Check Vercel API deployment, alias, and protection
        env:
          API_ALIAS_URL: ${{ steps.api-preview.outputs.url }}
          API_DEPLOYMENT_URL: ${{ steps.api-deploy.outputs.url }}
          EXPECTED_COMMIT: ${{ github.sha }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          vercel curl /health --deployment "$API_DEPLOYMENT_URL" --token "$VERCEL_TOKEN" -- \
            --fail \
            --show-error \
            --silent \
            --max-time 20 \
            --retry 3 \
            --retry-delay 2 \
            --retry-all-errors
          build_info="$(vercel curl /api/build-info --deployment "$API_DEPLOYMENT_URL" --token "$VERCEL_TOKEN" -- \
            --fail \
            --show-error \
            --silent \
            --max-time 20)"
          jq -e --arg expected "$EXPECTED_COMMIT" '.commitSha == $expected' <<< "$build_info" >/dev/null || {
            echo "::error::Vercel API preview did not report commit ${EXPECTED_COMMIT}"
            exit 1
          }

          unauthenticated_status="$(curl \
            --output /dev/null \
            --silent \
            --max-time 20 \
            --write-out '%{http_code}' \
            "${API_ALIAS_URL}/health")"
          if [[ "$unauthenticated_status" == "200" ]]; then
            echo "::error::Vercel API preview health is reachable without deployment protection"
            exit 1
          fi

          alias_build_info=""
          alias_ready="false"
          for attempt in {1..10}; do
            if alias_build_info="$(curl "${API_ALIAS_URL}/api/build-info" \
              --fail \
              --show-error \
              --silent \
              --max-time 20 \
              -H "x-vercel-protection-bypass: ${VERCEL_AUTOMATION_BYPASS_SECRET}")" &&
              jq -e --arg expected "$EXPECTED_COMMIT" \
                '.commitSha == $expected' <<< "$alias_build_info" >/dev/null; then
              alias_ready="true"
              break
            fi
            echo "Vercel API preview alias has not reached this commit (attempt ${attempt}/10)"
            sleep 3
          done
          if [[ "$alias_ready" != "true" ]]; then
            echo "::error::Vercel API preview alias did not reach commit ${EXPECTED_COMMIT}"
            exit 1
          fi

          curl "${API_ALIAS_URL}/health" \
            --fail \
            --show-error \
            --silent \
            --max-time 20 \
            --retry 3 \
            --retry-delay 2 \
            --retry-all-errors \
            -H "x-vercel-protection-bypass: ${VERCEL_AUTOMATION_BYPASS_SECRET}"

      - name: Verify Vercel API Stripe webhook signing
        if: github.event_name != 'push'
        env:
          API_DEPLOYMENT_URL: ${{ steps.api-preview.outputs.url }}
          API_ENV_FILE: ${{ steps.api-deploy-env.outputs.file }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set -euo pipefail

          stripe_webhook_secret="$(sed -n 's/^STRIPE_WEBHOOK_SECRET=//p' "$API_ENV_FILE")"
          echo "::add-mask::$stripe_webhook_secret"
          if [[ "$stripe_webhook_secret" != whsec_* ]]; then
            echo "::error::Deployed Vercel API environment is missing the Stripe webhook secret"
            exit 1
          fi

          probe_body='{"id":"evt_vm0_vercel_preview_probe","object":"event","type":"vm0.vercel-preview.probe","data":{"object":{}}}'
          probe_timestamp="$(date +%s)"
          probe_signature="$(
            STRIPE_PROBE_SECRET="$stripe_webhook_secret" \
            STRIPE_PROBE_BODY="$probe_body" \
            STRIPE_PROBE_TIMESTAMP="$probe_timestamp" \
              node <<'NODE'
          const { createHmac } = require("node:crypto");

          const secret = process.env.STRIPE_PROBE_SECRET;
          const body = process.env.STRIPE_PROBE_BODY;
          const timestamp = process.env.STRIPE_PROBE_TIMESTAMP;
          if (!secret || !body || !timestamp) {
            throw new Error("Stripe probe inputs are required");
          }
          process.stdout.write(
            createHmac("sha256", secret)
              .update(`${timestamp}.${body}`)
              .digest("hex"),
          );
          NODE
          )"

          curl "${API_DEPLOYMENT_URL}/api/webhooks/stripe" \
            --fail-with-body \
            --show-error \
            --silent \
            --max-time 30 \
            -H 'Content-Type: application/json' \
            -H "stripe-signature: t=${probe_timestamp},v1=${probe_signature}" \
            -H "x-vercel-protection-bypass: ${VERCEL_AUTOMATION_BYPASS_SECRET}" \
            --data-binary "$probe_body"

      - name: Reconcile Vercel preview connector catalog
        env:
          API_DEPLOYMENT_URL: ${{ steps.api-preview.outputs.url }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set -euo pipefail

          response=""
          for attempt in 1 2 3; do
            if ! response=$(curl \
              --fail-with-body \
              --show-error \
              --silent \
              --max-time 120 \
              -H "Authorization: Bearer ${CRON_SECRET}" \
              -H "x-vercel-protection-bypass: ${VERCEL_AUTOMATION_BYPASS_SECRET}" \
              "${API_DEPLOYMENT_URL}/api/cron/sync-connector-catalog"); then
              echo "::warning::Vercel connector catalog reconcile request failed (attempt ${attempt}/3)"
            elif summary=$(jq -c '{outcome, state, active, lastAttempt, filtering: {capabilityDigest: .filtering.capabilityDigest, evaluatedAt: .filtering.evaluatedAt, stale: .filtering.stale, filteredAuthMethodCount: (.filtering.filteredAuthMethods | length)}}' <<< "$response"); then
              echo "Vercel connector catalog reconcile: ${summary}"
              if jq -e '.state == "current" and .active != null and .filtering.stale == false' <<< "$response" >/dev/null; then
                exit 0
              fi
              echo "::warning::Vercel connector catalog is not ready (attempt ${attempt}/3)"
            else
              echo "::warning::Vercel connector catalog reconcile returned invalid JSON (attempt ${attempt}/3)"
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep 2
            fi
          done

          echo "::error::Vercel connector catalog reconcile did not produce a current accepted snapshot"
          exit 1

      - name: Converge Vercel preview system skills
        env:
          API_DEPLOYMENT_URL: ${{ steps.api-preview.outputs.url }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set -euo pipefail

          for attempt in $(seq 1 64); do
            response="$(curl "${API_DEPLOYMENT_URL}/api/cron/sync-skills" \
              --fail-with-body \
              --show-error \
              --silent \
              --max-time 180 \
              -H "Authorization: Bearer ${CRON_SECRET}" \
              -H "x-vercel-protection-bypass: ${VERCEL_AUTOMATION_BYPASS_SECRET}")"
            summary="$(jq -c '{commitSha, synced, skipped, failed, removed, remaining, total}' <<< "$response")"
            echo "Vercel system skill convergence ${attempt}/64: ${summary}"

            jq -e '.success == true and (.remaining | type == "number") and (.failed | type == "number")' <<< "$response" >/dev/null || {
              echo "::error::Vercel system skill convergence returned an invalid response"
              exit 1
            }
            if jq -e '.remaining == 0 and .failed == 0' <<< "$response" >/dev/null; then
              exit 0
            fi
          done

          echo "::error::Vercel system skills did not converge after 64 bounded invocations"
          exit 1

      - name: Simulate Vercel cron routes
        env:
          API_DEPLOYMENT_URL: ${{ steps.api-preview.outputs.url }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set -euo pipefail

          mapfile -t cron_routes < <(
            pnpm --dir turbo --filter api worker:cron-routes |
              grep '^/api/cron/' |
              grep -v -E '^/api/cron/(sync-connector-catalog|sync-skills)$'
          )
          expected_cron_routes="$(jq '[.crons[].path | select(. != "/api/cron/sync-connector-catalog" and . != "/api/cron/sync-skills")] | unique | length' turbo/apps/api/vercel.json)"
          if [[ "${#cron_routes[@]}" -ne "$expected_cron_routes" ]]; then
            echo "::error::Expected ${expected_cron_routes} Vercel cron routes, found ${#cron_routes[@]}"
            exit 1
          fi

          failures=0
          for path in "${cron_routes[@]}"; do
            response_file="$(mktemp)"
            http_status="$(curl \
              --output "$response_file" \
              --silent \
              --show-error \
              --max-time 180 \
              --write-out '%{http_code}' \
              -H "Authorization: Bearer ${CRON_SECRET}" \
              -H "x-vercel-protection-bypass: ${VERCEL_AUTOMATION_BYPASS_SECRET}" \
              "${API_DEPLOYMENT_URL}${path}" || true)"
            if [[ "$http_status" == 2?? ]]; then
              echo "Vercel cron simulation passed for ${path} (${http_status})"
            else
              echo "::error::Vercel cron simulation failed for ${path} with HTTP ${http_status:-unavailable}"
              if [[ -s "$response_file" ]]; then
                jq -c '{error, message, code}' "$response_file" 2>/dev/null || true
              fi
              failures=$((failures + 1))
            fi
            rm -f "$response_file"
          done

          if [[ "$failures" -ne 0 ]]; then
            echo "::error::${failures} Vercel cron route simulations failed"
            exit 1
          fi

      - name: Post Vercel API preview URL
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: api-preview-vercel
          message: |
            API Vercel preview: ${{ steps.api-preview.outputs.url }}

  # Build one runtime-independent app artifact, then deploy it to isolated
  # Pages branches embedding the Worker and Vercel API origins. The existing
  # gateway fronts the Worker lane; the Vercel lane uses its Pages branch alias.
  deploy-app:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      preview-url: ${{ steps.app-preview.outputs.url }}
      vercel-preview-url: ${{ steps.vercel-app-preview.outputs.url }}
    concurrency:
      group: deploy-app-${{ github.sha }}
      cancel-in-progress: false
    container:
      image: ghcr.io/vm0-ai/vm0-toolchain:20260622
    if: >-
      ${{
        github.actor != 'dependabot[bot]' &&
        (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_STATIC_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_STATIC_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      CF_PAGES_PROJECT_NAME: ${{ vars.CF_PAGES_PROJECT_NAME }}
      CF_PAGES_PREVIEW_DOMAIN: ${{ vars.CF_PAGES_PREVIEW_DOMAIN }}
      CF_WORKERS_SUBDOMAIN: ${{ vars.CF_WORKERS_SUBDOMAIN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
      PREVIEW_DOMAIN: ${{ vars.PREVIEW_DOMAIN }}
      R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
      R2_BUCKET_NAME: ${{ vars.R2_STATIC_BUCKET_NAME }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Resolve Cloudflare Pages preview branch
        id: pages-branch
        env:
          EVENT_NAME: ${{ github.event_name }}
          MERGE_GROUP_HEAD_REF: ${{ github.event.merge_group.head_ref || '' }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number || '' }}
        run: |
          branch="$(bash .github/scripts/resolve-okou-pages-branch.sh \
            "$EVENT_NAME" \
            "$PULL_REQUEST_NUMBER" \
            "$MERGE_GROUP_HEAD_REF")"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Resolve app preview gateway URL
        id: app-preview
        env:
          PAGES_BRANCH: ${{ steps.pages-branch.outputs.branch }}
        run: |
          : "${CF_PAGES_PREVIEW_DOMAIN:?CF_PAGES_PREVIEW_DOMAIN variable is required}"
          echo "url=https://${PAGES_BRANCH}.${CF_PAGES_PREVIEW_DOMAIN}" >> "$GITHUB_OUTPUT"

      - name: Resolve Vercel-backed Pages preview URL
        id: vercel-app-preview
        env:
          PAGES_BRANCH: ${{ steps.pages-branch.outputs.branch }}
        run: |
          : "${CF_PAGES_PROJECT_NAME:?CF_PAGES_PROJECT_NAME variable is required}"
          job_ref="${PAGES_BRANCH%-app}"
          branch="${job_ref}-vercel-app"
          {
            echo "branch=$branch"
            echo "url=https://${branch}.${CF_PAGES_PROJECT_NAME}.pages.dev"
          } >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/toolchain-init

      - name: Install AWS CLI
        run: |
          architecture="$(dpkg --print-architecture)"
          case "$architecture" in
            amd64) aws_architecture="x86_64" ;;
            arm64) aws_architecture="aarch64" ;;
            *) echo "Unsupported architecture: $architecture" >&2; exit 1 ;;
          esac

          curl -fsSL --retry 3 \
            "https://awscli.amazonaws.com/awscli-exe-linux-${aws_architecture}.zip" \
            --output /tmp/awscliv2.zip
          python3 -m zipfile -e /tmp/awscliv2.zip /tmp/awscli
          chmod +x /tmp/awscli/aws/install /tmp/awscli/aws/dist/aws
          /tmp/awscli/aws/install
          aws --version

      - name: Resolve artifact commit SHA
        id: artifact
        run: |
          sha="$(bash .github/scripts/resolve-build-commit-sha.sh)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "prefix=okou-app/$sha" >> "$GITHUB_OUTPUT"

      - name: Check for existing artifact
        id: existing
        env:
          ARTIFACT_PREFIX: ${{ steps.artifact.outputs.prefix }}
        run: |
          set -euo pipefail

          : "${AWS_ACCESS_KEY_ID:?R2_STATIC_ACCESS_KEY_ID secret is required}"
          : "${AWS_SECRET_ACCESS_KEY:?R2_STATIC_SECRET_ACCESS_KEY secret is required}"
          : "${R2_ACCOUNT_ID:?R2_ACCOUNT_ID variable is required}"
          : "${R2_BUCKET_NAME:?R2_STATIC_BUCKET_NAME variable is required}"

          r2_endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          ready_key="${ARTIFACT_PREFIX}/ready.json"
          error_log="$(mktemp)"

          set +e
          aws s3api head-object \
            --endpoint-url "$r2_endpoint" \
            --bucket "$R2_BUCKET_NAME" \
            --key "$ready_key" \
            >/dev/null 2>"$error_log"
          status=$?
          set -e

          if (( status == 0 )); then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Artifact already ready: s3://${R2_BUCKET_NAME}/${ARTIFACT_PREFIX}/"
          elif grep -Eq '404|NotFound|Not Found|NoSuchKey' "$error_log"; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            cat "$error_log" >&2
            exit "$status"
          fi

      - name: Build canonical app artifact
        if: steps.existing.outputs.exists != 'true'
        env:
          VITE_CLERK_PUBLISHABLE_KEY_PREVIEW: ${{ vars.CLERK_PUBLISHABLE_KEY_PREVIEW }}
          VITE_CLERK_PUBLISHABLE_KEY_PROD: ${{ vars.CLERK_PUBLISHABLE_KEY_PROD }}
          VITE_GIT_COMMIT_SHA: ${{ steps.artifact.outputs.sha }}
          VITE_PLAUSIBLE_SCRIPT_URL_PREVIEW: ${{ vars.PLAUSIBLE_SCRIPT_URL }}
          VITE_PLAUSIBLE_SCRIPT_URL_PRODUCTION: ${{ vars.PLAUSIBLE_SCRIPT_URL_PROD }}
          VITE_POSTHOG_KEY: ${{ vars.POSTHOG_KEY }}
          VITE_SENTRY_DSN_PROD: ${{ vars.SENTRY_DSN_APP_PROD }}
          VITE_VAPID_PUBLIC_KEY_PREVIEW: ${{ vars.VAPID_PUBLIC_KEY_PREVIEW }}
          VITE_VAPID_PUBLIC_KEY_PROD: ${{ vars.VAPID_PUBLIC_KEY_PROD }}
        run: |
          cd turbo
          pnpm --filter @vm0/app exec vite build --sourcemap
          pnpm --filter @vm0/app exec sentry-cli sourcemaps inject dist

      - name: Create artifact manifest
        if: steps.existing.outputs.exists != 'true'
        env:
          ARTIFACT_SHA: ${{ steps.artifact.outputs.sha }}
        run: |
          set -euo pipefail

          dist="turbo/apps/platform/dist"
          entries="$(mktemp)"

          find "$dist" -type f -print0 | sort -z | while IFS= read -r -d '' file; do
            relative_path="${file#"$dist"/}"
            digest="$(sha256sum "$file" | cut -d ' ' -f 1)"
            size="$(stat -c '%s' "$file")"
            jq -n \
              --arg path "$relative_path" \
              --arg sha256 "$digest" \
              --argjson size "$size" \
              '{path: $path, sha256: $sha256, size: $size}' >> "$entries"
          done

          jq -s \
            --arg commit_sha "$ARTIFACT_SHA" \
            '{version: 1, commitSha: $commit_sha, files: .}' \
            "$entries" > /tmp/okou-app-manifest.json

          manifest_sha="$(sha256sum /tmp/okou-app-manifest.json | cut -d ' ' -f 1)"
          jq -n \
            --arg commit_sha "$ARTIFACT_SHA" \
            --arg manifest_sha256 "$manifest_sha" \
            '{version: 1, commitSha: $commit_sha, manifestSha256: $manifest_sha256}' \
            > /tmp/okou-app-ready.json

      - name: Upload canonical app artifact
        if: steps.existing.outputs.exists != 'true'
        env:
          ARTIFACT_PREFIX: ${{ steps.artifact.outputs.prefix }}
        run: |
          set -euo pipefail

          r2_endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          artifact_uri="s3://${R2_BUCKET_NAME}/${ARTIFACT_PREFIX}"
          cache_control="public, max-age=31536000, immutable"

          aws s3 rm "$artifact_uri/" \
            --endpoint-url "$r2_endpoint" \
            --recursive

          # A single archive keeps readers to one request instead of one per
          # file, which is where R2 kept breaking the transfer mid-stream.
          tar -czf /tmp/okou-app-dist.tar.gz -C turbo/apps/platform/dist .

          aws s3api put-object \
            --endpoint-url "$r2_endpoint" \
            --bucket "$R2_BUCKET_NAME" \
            --key "${ARTIFACT_PREFIX}/dist.tar.gz" \
            --body /tmp/okou-app-dist.tar.gz \
            --content-type application/gzip \
            --cache-control "$cache_control"

          aws s3api put-object \
            --endpoint-url "$r2_endpoint" \
            --bucket "$R2_BUCKET_NAME" \
            --key "${ARTIFACT_PREFIX}/manifest.json" \
            --body /tmp/okou-app-manifest.json \
            --content-type application/json \
            --cache-control "$cache_control"

          aws s3api put-object \
            --endpoint-url "$r2_endpoint" \
            --bucket "$R2_BUCKET_NAME" \
            --key "${ARTIFACT_PREFIX}/ready.json" \
            --body /tmp/okou-app-ready.json \
            --content-type application/json \
            --cache-control "$cache_control" \
            --if-none-match "*"

          echo "Artifact ready: ${artifact_uri}/"

      - name: Prepare Cloudflare Pages preview
        id: pages-preview
        env:
          ARTIFACT_EXISTS: ${{ steps.existing.outputs.exists }}
          ARTIFACT_PREFIX: ${{ steps.artifact.outputs.prefix }}
          PAGES_BRANCH: ${{ steps.pages-branch.outputs.branch }}
        run: |
          set -euo pipefail

          : "${CF_PAGES_PROJECT_NAME:?CF_PAGES_PROJECT_NAME variable is required}"
          : "${CLOUDFLARE_ACCOUNT_ID:?CF_ACCOUNT_ID variable is required}"
          : "${CF_WORKERS_SUBDOMAIN:?CF_WORKERS_SUBDOMAIN variable is required}"

          r2_endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          artifact_uri="s3://${R2_BUCKET_NAME}/${ARTIFACT_PREFIX}"
          pages_dist="$(mktemp -d)"
          job_ref="${PAGES_BRANCH%-app}"
          api_origin="https://${job_ref}-vm0-api-preview.${CF_WORKERS_SUBDOMAIN}.workers.dev"

          if [[ "$ARTIFACT_EXISTS" == "true" ]]; then
            canonical_dist="$(mktemp -d)"
            bash .github/scripts/fetch-okou-app-artifact.sh \
              "$r2_endpoint" \
              "$artifact_uri" \
              "$canonical_dist"
          else
            # This job built and uploaded the artifact, so the canonical bytes
            # are still on disk. Reading them back from R2 only adds latency and
            # a network failure mode.
            canonical_dist="turbo/apps/platform/dist"
          fi

          bash .github/scripts/prepare-okou-pages-dist.sh \
            "$canonical_dist" \
            "$pages_dist" \
            "$api_origin"

          {
            echo "canonical-dist=$canonical_dist"
            echo "dist=$pages_dist"
            echo "url=https://${PAGES_BRANCH}.${CF_PAGES_PROJECT_NAME}.pages.dev"
          } >> "$GITHUB_OUTPUT"

      - name: Deploy Cloudflare Pages preview
        id: pages-deploy
        env:
          ARTIFACT_SHA: ${{ steps.artifact.outputs.sha }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_PAGES_DEPLOY_API_TOKEN }}
          PAGES_BRANCH: ${{ steps.pages-branch.outputs.branch }}
          PAGES_DIST: ${{ steps.pages-preview.outputs.dist }}
          WRANGLER_OUTPUT_FILE_PATH: /tmp/wrangler-pages-output.ndjson
        run: |
          set -euo pipefail
          bash .github/scripts/deploy-okou-pages.sh \
            "$PAGES_DIST" \
            "$CF_PAGES_PROJECT_NAME" \
            "$PAGES_BRANCH" \
            "$ARTIFACT_SHA"

          deployment="$(
            jq --slurp --compact-output \
              'map(select(.type == "pages-deploy-detailed")) | last' \
              "$WRANGLER_OUTPUT_FILE_PATH"
          )"
          deployment_url="$(jq -r '.url // empty' <<< "$deployment")"
          deployment_commit="$(jq -r \
            '.deployment_trigger.metadata.commit_hash // empty' \
            <<< "$deployment")"

          if [[ -z "$deployment_url" ]]; then
            echo "::error::Wrangler did not report a Pages deployment URL"
            exit 1
          fi
          deployment_host="${deployment_url#https://}"
          deployment_hash="${deployment_host%%.*}"
          if [[ \
            ! "$deployment_hash" =~ ^[0-9a-f]{8}$ ||
            "$deployment_url" != "https://${deployment_hash}.${CF_PAGES_PROJECT_NAME}.pages.dev" \
          ]]; then
            echo "::error::Wrangler did not report an immutable Pages deployment URL"
            exit 1
          fi
          if [[ "$deployment_commit" != "$ARTIFACT_SHA" ]]; then
            echo "::error::Pages deployment commit does not match the app artifact"
            exit 1
          fi

          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"

      - name: Wait for Cloudflare Pages deployment readiness
        env:
          PAGES_DIST: ${{ steps.pages-preview.outputs.dist }}
          PAGES_URL: ${{ steps.pages-deploy.outputs.url }}
        run: |
          bash .github/scripts/wait-okou-pages-readiness.sh \
            "$PAGES_DIST" \
            "$PAGES_URL"

      - name: Smoke test app preview gateway
        if: steps.app-preview.outputs.url != ''
        env:
          APP_PREVIEW_URL: ${{ steps.app-preview.outputs.url }}
        run: |
          set -euo pipefail
          response_headers="$(mktemp)"
          for attempt in {1..12}; do
            if curl --fail --silent --show-error \
              --dump-header "$response_headers" \
              --output /dev/null \
              "${APP_PREVIEW_URL}/" && \
              grep -Eiq '^x-vm0-preview-gateway:[[:space:]]*1[[:space:]]*$' \
                "$response_headers"; then
              echo "App preview gateway is ready"
              exit 0
            fi
            echo "::warning::App preview gateway is not ready (attempt ${attempt}/12)"
            sleep 5
          done
          echo "::error::${APP_PREVIEW_URL} did not use vm0-preview-gateway"
          exit 1

      - name: Prepare Vercel-backed Cloudflare Pages preview
        id: vercel-pages-preview
        env:
          CANONICAL_DIST: ${{ steps.pages-preview.outputs.canonical-dist }}
          PAGES_BRANCH: ${{ steps.vercel-app-preview.outputs.branch }}
        run: |
          set -euo pipefail

          : "${CF_PAGES_PROJECT_NAME:?CF_PAGES_PROJECT_NAME variable is required}"
          : "${PREVIEW_DOMAIN:?PREVIEW_DOMAIN variable is required}"

          pages_dist="$(mktemp -d)"
          job_ref="${PAGES_BRANCH%-vercel-app}"
          api_origin="https://${job_ref}-vercel-api.${PREVIEW_DOMAIN}"
          bash .github/scripts/prepare-okou-pages-dist.sh \
            "$CANONICAL_DIST" \
            "$pages_dist" \
            "$api_origin"

          {
            echo "dist=$pages_dist"
            echo "url=https://${PAGES_BRANCH}.${CF_PAGES_PROJECT_NAME}.pages.dev"
          } >> "$GITHUB_OUTPUT"

      - name: Deploy Vercel-backed Cloudflare Pages preview
        id: vercel-pages-deploy
        env:
          ARTIFACT_SHA: ${{ steps.artifact.outputs.sha }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_PAGES_DEPLOY_API_TOKEN }}
          PAGES_BRANCH: ${{ steps.vercel-app-preview.outputs.branch }}
          PAGES_DIST: ${{ steps.vercel-pages-preview.outputs.dist }}
          WRANGLER_OUTPUT_FILE_PATH: /tmp/wrangler-vercel-pages-output.ndjson
        run: |
          set -euo pipefail
          bash .github/scripts/deploy-okou-pages.sh \
            "$PAGES_DIST" \
            "$CF_PAGES_PROJECT_NAME" \
            "$PAGES_BRANCH" \
            "$ARTIFACT_SHA"

          deployment="$(
            jq --slurp --compact-output \
              'map(select(.type == "pages-deploy-detailed")) | last' \
              "$WRANGLER_OUTPUT_FILE_PATH"
          )"
          deployment_url="$(jq -r '.url // empty' <<< "$deployment")"
          deployment_commit="$(jq -r \
            '.deployment_trigger.metadata.commit_hash // empty' \
            <<< "$deployment")"

          if [[ -z "$deployment_url" ]]; then
            echo "::error::Wrangler did not report a Vercel-backed Pages deployment URL"
            exit 1
          fi
          deployment_host="${deployment_url#https://}"
          deployment_hash="${deployment_host%%.*}"
          if [[ \
            ! "$deployment_hash" =~ ^[0-9a-f]{8}$ ||
            "$deployment_url" != "https://${deployment_hash}.${CF_PAGES_PROJECT_NAME}.pages.dev" \
          ]]; then
            echo "::error::Wrangler did not report an immutable Vercel-backed Pages deployment URL"
            exit 1
          fi
          if [[ "$deployment_commit" != "$ARTIFACT_SHA" ]]; then
            echo "::error::Vercel-backed Pages deployment commit does not match the app artifact"
            exit 1
          fi

          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"

      - name: Wait for Vercel-backed Cloudflare Pages deployment readiness
        env:
          PAGES_DIST: ${{ steps.vercel-pages-preview.outputs.dist }}
          PAGES_URL: ${{ steps.vercel-pages-deploy.outputs.url }}
        run: |
          bash .github/scripts/wait-okou-pages-readiness.sh \
            "$PAGES_DIST" \
            "$PAGES_URL"

      - name: Wait for Vercel-backed Cloudflare Pages alias readiness
        env:
          PAGES_DIST: ${{ steps.vercel-pages-preview.outputs.dist }}
          PAGES_URL: ${{ steps.vercel-app-preview.outputs.url }}
        run: |
          bash .github/scripts/wait-okou-pages-readiness.sh \
            "$PAGES_DIST" \
            "$PAGES_URL"

      - name: Record Cloudflare Pages preview
        env:
          APP_PREVIEW_URL: ${{ steps.app-preview.outputs.url }}
          PAGES_DEPLOYMENT_URL: ${{ steps.pages-deploy.outputs.url }}
          PAGES_PREVIEW_URL: ${{ steps.pages-preview.outputs.url }}
          VERCEL_APP_PREVIEW_URL: ${{ steps.vercel-app-preview.outputs.url }}
          VERCEL_PAGES_DEPLOYMENT_URL: ${{ steps.vercel-pages-deploy.outputs.url }}
          VERCEL_PAGES_PREVIEW_URL: ${{ steps.vercel-pages-preview.outputs.url }}
        run: |
          {
            echo "Cloudflare Pages deployment: ${PAGES_DEPLOYMENT_URL}"
            echo "Cloudflare Pages preview: ${PAGES_PREVIEW_URL}"
            if [[ -n "$APP_PREVIEW_URL" ]]; then
              echo "App preview gateway: ${APP_PREVIEW_URL}"
            fi
            echo "Vercel-backed Cloudflare Pages deployment: ${VERCEL_PAGES_DEPLOYMENT_URL}"
            echo "Vercel-backed Cloudflare Pages preview: ${VERCEL_PAGES_PREVIEW_URL}"
            echo "Vercel-backed app preview alias: ${VERCEL_APP_PREVIEW_URL}"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-stripe-listener:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        runtime: [cloudflare, vercel]
    concurrency:
      group: deploy-stripe-listener-${{ matrix.runtime }}-${{ needs.prepare.outputs.job-ref }}
      cancel-in-progress: true
    # Starts before both API deployments so each runtime can use the signing
    # secret created by its exact long-running Stripe CLI session.
    needs: [prepare]
    if: |
      always() &&
      github.event_name != 'push' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) &&
      needs.prepare.outputs.job-ref != '' && (
        needs.prepare.outputs.turbo-runner-consumer-needed == 'true' ||
        needs.prepare.outputs.playwright-runner-consumer-needed == 'true'
      )
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install Ansible
        run: pip3 install ansible-core

      - name: Setup SSH via Cloudflare Tunnel
        uses: ./.github/actions/setup-ssh-tunnel
        with:
          ssh-user: ${{ vars.AWS_METAL_RUNNER_USER }}
          ssh-hosts: ${{ secrets.AWS_METAL_RUNNER_HOSTS }}
          require-all-hosts: "false"
          ssh-key: ${{ secrets.AWS_METAL_RUNNER_SSH_KEY }}
          cf-access-client-id: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          cf-access-client-secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}

      - name: Start Stripe CLI listener on one metal host
        env:
          METAL_USER: ${{ vars.AWS_METAL_RUNNER_USER }}
          METAL_HOSTS: ${{ secrets.AWS_METAL_RUNNER_HOSTS }}
          JOB_REF: ${{ matrix.runtime == 'vercel' && format('{0}-vercel', needs.prepare.outputs.job-ref) || needs.prepare.outputs.job-ref }}
          API_PREVIEW_URL: ${{ matrix.runtime == 'vercel' && needs.prepare.outputs.vercel-api-preview-url || needs.prepare.outputs.api-preview-url }}
          API_RUNTIME: ${{ matrix.runtime }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          API_ACCESS_CLIENT_ID: ${{ secrets.CF_API_PREVIEW_ACCESS_CLIENT_ID }}
          API_ACCESS_CLIENT_SECRET: ${{ secrets.CF_API_PREVIEW_ACCESS_CLIENT_SECRET }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set -euo pipefail
          cd ansible

          STRIPE_LISTENER_HOST="$(printf '%s\n' "$METAL_HOSTS" | tr ',' '\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | sed '/^$/d' | head -n 1)"
          if [[ -z "$STRIPE_LISTENER_HOST" ]]; then
            echo "::error::AWS_METAL_RUNNER_HOSTS is empty"
            exit 1
          fi

          CLEANUP_EXTRA_VARS="$(jq -nc \
            --arg ansible_user "$METAL_USER" \
            --arg job_ref "$JOB_REF" \
            '{ansible_user: $ansible_user, job_ref: $job_ref}')"
          if ! ansible-playbook \
            -i "${METAL_HOSTS}," \
            playbooks/cleanup-stripe-listener.yml \
            --extra-vars "$CLEANUP_EXTRA_VARS" \
            -v; then
            echo "::warning::Stripe CLI listener cleanup failed for ${JOB_REF} — stale Stripe forwarding may remain on metal hosts"
          fi

          FORWARD_URL="${API_PREVIEW_URL%/}/api/webhooks/stripe"
          if [[ "$API_RUNTIME" == "cloudflare" ]]; then
            : "${API_ACCESS_CLIENT_ID:?CF_API_PREVIEW_ACCESS_CLIENT_ID secret is required}"
            : "${API_ACCESS_CLIENT_SECRET:?CF_API_PREVIEW_ACCESS_CLIENT_SECRET secret is required}"
            FORWARD_HEADERS="CF-Access-Client-Id:${API_ACCESS_CLIENT_ID},CF-Access-Client-Secret:${API_ACCESS_CLIENT_SECRET}"
          else
            : "${VERCEL_AUTOMATION_BYPASS_SECRET:?VERCEL_AUTOMATION_BYPASS_SECRET is required}"
            FORWARD_HEADERS="x-vercel-protection-bypass:${VERCEL_AUTOMATION_BYPASS_SECRET}"
          fi
          EXTRA_VARS="$(jq -nc \
            --arg ansible_user "$METAL_USER" \
            --arg job_ref "$JOB_REF" \
            --arg forward_url "$FORWARD_URL" \
            --arg stripe_secret_key "$STRIPE_SECRET_KEY" \
            --arg forward_headers "$FORWARD_HEADERS" \
            '{ansible_user: $ansible_user, job_ref: $job_ref, forward_url: $forward_url, stripe_secret_key: $stripe_secret_key, forward_headers: $forward_headers}')"

          ansible-playbook \
            -i "${STRIPE_LISTENER_HOST}," \
            playbooks/start-stripe-listener.yml \
            --extra-vars "$EXTRA_VARS" \
            -v

  # Exercise the hosted Clerk UI against both preview runtimes via
  # agent-browser. Both lanes are blocking and use isolated Clerk identities.
  cli-e2e-02-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        runtime: [cloudflare, vercel]
    concurrency:
      group: cli-e2e-02-browser-${{ matrix.runtime }}-${{ needs.prepare.outputs.job-ref }}
      cancel-in-progress: true
    needs: [prepare, deploy-api, deploy-api-vercel, deploy-app]
    if: |
      always() &&
      (github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore: release')) &&
      needs.prepare.outputs.job-ref != '' && (
        needs.prepare.outputs.api-changed == 'true' ||
        needs.prepare.outputs.platform-changed == 'true' ||
        needs.prepare.outputs.cli-changed == 'true' ||
        needs.prepare.outputs.ci-changed == 'true' ||
        needs.prepare.outputs.e2e-changed == 'true'
      ) &&
      needs.deploy-api.result == 'success' &&
      needs.deploy-api-vercel.result == 'success' &&
      needs.deploy-app.result == 'success'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install E2E dependencies
        run: npm install -g agent-browser@0.22.0
      - name: Run browser E2E tests
        run: |
          BATS_TEST_TIMEOUT=180 ./e2e/test/libs/bats/bin/bats -T ./e2e/tests/02-browser/*.bats
        env:
          VM0_API_BACKEND_URL: ${{ matrix.runtime == 'vercel' && needs.deploy-api-vercel.outputs.preview-url || needs.deploy-api.outputs.preview-url }}
          VM0_AUTH_URL: ${{ matrix.runtime == 'vercel' && needs.deploy-app.outputs.vercel-preview-url || needs.deploy-app.outputs.preview-url }}
          VM0_AUTH_REDIRECT_URL: ${{ format('{0}/_/skeleton', matrix.runtime == 'vercel' && needs.deploy-app.outputs.vercel-preview-url || needs.deploy-app.outputs.preview-url) }}
          VM0_AUTH_DOMAIN: ${{ matrix.runtime == 'vercel' && format('{0}-vercel-api.{1}', needs.prepare.outputs.job-ref, vars.PREVIEW_DOMAIN) || format('{0}-vm0-api-preview.{1}.workers.dev', needs.prepare.outputs.job-ref, vars.CF_WORKERS_SUBDOMAIN) }}
          JOB_REF: ${{ matrix.runtime == 'vercel' && format('{0}-vercel', needs.prepare.outputs.job-ref) || needs.prepare.outputs.job-ref }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_API_PREVIEW_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_API_PREVIEW_ACCESS_CLIENT_SECRET }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          E2E_ACCOUNT: ${{ format('{0}+clerk_test+{1}-{2}+browser@vm0-e2e.ai', matrix.runtime == 'vercel' && format('{0}-vercel', needs.prepare.outputs.job-ref) || needs.prepare.outputs.job-ref, github.run_id, github.run_attempt) }}
      - name: Cleanup browser E2E account
        if: always()
        shell: bash
        run: |
          source e2e/helpers/browser.bash
          delete_e2e_account_if_exists
        env:
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          E2E_ACCOUNT: ${{ format('{0}+clerk_test+{1}-{2}+browser@vm0-e2e.ai', matrix.runtime == 'vercel' && format('{0}-vercel', needs.prepare.outputs.job-ref) || needs.prepare.outputs.job-ref, github.run_id, github.run_attempt) }}
  cli-e2e-02-playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        runtime: [cloudflare, vercel]
        shard: [1, 2]
    concurrency:
      group: cli-e2e-02-playwright-${{ matrix.runtime }}-${{ matrix.shard }}-${{ needs.prepare.outputs.job-ref }}
      cancel-in-progress: true
    needs:
      - prepare
      - deploy-api
      - deploy-api-vercel
      - deploy-app
      - deploy-stripe-listener
      - deploy-runner-start
    if: |
      always() &&
      (github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore: release')) &&
      needs.prepare.outputs.job-ref != '' && (
        needs.prepare.outputs.api-changed == 'true' ||
        needs.prepare.outputs.platform-changed == 'true' ||
        needs.prepare.outputs.cli-changed == 'true' ||
        needs.prepare.outputs.ci-changed == 'true' ||
        needs.prepare.outputs.e2e-changed == 'true'
      ) &&
      needs.deploy-api.result == 'success' &&
      needs.deploy-api-vercel.result == 'success' &&
      needs.deploy-app.result == 'success' &&
      (github.event_name == 'push' || needs.deploy-stripe-listener.result == 'success') &&
      (
        (
          needs.prepare.outputs.turbo-runner-consumer-needed != 'true' &&
          needs.prepare.outputs.playwright-runner-consumer-needed != 'true'
        ) ||
        needs.deploy-runner-start.result == 'success'
      )
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install pnpm
        run: corepack enable pnpm
      - name: Install E2E dependencies
        run: cd e2e && pnpm install --frozen-lockfile
      - name: Check Playwright E2E types
        run: cd e2e && pnpm check-types
      - name: Run Playwright fixture integration tests
        run: cd e2e && pnpm test
      - name: Install Playwright browsers
        run: cd e2e && pnpm exec playwright install --with-deps chromium
      - name: Start Stripe webhook forwarding
        # Staging receives webhooks from the Dashboard endpoint; PR previews use
        # the long-running listener from deploy-stripe-listener.
        if: github.event_name == 'push' && needs.prepare.outputs.job-ref != 'staging'
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          bash e2e/scripts/ensure-stripe-cli.sh

          stripe_webhook_secret="$(stripe listen --api-key "$STRIPE_SECRET_KEY" --print-secret 2>/dev/null)"
          echo "::add-mask::$stripe_webhook_secret"

          forward_url="${API_PREVIEW_URL%/}/api/webhooks/stripe"
          stripe listen \
            --api-key "$STRIPE_SECRET_KEY" \
            --events checkout.session.completed,payment_intent.succeeded,invoice.paid,customer.subscription.updated,customer.subscription.deleted \
            --forward-to "$forward_url" \
            > /tmp/stripe-listen.log 2>&1 &
          stripe_pid="$!"
          echo "$stripe_pid" > /tmp/stripe-listen.pid

          for _ in {1..10}; do
            if grep -qi 'ready' /tmp/stripe-listen.log; then
              echo "Stripe webhook forwarding started for $forward_url"
              exit 0
            fi
            if ! kill -0 "$stripe_pid" 2>/dev/null; then
              sed -E 's/whsec_[[:alnum:]_]+/[masked-stripe-webhook-secret]/g' /tmp/stripe-listen.log >&2
              exit 1
            fi
            sleep 1
          done

          echo "Stripe CLI did not become ready" >&2
          sed -E 's/whsec_[[:alnum:]_]+/[masked-stripe-webhook-secret]/g' /tmp/stripe-listen.log >&2
          exit 1
        env:
          API_PREVIEW_URL: ${{ matrix.runtime == 'vercel' && needs.deploy-api-vercel.outputs.preview-url || needs.deploy-api.outputs.preview-url }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      - name: Run Playwright E2E tests
        run: |
          cd e2e
          npx playwright test \
            --config playwright/playwright.config.ts \
            --fully-parallel \
            --shard="${PLAYWRIGHT_SHARD}/2" \
            --workers=1
        env:
          PLAYWRIGHT_SHARD: ${{ matrix.shard }}
          VM0_API_BACKEND_URL: ${{ matrix.runtime == 'vercel' && needs.deploy-api-vercel.outputs.preview-url || needs.deploy-api.outputs.preview-url }}
          OKOU_APP_URL: ${{ matrix.runtime == 'vercel' && needs.deploy-app.outputs.vercel-preview-url || needs.deploy-app.outputs.preview-url }}
          ZERO_APP_URL: ${{ matrix.runtime == 'vercel' && needs.deploy-app.outputs.vercel-preview-url || needs.deploy-app.outputs.preview-url }}
          CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          # Keep the Clerk email local part within its 64-character limit.
          # This namespace is only a test-resource owner; infrastructure keeps
          # the full `-vercel` runtime suffix.
          JOB_REF: ${{ matrix.runtime == 'vercel' && format('{0}-v{1}', needs.prepare.outputs.job-ref, matrix.shard) || format('{0}-c{1}', needs.prepare.outputs.job-ref, matrix.shard) }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_API_PREVIEW_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_API_PREVIEW_ACCESS_CLIENT_SECRET }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      - name: Cleanup Playwright E2E accounts
        if: always()
        run: >-
          cd e2e && pnpm exec tsx playwright/clerk-test-resources.ts
          cleanup-generation playwright,paid-onboarding
        env:
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          JOB_REF: ${{ matrix.runtime == 'vercel' && format('{0}-v{1}', needs.prepare.outputs.job-ref, matrix.shard) || format('{0}-c{1}', needs.prepare.outputs.job-ref, matrix.shard) }}
      - name: Setup SSH for preview diagnostics
        if: always() && github.event_name != 'push'
        continue-on-error: true
        uses: ./.github/actions/setup-ssh-tunnel
        with:
          ssh-user: ${{ vars.AWS_METAL_RUNNER_USER }}
          ssh-hosts: ${{ secrets.AWS_METAL_RUNNER_HOSTS }}
          require-all-hosts: "false"
          ssh-key: ${{ secrets.AWS_METAL_RUNNER_SSH_KEY }}
          cf-access-client-id: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          cf-access-client-secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
      - name: Print preview Stripe webhook forwarding log
        if: always() && github.event_name != 'push'
        env:
          METAL_USER: ${{ vars.AWS_METAL_RUNNER_USER }}
          METAL_HOSTS: ${{ secrets.AWS_METAL_RUNNER_HOSTS }}
          JOB_REF: ${{ matrix.runtime == 'vercel' && format('{0}-vercel', needs.prepare.outputs.job-ref) || needs.prepare.outputs.job-ref }}
        run: |
          set -euo pipefail

          stripe_listener_host="$(printf '%s\n' "$METAL_HOSTS" | tr ',' '\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | sed '/^$/d' | head -n 1)"
          if [[ -z "$stripe_listener_host" ]]; then
            echo "::warning::AWS_METAL_RUNNER_HOSTS is empty; Stripe listener diagnostics unavailable"
            exit 0
          fi

          remote="${METAL_USER}@${stripe_listener_host}"
          stripe_log="/var/lib/vm0-runner/stripe/${JOB_REF}/stripe-listen.log"
          if ! printf '%s\n' "$stripe_log" |
            ssh "$remote" 'read -r stripe_log; sudo test -f "$stripe_log"'; then
            echo "::warning::Stripe listener log is unavailable for ${JOB_REF}"
            exit 0
          fi

          printf '%s\n' "$stripe_log" |
            ssh "$remote" 'read -r stripe_log; sudo tail -200 "$stripe_log"' |
            sed -E \
              -e 's/whsec_[[:alnum:]_]+/[masked-stripe-webhook-secret]/g' \
              -e 's/sk_(test|live)_[[:alnum:]_]+/[masked-stripe-api-key]/g'

      - name: Print preview runner diagnostics
        if: always() && github.event_name != 'push'
        env:
          METAL_USER: ${{ vars.AWS_METAL_RUNNER_USER }}
          METAL_HOSTS: ${{ secrets.AWS_METAL_RUNNER_HOSTS }}
          JOB_REF: ${{ matrix.runtime == 'vercel' && format('{0}-vercel', needs.prepare.outputs.job-ref) || needs.prepare.outputs.job-ref }}
        run: |
          set -euo pipefail

          printf '%s\n' "$METAL_HOSTS" | tr ',' '\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | sed '/^$/d' |
            while IFS= read -r host; do
              remote="${METAL_USER}@${host}"
              echo "=== Preview runner diagnostics for ${host} ==="
              printf '%s\n' "$JOB_REF" |
                ssh "$remote" 'read -r job_ref; sudo journalctl --no-pager --since '\''-15 min'\'' -n 400 -u "vm0-runner-${job_ref}-*.service"' |
                sed -E \
                  -e 's/vm0_official_[[:alnum:]_.-]+/[masked-runner-token]/g' \
                  -e 's/(CF_ACCESS_CLIENT_SECRET|CF-Access-Client-Secret)[=:][^[:space:]]+/\1=[masked]/g' \
                  -e 's/(Authorization:[[:space:]]*Bearer[[:space:]]+)[[:alnum:]_.-]+/\1[masked]/g' \
                  -e 's/whsec_[[:alnum:]_]+/[masked-stripe-webhook-secret]/g' \
                  -e 's/sk_(test|live)_[[:alnum:]_]+/[masked-stripe-api-key]/g'
            done
      - name: Print Stripe webhook forwarding log
        if: always() && github.event_name == 'push' && needs.prepare.outputs.job-ref != 'staging'
        run: |
          if [[ -f /tmp/stripe-listen.log ]]; then
            tail -200 /tmp/stripe-listen.log | sed -E 's/whsec_[[:alnum:]_]+/[masked-stripe-webhook-secret]/g'
          fi
      - name: Stop Stripe webhook forwarding
        if: always() && github.event_name == 'push' && needs.prepare.outputs.job-ref != 'staging'
        run: |
          if [[ -f /tmp/stripe-listen.pid ]]; then
            kill "$(cat /tmp/stripe-listen.pid)" 2>/dev/null || true
          fi
      - name: Verify Playwright artifacts exclude credentials
        id: playwright-artifact-safety
        if: always()
        shell: bash
        env:
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_API_PREVIEW_ACCESS_CLIENT_SECRET }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set -euo pipefail

          artifact_paths=()
          for path in e2e/playwright-report e2e/test-results; do
            if [[ -d "$path" ]]; then
              artifact_paths+=("$path")
            fi
          done

          safe="true"
          if [[ "${#artifact_paths[@]}" -gt 0 ]]; then
            for value in "${CF_ACCESS_CLIENT_SECRET:-}" "${VERCEL_AUTOMATION_BYPASS_SECRET:-}"; do
              if [[ -n "$value" ]] && grep -R --binary-files=text --fixed-strings --quiet -- "$value" "${artifact_paths[@]}"; then
                safe="false"
              fi
            done
            if grep -R --binary-files=text --extended-regexp --quiet -- \
              'cf-access-client-(id|secret):|authorization: Bearer eyJ' \
              "${artifact_paths[@]}"; then
              safe="false"
            fi
          fi

          echo "safe=$safe" >> "$GITHUB_OUTPUT"
          if [[ "$safe" != "true" ]]; then
            echo "::error::Playwright artifacts contain preview credentials and will not be uploaded"
            exit 1
          fi
      - name: Upload Playwright report
        if: always() && steps.playwright-artifact-safety.outputs.safe == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.runtime }}-${{ matrix.shard }}
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7
          if-no-files-found: ignore

  # Build one self-contained package archive per checked-out commit and upload
  # it to the same canonical R2 bucket used by deploy-app. The ready marker is
  # written last so PR, merge-group, main, and release runs can safely reuse it.
  deploy-cli:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy-cli-${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      cancel-in-progress: false
    container:
      image: ghcr.io/vm0-ai/vm0-toolchain:20260622
    if: >-
      ${{
        github.actor != 'dependabot[bot]' &&
        (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_STATIC_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_STATIC_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      CLI_STATIC_BASE_URL: https://static.vm0.io
      R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
      R2_BUCKET_NAME: ${{ vars.R2_STATIC_BUCKET_NAME }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: turbo/pnpm-lock.yaml
      - name: Initialize pnpm cache directory
        run: mkdir -p "$(pnpm store path --silent)"
      - name: Configure git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install AWS CLI
        run: |
          architecture="$(dpkg --print-architecture)"
          case "$architecture" in
            amd64) aws_architecture="x86_64" ;;
            arm64) aws_architecture="aarch64" ;;
            *) echo "Unsupported architecture: $architecture" >&2; exit 1 ;;
          esac

          curl -fsSL --retry 3 \
            "https://awscli.amazonaws.com/awscli-exe-linux-${aws_architecture}.zip" \
            --output /tmp/awscliv2.zip
          python3 -m zipfile -e /tmp/awscliv2.zip /tmp/awscli
          chmod +x /tmp/awscli/aws/install /tmp/awscli/aws/dist/aws
          /tmp/awscli/aws/install
          aws --version

      - name: Resolve artifact commit SHA
        id: artifact
        run: |
          sha="$(bash .github/scripts/resolve-build-commit-sha.sh)"
          prefix="okou-cli/$sha"
          {
            echo "sha=$sha"
            echo "prefix=$prefix"
          } >> "$GITHUB_OUTPUT"

      - name: Check for existing artifact
        id: existing
        env:
          ARTIFACT_PREFIX: ${{ steps.artifact.outputs.prefix }}
        run: |
          set -euo pipefail

          : "${AWS_ACCESS_KEY_ID:?R2_STATIC_ACCESS_KEY_ID secret is required}"
          : "${AWS_SECRET_ACCESS_KEY:?R2_STATIC_SECRET_ACCESS_KEY secret is required}"
          : "${R2_ACCOUNT_ID:?R2_ACCOUNT_ID variable is required}"
          : "${R2_BUCKET_NAME:?R2_STATIC_BUCKET_NAME variable is required}"

          r2_endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          ready_key="${ARTIFACT_PREFIX}/ready.json"
          error_log="$(mktemp)"

          set +e
          aws s3api head-object \
            --endpoint-url "$r2_endpoint" \
            --bucket "$R2_BUCKET_NAME" \
            --key "$ready_key" \
            >/dev/null 2>"$error_log"
          status=$?
          set -e

          if (( status == 0 )); then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Artifact already ready: s3://${R2_BUCKET_NAME}/${ARTIFACT_PREFIX}/"
          elif grep -Eq '404|NotFound|Not Found|NoSuchKey' "$error_log"; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            cat "$error_log" >&2
            exit "$status"
          fi

      - name: Install CLI dependencies
        if: steps.existing.outputs.exists != 'true'
        run: cd turbo && pnpm install --frozen-lockfile --filter @vm0/okou-cli...
      - name: Build CLI
        if: steps.existing.outputs.exists != 'true'
        run: cd turbo && pnpm --filter @vm0/okou-cli build
        env:
          DEFAULT_SENTRY_DSN: ${{ vars.SENTRY_DSN_CLI }}

      - name: Create canonical CLI artifact
        if: steps.existing.outputs.exists != 'true'
        env:
          ARTIFACT_SHA: ${{ steps.artifact.outputs.sha }}
        run: |
          mkdir -p /tmp/okou-cli-artifact
          bash .github/scripts/build-okou-cli-artifact.sh \
            "$ARTIFACT_SHA" \
            /tmp/okou-cli-artifact

      - name: Upload canonical CLI artifact
        if: steps.existing.outputs.exists != 'true'
        env:
          ARTIFACT_PREFIX: ${{ steps.artifact.outputs.prefix }}
        run: |
          set -euo pipefail

          r2_endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          artifact_uri="s3://${R2_BUCKET_NAME}/${ARTIFACT_PREFIX}"
          cache_control="public, max-age=31536000, immutable"

          aws s3 rm "$artifact_uri/" \
            --endpoint-url "$r2_endpoint" \
            --recursive

          aws s3api put-object \
            --endpoint-url "$r2_endpoint" \
            --bucket "$R2_BUCKET_NAME" \
            --key "${ARTIFACT_PREFIX}/package.tgz" \
            --body /tmp/okou-cli-artifact/package.tgz \
            --content-type application/gzip \
            --cache-control "$cache_control"

          aws s3api put-object \
            --endpoint-url "$r2_endpoint" \
            --bucket "$R2_BUCKET_NAME" \
            --key "${ARTIFACT_PREFIX}/manifest.json" \
            --body /tmp/okou-cli-artifact/manifest.json \
            --content-type application/json \
            --cache-control "$cache_control"

          aws s3api put-object \
            --endpoint-url "$r2_endpoint" \
            --bucket "$R2_BUCKET_NAME" \
            --key "${ARTIFACT_PREFIX}/ready.json" \
            --body /tmp/okou-cli-artifact/ready.json \
            --content-type application/json \
            --cache-control "$cache_control" \
            --if-none-match "*"

          echo "Artifact ready: ${artifact_uri}/"

      - name: Download existing CLI artifact
        if: steps.existing.outputs.exists == 'true'
        env:
          ARTIFACT_PREFIX: ${{ steps.artifact.outputs.prefix }}
        run: |
          mkdir -p /tmp/okou-cli-artifact
          aws s3 cp \
            "s3://${R2_BUCKET_NAME}/${ARTIFACT_PREFIX}/" \
            /tmp/okou-cli-artifact/ \
            --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" \
            --recursive

      - name: Verify and smoke test CLI artifact
        env:
          ARTIFACT_SHA: ${{ steps.artifact.outputs.sha }}
        run: |
          set -euo pipefail
          bash .github/scripts/verify-okou-cli-artifact.sh \
            /tmp/okou-cli-artifact \
            "$ARTIFACT_SHA"
          bash .github/scripts/smoke-okou-cli-artifact.sh \
            /tmp/okou-cli-artifact/package.tgz

      - name: Verify CLI artifact through CDN
        env:
          ARTIFACT_SHA: ${{ steps.artifact.outputs.sha }}
          ARTIFACT_PREFIX: ${{ steps.artifact.outputs.prefix }}
        run: |
          set -euo pipefail
          cdn_dir="$(mktemp -d)"
          for filename in package.tgz manifest.json ready.json; do
            curl -fsSL \
              --retry 5 \
              --retry-delay 2 \
              --retry-all-errors \
              "${CLI_STATIC_BASE_URL}/${ARTIFACT_PREFIX}/${filename}" \
              --output "${cdn_dir}/${filename}"
          done
          bash .github/scripts/verify-okou-cli-artifact.sh \
            "$cdn_dir" \
            "$ARTIFACT_SHA"
          bash .github/scripts/smoke-okou-cli-artifact.sh \
            "$cdn_dir/package.tgz"

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v7
        with:
          name: cli-package
          path: /tmp/okou-cli-artifact/package.tgz
          retention-days: 1

  # Smoke-test the deployed CLI package entry point.
  cli-e2e-01-serial:
    runs-on: ubuntu-latest
    concurrency:
      group: cli-e2e-01-serial-${{ needs.prepare.outputs.job-ref }}
      cancel-in-progress: true
    needs:
      [
        prepare,
        deploy-cli,
        lint-eslint,
        lint-types,
        lint-format,
        lint-knip,
        test-cli,
        test-app,
        test-other,
      ]
    if: |
      (github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore: release')) &&
      needs.prepare.outputs.job-ref != '' && (
        needs.prepare.outputs.api-changed == 'true' ||
        needs.prepare.outputs.cli-changed == 'true' ||
        needs.prepare.outputs.crates-changed == 'true' ||
        needs.prepare.outputs.ci-changed == 'true' ||
        needs.prepare.outputs.e2e-changed == 'true'
      )
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Download CLI artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: cli-package
          path: /tmp/cli-package
      - name: Install CLI globally
        run: |
          set -euo pipefail
          package_root="$(mktemp -d)"
          tar -xzf /tmp/cli-package/package.tgz -C "$package_root"
          node_prefix=$(dirname "$(dirname "$(command -v node)")")
          cli_dir="$node_prefix/lib/node_modules/@vm0/okou-cli"
          sudo rm -rf "$cli_dir"
          sudo mkdir -p "$node_prefix/lib/node_modules/@vm0"
          sudo cp -a "$package_root/package" "$cli_dir"
          sudo chmod +x "$cli_dir/okou.js"
          sudo ln -sf "$cli_dir/okou.js" "$node_prefix/bin/okou"
          okou --help
          okou __agent-loop --help
      - name: Run Serial E2E Tests
        run: |
          echo "=== Running Serial E2E Tests ==="
          mkdir -p e2e/results
          BATS_TEST_TIMEOUT=30 ./e2e/test/libs/bats/bin/bats -T --report-formatter junit --output e2e/results ./e2e/tests/01-serial/*.bats
          echo "✅ Serial tests passed"

      - name: Print E2E trace log
        if: always()
        run: |
          if [ -f /tmp/e2e-trace.log ]; then
            echo "=== E2E CLI Trace (Serial) ==="
            cat /tmp/e2e-trace.log
          fi

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: e2e-serial
          files: e2e/results/*.xml
          report_type: test_results

      - name: Upload JUnit XML artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-serial-junit-xml
          path: e2e/results/
          retention-days: 7

  # Deploy runner prepare: wait for the shared runner-image workflow manifest.
  # The runner-image workflow owns cross-compilation and all-host image build.
  deploy-runner-prepare:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    concurrency:
      group: deploy-runner-prepare-${{ needs.prepare.outputs.job-ref }}
      cancel-in-progress: true
    needs: [prepare]
    timeout-minutes: 20
    if: |
      needs.prepare.outputs.job-ref != '' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) &&
      (
        needs.prepare.outputs.turbo-runner-consumer-needed == 'true' ||
        needs.prepare.outputs.playwright-runner-consumer-needed == 'true'
      )
    outputs:
      bin-dir: ${{ steps.manifest.outputs.bin-dir }}
      runner-dir: ${{ steps.manifest.outputs.runner-dir }}
      rootfs-hash-map: ${{ steps.manifest.outputs.rootfs-hash-map }}
      snapshot-hash-map: ${{ steps.manifest.outputs.snapshot-hash-map }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup SSH via Cloudflare Tunnel
        uses: ./.github/actions/setup-ssh-tunnel
        with:
          ssh-user: ${{ vars.AWS_METAL_RUNNER_USER }}
          ssh-hosts: ${{ secrets.AWS_METAL_RUNNER_HOSTS }}
          ssh-key: ${{ secrets.AWS_METAL_RUNNER_SSH_KEY }}
          cf-access-client-id: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          cf-access-client-secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}

      - name: Wait for runner image manifest
        id: manifest
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.sha }}
          LOOKUP_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          JOB_REF: ${{ needs.prepare.outputs.runner-image-job-ref }}
          # The helper resolves per-architecture host subsets locally and emits
          # merged hash maps for deploy-runner-start.
          AWS_METAL_RUNNER_HOSTS: ${{ secrets.AWS_METAL_RUNNER_HOSTS }}
          METAL_USER: ${{ vars.AWS_METAL_RUNNER_USER }}
          PROFILE: vm0/default
        run: .github/scripts/wait-runner-image-groups.sh

  # Deploy runner start: generate isolated configs for both API preview URLs and
  # start one service namespace per runtime from the shared binary and image.
  deploy-runner-start:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runtime: [cloudflare, vercel]
    concurrency:
      group: deploy-runner-start-${{ matrix.runtime }}-${{ needs.prepare.outputs.job-ref }}
      cancel-in-progress: true
    needs: [prepare, deploy-runner-prepare, deploy-api, deploy-api-vercel]
    # Normal starts should finish quickly; failures need enough room for the
    # bounded partial-start cleanup watchdog to run before GitHub kills the job.
    timeout-minutes: 8
    if: |
      needs.prepare.outputs.job-ref != '' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) &&
      (
        needs.prepare.outputs.turbo-runner-consumer-needed == 'true' ||
        needs.prepare.outputs.playwright-runner-consumer-needed == 'true'
      )
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup SSH via Cloudflare Tunnel
        uses: ./.github/actions/setup-ssh-tunnel
        with:
          ssh-user: ${{ vars.AWS_METAL_RUNNER_USER }}
          ssh-hosts: ${{ secrets.AWS_METAL_RUNNER_HOSTS }}
          ssh-key: ${{ secrets.AWS_METAL_RUNNER_SSH_KEY }}
          cf-access-client-id: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          cf-access-client-secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}

      # Read METAL_HOSTS from secret directly — GitHub Actions masks secret values in job outputs
      - name: Rebuild config and start runner service on all hosts
        env:
          METAL_USER: ${{ vars.AWS_METAL_RUNNER_USER }}
          OFFICIAL_RUNNER_SECRET: ${{ secrets.OFFICIAL_RUNNER_SECRET }}
          METAL_HOSTS: ${{ secrets.AWS_METAL_RUNNER_HOSTS }}
          RUNNER_SERVICE_REF: ${{ matrix.runtime == 'vercel' && format('{0}-vercel', needs.prepare.outputs.job-ref) || needs.prepare.outputs.job-ref }}
          RUNNER_GROUP: ${{ format('vm0/development-{0}', matrix.runtime == 'vercel' && format('{0}-vercel', needs.prepare.outputs.job-ref) || needs.prepare.outputs.job-ref) }}
          BIN_DIR: ${{ needs.deploy-runner-prepare.outputs.bin-dir }}
          RUNNER_DIR: ${{ needs.deploy-runner-prepare.outputs.runner-dir }}
          RUNNER_CONFIG_SUFFIX: ${{ matrix.runtime == 'vercel' && '-vercel' || '' }}
          ROOTFS_HASH_MAP: ${{ needs.deploy-runner-prepare.outputs.rootfs-hash-map }}
          SNAPSHOT_HASH_MAP: ${{ needs.deploy-runner-prepare.outputs.snapshot-hash-map }}
          RUNNER_API_URL: ${{ matrix.runtime == 'vercel' && needs.deploy-api-vercel.outputs.preview-url || needs.deploy-api.outputs.preview-url }}
          RUNNER_RUNTIME: ${{ matrix.runtime }}
          CF_ACCESS_CLIENT_ID: ${{ matrix.runtime == 'cloudflare' && secrets.CF_API_PREVIEW_ACCESS_CLIENT_ID || '' }}
          CF_ACCESS_CLIENT_SECRET: ${{ matrix.runtime == 'cloudflare' && secrets.CF_API_PREVIEW_ACCESS_CLIENT_SECRET || '' }}
          VERCEL_BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set -euo pipefail

          read_host_capacity() {
            local HOST=$1
            local RUNNER_NAME=$2
            local REMOTE="${METAL_USER}@${HOST}"
            # shellcheck disable=SC2029
            if ! ssh "$REMOTE" "sudo ${BIN_DIR}/runner service wait-running --name ${RUNNER_NAME} --timeout-secs 120"; then
              echo "::error::Runner ${RUNNER_NAME} did not become ready on ${HOST}"
              # Preserve the actual startup failure instead of only reporting
              # the readiness timeout from the supervising CI job.
              # shellcheck disable=SC2029
              ssh "$REMOTE" "sudo ${BIN_DIR}/runner service logs --name ${RUNNER_NAME} --lines 100" >&2 || true
              return 1
            fi
          }

          start_on_host() {
            set -euo pipefail

            local HOST=$1
            local HOST_INDEX=$2
            local RUNNER_NAME="${RUNNER_SERVICE_REF}-${HOST_INDEX}"
            local RUNNER_DIRNAME="${RUNNER_DIR##*/}${RUNNER_CONFIG_SUFFIX}"
            local RUNNER_CONFIG_DIR="${RUNNER_DIR}${RUNNER_CONFIG_SUFFIX}"
            local REMOTE="${METAL_USER}@${HOST}"
            local MC
            echo "=== Starting runner ${RUNNER_NAME} on ${HOST} ==="

            # Look up per-host hashes
            local ROOTFS_HASH SNAPSHOT_HASH
            ROOTFS_HASH=$(echo "$ROOTFS_HASH_MAP" | jq -r --arg h "$HOST" '.[$h]')
            SNAPSHOT_HASH=$(echo "$SNAPSHOT_HASH_MAP" | jq -r --arg h "$HOST" '.[$h]')
            if [ -z "$ROOTFS_HASH" ] || [ "$ROOTFS_HASH" = "null" ] \
                || [ -z "$SNAPSHOT_HASH" ] || [ "$SNAPSHOT_HASH" = "null" ]; then
              echo "::error::No rootfs/snapshot hash found for ${HOST} in hash map"
              return 1
            fi

            # Guard: ensure binary exists (fails fast on "Re-run failed jobs" without prepare)
            # shellcheck disable=SC2029
            if ! ssh "$REMOTE" "test -x ${BIN_DIR}/runner"; then
              echo "::error::Runner binary not found on ${HOST}. Use 'Re-run all jobs' to redeploy the runner first."
              return 1
            fi

            # Generate runner.yaml with real preview URL (no build needed, uses cached hashes)
            # shellcheck disable=SC2029
            ssh "$REMOTE" "sudo ${BIN_DIR}/runner config \
              --profile vm0/default \
              --rootfs-hash ${ROOTFS_HASH} \
              --snapshot-hash ${SNAPSHOT_HASH} \
              --name ${RUNNER_NAME} \
              --group ${RUNNER_GROUP} \
              --runner-dirname ${RUNNER_DIRNAME} \
              --concurrency-factor 1.5 \
              --api-url ${RUNNER_API_URL} \
              --token vm0_official_${OFFICIAL_RUNNER_SECRET}"

            # Stop any existing service from a previous run (e.g., re-run after test failure).
            # Use cleanup semantics so a stale or wedged unit cannot hang this start path.
            # shellcheck disable=SC2029
            timeout 180s ssh "$REMOTE" "sudo ${BIN_DIR}/runner service stop --name '${RUNNER_NAME}' --force --cleanup partial-start"
            # shellcheck disable=SC2029
            ssh "$REMOTE" "sudo rm -f ${RUNNER_CONFIG_DIR}/status.json"

            # Start as systemd transient service. Vercel runners must not
            # receive empty Access variables because the runner deliberately
            # rejects partial or empty credential pairs.
            if [[ "$RUNNER_RUNTIME" == "cloudflare" ]]; then
              : "${CF_ACCESS_CLIENT_ID:?Cloudflare Access client ID is required}"
              : "${CF_ACCESS_CLIENT_SECRET:?Cloudflare Access client secret is required}"
              # shellcheck disable=SC2029
              ssh "$REMOTE" "sudo ${BIN_DIR}/runner service start \
                --name ${RUNNER_NAME} \
                --config ${RUNNER_CONFIG_DIR}/runner.yaml \
                --env CF_ACCESS_CLIENT_ID=${CF_ACCESS_CLIENT_ID} \
                --env CF_ACCESS_CLIENT_SECRET=${CF_ACCESS_CLIENT_SECRET} \
                --env VERCEL_AUTOMATION_BYPASS_SECRET=${VERCEL_BYPASS} \
                --env USE_MOCK_CLAUDE=true \
                --env USE_MOCK_CODEX=true"
            else
              # shellcheck disable=SC2029
              ssh "$REMOTE" "sudo ${BIN_DIR}/runner service start \
                --name ${RUNNER_NAME} \
                --config ${RUNNER_CONFIG_DIR}/runner.yaml \
                --env VERCEL_AUTOMATION_BYPASS_SECRET=${VERCEL_BYPASS} \
                --env USE_MOCK_CLAUDE=true \
                --env USE_MOCK_CODEX=true"
            fi

            # Wait for the runner to become job-admitting before health checks.
            # systemd-run returns once the process starts, but startup
            # readiness can keep status.json at mode=starting for longer.
            if ! MC=$(read_host_capacity "$HOST" "$RUNNER_NAME"); then
              return 1
            fi
            echo "Runner ready on ${HOST}: max_concurrent=${MC}"
            # shellcheck disable=SC2029
            ssh "$REMOTE" "sudo ${BIN_DIR}/runner doctor --name ${RUNNER_NAME}"
            echo "=== Runner started on ${HOST} ==="
          }

          LOG_DIR=$(mktemp -d)
          HOSTS=()
          PIDS=()
          PGIDS=()
          RUNNER_START_SUCCEEDED=0
          RUNNER_START_SIGNAL_EXIT=0
          RUNNER_START_RECORDING=0

          cleanup_logs() {
            rm -rf "$LOG_DIR"
          }

          request_runner_start_exit() {
            RUNNER_START_SIGNAL_EXIT=$1
            if [ "$RUNNER_START_RECORDING" -ne 1 ]; then
              exit "$RUNNER_START_SIGNAL_EXIT"
            fi
          }

          check_runner_start_exit() {
            if [ "$RUNNER_START_SIGNAL_EXIT" -ne 0 ]; then
              exit "$RUNNER_START_SIGNAL_EXIT"
            fi
          }

          process_group_for_pid() {
            local PID=$1
            ps -o pgid= -p "$PID" 2>/dev/null | tr -d ' '
          }

          stop_background_start_jobs() {
            local JOB_PIDS=()
            local START_PGIDS=()
            local WAIT_PIDS=()
            local CURRENT_PGID
            CURRENT_PGID=$(process_group_for_pid "$$" || true)
            for PGID in "${PGIDS[@]}"; do
              if [[ "$PGID" =~ ^[0-9]+$ && "$PGID" != "$CURRENT_PGID" ]]; then
                START_PGIDS+=("$PGID")
              fi
            done
            for PID in $(jobs -pr); do
              JOB_PIDS+=("$PID")
              WAIT_PIDS+=("$PID")
            done
            for PID in "${PIDS[@]}"; do
              WAIT_PIDS+=("$PID")
            done
            for PID in "${JOB_PIDS[@]}"; do
              local PGID
              PGID=$(process_group_for_pid "$PID" || true)
              if [[ "$PGID" =~ ^[0-9]+$ && "$PGID" != "$CURRENT_PGID" ]]; then
                START_PGIDS+=("$PGID")
              else
                kill -TERM "$PID" 2>/dev/null || true
              fi
            done
            for PGID in "${START_PGIDS[@]}"; do
              kill -TERM -- "-$PGID" 2>/dev/null || true
            done
            for PGID in "${START_PGIDS[@]}"; do
              kill -KILL -- "-$PGID" 2>/dev/null || true
            done
            for PID in "${JOB_PIDS[@]}"; do
              kill -KILL "$PID" 2>/dev/null || true
            done
            for PID in "${WAIT_PIDS[@]}"; do
              wait "$PID" 2>/dev/null || true
            done
          }

          stop_started_hosts() {
            local STOP_PIDS=()
            local HOST_INDEX=0
            for HOST in $(echo "$METAL_HOSTS" | tr ',' ' '); do
              HOST_INDEX=$((HOST_INDEX + 1))
              local RUNNER_NAME="${RUNNER_SERVICE_REF}-${HOST_INDEX}"
              local REMOTE="${METAL_USER}@${HOST}"
              echo "::warning::Requesting stop for partially started runner ${RUNNER_NAME} on ${HOST}"
              (
                # The runner cleanup command has per-action deadlines; keep the
                # outer SSH watchdog longer than the combined worst-case budget.
                # shellcheck disable=SC2029
                timeout 180s ssh "$REMOTE" "sudo ${BIN_DIR}/runner service stop --name '${RUNNER_NAME}' --force --cleanup partial-start" >/dev/null || true
              ) &
              STOP_PIDS+=($!)
            done
            for PID in "${STOP_PIDS[@]}"; do
              wait "$PID" 2>/dev/null || true
            done
          }

          cleanup_runner_start() {
            local EXIT_CODE=$?
            trap - EXIT
            trap '' INT TERM
            if [ "$RUNNER_START_SUCCEEDED" -ne 1 ]; then
              stop_background_start_jobs
              stop_started_hosts
            fi
            cleanup_logs
            exit "$EXIT_CODE"
          }

          trap cleanup_runner_start EXIT
          trap 'request_runner_start_exit 130' INT
          trap 'request_runner_start_exit 143' TERM
          export -f read_host_capacity start_on_host
          HOST_INDEX=0
          for HOST in $(echo "$METAL_HOSTS" | tr ',' ' '); do
            HOST_INDEX=$((HOST_INDEX + 1))
            HOSTS+=("$HOST")
            RUNNER_START_RECORDING=1
            setsid bash -c 'start_on_host "$@"' start_on_host "$HOST" "$HOST_INDEX" > "${LOG_DIR}/${HOST}.log" 2>&1 &
            PIDS+=($!)
            PGIDS+=($!)
            RUNNER_START_RECORDING=0
            check_runner_start_exit
          done

          FAILED=0
          for i in "${!PIDS[@]}"; do
            if ! wait "${PIDS[$i]}"; then
              check_runner_start_exit
              FAILED=1
              echo "::error::Runner start failed on ${HOSTS[$i]}"
            fi
            check_runner_start_exit
            echo "=== ${HOSTS[$i]} ==="
            cat "${LOG_DIR}/${HOSTS[$i]}.log"
            check_runner_start_exit
          done
          rm -rf "$LOG_DIR"
          if [ "$FAILED" -ne 0 ]; then
            exit 1
          fi

          RUNNER_START_SUCCEEDED=1

  # Keep tests for the limited-free organization serial while running the paid
  # credential lane in parallel. Both lanes run against both API runtimes.
  cli-e2e-03-runner-shards:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [prepare]
    if: |
      needs.prepare.outputs.job-ref != '' &&
      needs.prepare.outputs.turbo-runner-consumer-needed == 'true'
    outputs:
      matrix: ${{ steps.shards.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - name: Install pnpm
        run: corepack enable pnpm
      - name: Install E2E dependencies
        run: cd e2e && pnpm install --frozen-lockfile
      - name: Generate runner E2E shard matrix
        id: shards
        shell: bash
        run: |
          set -euo pipefail
          base_matrix="$(cd e2e && pnpm exec tsx playwright/runner-shards.ts tests/03-runner 7)"
          matrix="$(jq -c '
            .include as $shards |
            ($shards | length) as $total |
            {include: [
              ["cloudflare", "vercel"][] as $runtime |
              $shards[] |
              . + {runtime: $runtime, total: $total}
            ]}
          ' <<<"$base_matrix")"
          jq -e '
            .include | type == "array" and
            length == 14 and
            (map(select(.runtime == "cloudflare")) | length) == 7 and
            (map(select(.runtime == "vercel")) | length) == 7 and
            (map(select(.runtime == "cloudflare" and .credentialLane == "limited-free")) | length) == 4 and
            (map(select(.runtime == "vercel" and .credentialLane == "limited-free")) | length) == 4 and
            (map(select(.runtime == "cloudflare" and .credentialLane == "codex")) | length) == 2 and
            (map(select(.runtime == "vercel" and .credentialLane == "codex")) | length) == 2 and
            (map(select(.runtime == "cloudflare" and .credentialLane == "claude")) | length) == 1 and
            (map(select(.runtime == "vercel" and .credentialLane == "claude")) | length) == 1 and
            all(.[];
              (.runtime == "cloudflare" or .runtime == "vercel") and
              (.total | type == "number" and . == 7) and
              (.credentialLane == "limited-free" or .credentialLane == "codex" or .credentialLane == "claude") and
              (.credentialIndex | type == "number" and . >= 1 and . <= 4) and
              (.files | type == "array" and length > 0)
            )
          ' <<<"$matrix" >/dev/null
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  # Prepare isolated identities and API credentials for each runtime after the
  # browser-level Playwright load has drained. Both API runtimes still run in
  # parallel, while each direct-Postgres runtime gets one heavy E2E phase at a
  # time before the runner tests start.
  cli-e2e-03-runner-prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        runtime: [cloudflare, vercel]
    concurrency:
      group: cli-e2e-03-runner-prepare-${{ matrix.runtime }}-${{ needs.prepare.outputs.job-ref }}
      cancel-in-progress: true
    needs:
      - prepare
      - deploy-api
      - deploy-api-vercel
      - deploy-app
      - deploy-stripe-listener
      - cli-e2e-02-playwright
    if: |
      always() &&
      needs.prepare.outputs.job-ref != '' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) &&
      needs.prepare.outputs.turbo-runner-consumer-needed == 'true' &&
      needs.deploy-api.result == 'success' &&
      needs.deploy-api-vercel.result == 'success' &&
      needs.deploy-app.result == 'success' &&
      (github.event_name == 'push' || needs.deploy-stripe-listener.result == 'success') &&
      needs.cli-e2e-02-playwright.result == 'success'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - name: Install pnpm
        run: corepack enable pnpm
      - name: Install E2E dependencies
        run: cd e2e && pnpm install --frozen-lockfile
      - name: Prepare runner E2E accounts
        id: account
        run: cd e2e && pnpm exec tsx playwright/runner-account.ts prepare
        env:
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          JOB_REF: ${{ matrix.runtime == 'vercel' && format('{0}-vercel', needs.prepare.outputs.job-ref) || needs.prepare.outputs.job-ref }}
      - name: Install Playwright browsers
        run: cd e2e && pnpm exec playwright install --with-deps chromium
      - name: Generate runner E2E API tokens
        run: cd e2e && pnpm exec tsx playwright/runner-token.ts /tmp
        env:
          VM0_API_BACKEND_URL: ${{ matrix.runtime == 'vercel' && needs.deploy-api-vercel.outputs.preview-url || needs.deploy-api.outputs.preview-url }}
          OKOU_APP_URL: ${{ matrix.runtime == 'vercel' && needs.deploy-app.outputs.vercel-preview-url || needs.deploy-app.outputs.preview-url }}
          ZERO_APP_URL: ${{ matrix.runtime == 'vercel' && needs.deploy-app.outputs.vercel-preview-url || needs.deploy-app.outputs.preview-url }}
          CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          JOB_REF: ${{ matrix.runtime == 'vercel' && format('{0}-vercel', needs.prepare.outputs.job-ref) || needs.prepare.outputs.job-ref }}
          E2E_RUNNER_ORGANIZATION_IDS: ${{ steps.account.outputs.runner-organization-ids }}
          E2E_RUNNER_CODEX_ORGANIZATION_ID: ${{ steps.account.outputs.codex-organization-id }}
          E2E_RUNNER_CLAUDE_ORGANIZATION_ID: ${{ steps.account.outputs.claude-organization-id }}
          E2E_RUNNER_MOCK_CLAUDE_ORGANIZATION_ID: ${{ steps.account.outputs.mock-claude-organization-id }}
          E2E_RUNNER_EMAILS: ${{ steps.account.outputs.runner-emails }}
          E2E_RUNNER_CODEX_EMAIL: ${{ steps.account.outputs.codex-email }}
          E2E_RUNNER_CLAUDE_EMAIL: ${{ steps.account.outputs.claude-email }}
          E2E_RUNNER_MOCK_CLAUDE_EMAIL: ${{ steps.account.outputs.mock-claude-email }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_API_PREVIEW_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_API_PREVIEW_ACCESS_CLIENT_SECRET }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      - name: Create runner E2E account manifest
        env:
          RUNNER_ORGANIZATION_IDS: ${{ steps.account.outputs.runner-organization-ids }}
          CODEX_ORGANIZATION_ID: ${{ steps.account.outputs.codex-organization-id }}
          CLAUDE_ORGANIZATION_ID: ${{ steps.account.outputs.claude-organization-id }}
          MOCK_CLAUDE_ORGANIZATION_ID: ${{ steps.account.outputs.mock-claude-organization-id }}
          RUNNER_EMAILS: ${{ steps.account.outputs.runner-emails }}
          CODEX_EMAIL: ${{ steps.account.outputs.codex-email }}
          CLAUDE_EMAIL: ${{ steps.account.outputs.claude-email }}
          MOCK_CLAUDE_EMAIL: ${{ steps.account.outputs.mock-claude-email }}
        run: |
          jq -n \
            --argjson runnerOrganizationIds "$RUNNER_ORGANIZATION_IDS" \
            --arg codexOrganizationId "$CODEX_ORGANIZATION_ID" \
            --arg claudeOrganizationId "$CLAUDE_ORGANIZATION_ID" \
            --arg mockClaudeOrganizationId "$MOCK_CLAUDE_ORGANIZATION_ID" \
            --argjson runnerEmails "$RUNNER_EMAILS" \
            --arg codexEmail "$CODEX_EMAIL" \
            --arg claudeEmail "$CLAUDE_EMAIL" \
            --arg mockClaudeEmail "$MOCK_CLAUDE_EMAIL" \
            '{runnerOrganizationIds: $runnerOrganizationIds, codexOrganizationId: $codexOrganizationId, claudeOrganizationId: $claudeOrganizationId, mockClaudeOrganizationId: $mockClaudeOrganizationId, runnerEmails: $runnerEmails, codexEmail: $codexEmail, claudeEmail: $claudeEmail, mockClaudeEmail: $mockClaudeEmail}' \
            > /tmp/e2e-runner-accounts.json
      - name: Upload runner E2E API tokens
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: e2e-tokens-${{ matrix.runtime }}
          path: |
            /tmp/e2e-api-credentials-runner-1.json
            /tmp/e2e-api-credentials-runner-2.json
            /tmp/e2e-api-credentials-runner-3.json
            /tmp/e2e-api-credentials-runner-4.json
            /tmp/e2e-api-credentials-runner-real-codex.json
            /tmp/e2e-api-credentials-runner-real-claude.json
            /tmp/e2e-api-credentials-runner-mock-claude.json
            /tmp/e2e-runner-accounts.json
          retention-days: 1

  cli-e2e-03-runner-bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        runtime: [cloudflare, vercel]
    concurrency:
      group: cli-e2e-03-runner-bootstrap-${{ matrix.runtime }}-${{ needs.prepare.outputs.job-ref }}
      cancel-in-progress: true
    needs:
      - prepare
      - deploy-api
      - deploy-api-vercel
      - cli-e2e-03-runner-prepare
    if: |
      always() &&
      needs.prepare.outputs.job-ref != '' &&
      needs.prepare.outputs.turbo-runner-consumer-needed == 'true' &&
      needs.deploy-api.result == 'success' &&
      needs.deploy-api-vercel.result == 'success' &&
      needs.cli-e2e-03-runner-prepare.result == 'success'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download runner E2E API tokens
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: e2e-tokens-${{ matrix.runtime }}
          path: /tmp
      - name: Setup runner E2E API credentials
        shell: bash
        run: |
          set -euo pipefail
          for index in 1 2 3 4; do
            credential_file="/tmp/e2e-api-credentials-runner-${index}.json"
            token=$(jq -er '.token | select(type == "string" and length > 0)' "$credential_file")
            jq -er '.apiUrl | select(type == "string" and length > 0)' "$credential_file" >/dev/null
            echo "::add-mask::$token"
          done
      - name: Reset runner model defaults
        shell: bash
        run: |
          set -euo pipefail
          payload="$(jq -nc '{
            policies: [
              {model: "deepseek-v4-flash", isDefault: true, defaultProviderType: "vm0", credentialScope: "org", modelProviderId: null},
              {model: "gpt-5.6-luna", isDefault: false, defaultProviderType: "vm0", credentialScope: "org", modelProviderId: null}
            ]
          }')"

          reset_model_defaults() {
            local credential_file="$1" token api_url
            local -a headers
            token=$(jq -er '.token' "$credential_file")
            api_url=$(jq -er '.apiUrl' "$credential_file")
            headers=(-H "Authorization: Bearer ${token}" -H "Content-Type: application/json")
            if [[ -n "${VERCEL_AUTOMATION_BYPASS_SECRET:-}" ]]; then
              headers+=(-H "x-vercel-protection-bypass: ${VERCEL_AUTOMATION_BYPASS_SECRET}")
            fi
            if [[ -n "${CF_ACCESS_CLIENT_ID:-}" || -n "${CF_ACCESS_CLIENT_SECRET:-}" ]]; then
              : "${CF_ACCESS_CLIENT_ID:?Cloudflare Access client ID is required}"
              : "${CF_ACCESS_CLIENT_SECRET:?Cloudflare Access client secret is required}"
              headers+=(
                -H "CF-Access-Client-Id: ${CF_ACCESS_CLIENT_ID}"
                -H "CF-Access-Client-Secret: ${CF_ACCESS_CLIENT_SECRET}"
              )
            fi
            curl -fsS "${headers[@]}" -X PUT -d "$payload" "${api_url}/api/okou/model-policies" >/dev/null
            curl -fsS "${headers[@]}" -X PUT -d '{"selectedModel":null,"serviceTier":null}' "${api_url}/api/okou/user-model-preference" >/dev/null
          }

          # Each limited-free organization keeps one concurrency slot. Set up
          # their independent policies in parallel without changing plan limits.
          pids=()
          for index in 1 2 3 4; do
            reset_model_defaults "/tmp/e2e-api-credentials-runner-${index}.json" &
            pids+=("$!")
          done
          for pid in "${pids[@]}"; do
            wait "$pid"
          done
        env:
          CF_ACCESS_CLIENT_ID: ${{ matrix.runtime == 'cloudflare' && secrets.CF_API_PREVIEW_ACCESS_CLIENT_ID || '' }}
          CF_ACCESS_CLIENT_SECRET: ${{ matrix.runtime == 'cloudflare' && secrets.CF_API_PREVIEW_ACCESS_CLIENT_SECRET || '' }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      - name: Bootstrap runner mock model provider
        shell: bash
        run: |
          set -euo pipefail
          bootstrap_mock_provider() {
            local credential_file="$1" token api_url
            local -a headers
            token=$(jq -er '.token' "$credential_file")
            api_url=$(jq -er '.apiUrl' "$credential_file")
            headers=(-H "Authorization: Bearer ${token}" -H "Content-Type: application/json")
            if [[ -n "${VERCEL_AUTOMATION_BYPASS_SECRET:-}" ]]; then
              headers+=(-H "x-vercel-protection-bypass: ${VERCEL_AUTOMATION_BYPASS_SECRET}")
            fi
            if [[ -n "${CF_ACCESS_CLIENT_ID:-}" || -n "${CF_ACCESS_CLIENT_SECRET:-}" ]]; then
              : "${CF_ACCESS_CLIENT_ID:?Cloudflare Access client ID is required}"
              : "${CF_ACCESS_CLIENT_SECRET:?Cloudflare Access client secret is required}"
              headers+=(
                -H "CF-Access-Client-Id: ${CF_ACCESS_CLIENT_ID}"
                -H "CF-Access-Client-Secret: ${CF_ACCESS_CLIENT_SECRET}"
              )
            fi
            curl -fsS "${headers[@]}" \
              -X POST \
              -d '{"type":"claude-code-oauth-token","secret":"mock-oauth-token-for-e2e"}' \
              "${api_url}/api/okou/model-providers" >/dev/null
          }

          pids=()
          for index in 1 2 3 4; do
            bootstrap_mock_provider "/tmp/e2e-api-credentials-runner-${index}.json" &
            pids+=("$!")
          done
          for pid in "${pids[@]}"; do
            wait "$pid"
          done
        env:
          CF_ACCESS_CLIENT_ID: ${{ matrix.runtime == 'cloudflare' && secrets.CF_API_PREVIEW_ACCESS_CLIENT_ID || '' }}
          CF_ACCESS_CLIENT_SECRET: ${{ matrix.runtime == 'cloudflare' && secrets.CF_API_PREVIEW_ACCESS_CLIENT_SECRET || '' }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      - name: Bootstrap mock Claude account
        shell: bash
        run: cd e2e && bash playwright/runner-mock-claude-bootstrap.bash /tmp/e2e-api-credentials-runner-mock-claude.json
        env:
          CF_ACCESS_CLIENT_ID: ${{ matrix.runtime == 'cloudflare' && secrets.CF_API_PREVIEW_ACCESS_CLIENT_ID || '' }}
          CF_ACCESS_CLIENT_SECRET: ${{ matrix.runtime == 'cloudflare' && secrets.CF_API_PREVIEW_ACCESS_CLIENT_SECRET || '' }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      - name: Bootstrap real Codex account
        shell: bash
        run: |
          set -euo pipefail
          token=$(jq -er '.token | select(type == "string" and length > 0)' /tmp/e2e-api-credentials-runner-real-codex.json)
          api_url=$(jq -er '.apiUrl | select(type == "string" and length > 0)' /tmp/e2e-api-credentials-runner-real-codex.json)
          echo "::add-mask::$token"

          headers=(-H "Authorization: Bearer ${token}" -H "Content-Type: application/json")
          if [[ -n "${VERCEL_AUTOMATION_BYPASS_SECRET:-}" ]]; then
            headers+=(-H "x-vercel-protection-bypass: ${VERCEL_AUTOMATION_BYPASS_SECRET}")
          fi
          if [[ -n "${CF_ACCESS_CLIENT_ID:-}" || -n "${CF_ACCESS_CLIENT_SECRET:-}" ]]; then
            : "${CF_ACCESS_CLIENT_ID:?Cloudflare Access client ID is required}"
            : "${CF_ACCESS_CLIENT_SECRET:?Cloudflare Access client secret is required}"
            headers+=(
              -H "CF-Access-Client-Id: ${CF_ACCESS_CLIENT_ID}"
              -H "CF-Access-Client-Secret: ${CF_ACCESS_CLIENT_SECRET}"
            )
          fi

          provider_payload=$(jq -nc \
            --arg secret "$OPENAI_API_KEY" \
            '{type: "openai-api-key", secret: $secret}')
          provider_response=$(curl -fsS "${headers[@]}" \
            -X POST \
            -d "$provider_payload" \
            "${api_url}/api/okou/model-providers")
          provider_id=$(jq -er '.provider.id | select(type == "string" and length > 0)' \
            <<< "$provider_response")

          policies=$(curl -fsS "${headers[@]}" "${api_url}/api/okou/model-policies")
          policy_payload=$(jq -c --arg providerId "$provider_id" '
            {
              policies: (
                [.policies[] |
                  select(
                    .model != "gpt-5.6-luna" and
                    .model != "gpt-5.6-sol"
                  ) |
                  {
                    model,
                    isDefault,
                    defaultProviderType,
                    credentialScope,
                    modelProviderId
                  }
                ] + [
                  {
                    model: "gpt-5.6-luna",
                    isDefault: false,
                    defaultProviderType: "openai-api-key",
                    credentialScope: "org",
                    modelProviderId: $providerId
                  },
                  {
                    model: "gpt-5.6-sol",
                    isDefault: false,
                    defaultProviderType: "vm0",
                    credentialScope: "org",
                    modelProviderId: null
                  }
                ]
              )
            }
          ' <<< "$policies")
          curl -fsS "${headers[@]}" \
            -X PUT \
            -d "$policy_payload" \
            "${api_url}/api/okou/model-policies" \
            >/dev/null

          curl -fsS "${headers[@]}" \
            -X POST \
            -d '{"switches":{"realAgentInPreview":true}}' \
            "${api_url}/api/okou/feature-switches" \
            | jq -e '.effectiveSwitches.realAgentInPreview == true' \
            >/dev/null
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CF_ACCESS_CLIENT_ID: ${{ matrix.runtime == 'cloudflare' && secrets.CF_API_PREVIEW_ACCESS_CLIENT_ID || '' }}
          CF_ACCESS_CLIENT_SECRET: ${{ matrix.runtime == 'cloudflare' && secrets.CF_API_PREVIEW_ACCESS_CLIENT_SECRET || '' }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      - name: Bootstrap real Claude account
        shell: bash
        run: |
          set -euo pipefail
          token=$(jq -er '.token | select(type == "string" and length > 0)' /tmp/e2e-api-credentials-runner-real-claude.json)
          api_url=$(jq -er '.apiUrl | select(type == "string" and length > 0)' /tmp/e2e-api-credentials-runner-real-claude.json)
          echo "::add-mask::$token"

          headers=(-H "Authorization: Bearer ${token}" -H "Content-Type: application/json")
          if [[ -n "${VERCEL_AUTOMATION_BYPASS_SECRET:-}" ]]; then
            headers+=(-H "x-vercel-protection-bypass: ${VERCEL_AUTOMATION_BYPASS_SECRET}")
          fi
          if [[ -n "${CF_ACCESS_CLIENT_ID:-}" || -n "${CF_ACCESS_CLIENT_SECRET:-}" ]]; then
            : "${CF_ACCESS_CLIENT_ID:?Cloudflare Access client ID is required}"
            : "${CF_ACCESS_CLIENT_SECRET:?Cloudflare Access client secret is required}"
            headers+=(
              -H "CF-Access-Client-Id: ${CF_ACCESS_CLIENT_ID}"
              -H "CF-Access-Client-Secret: ${CF_ACCESS_CLIENT_SECRET}"
            )
          fi

          provider_payload=$(jq -nc \
            --arg secret "$ANTHROPIC_API_KEY" \
            '{type: "anthropic-api-key", secret: $secret}')
          provider_response=$(curl -fsS "${headers[@]}" \
            -X POST \
            -d "$provider_payload" \
            "${api_url}/api/okou/model-providers")
          provider_id=$(jq -er '.provider.id | select(type == "string" and length > 0)' \
            <<< "$provider_response")

          policies=$(curl -fsS "${headers[@]}" "${api_url}/api/okou/model-policies")
          policy_payload=$(jq -c --arg providerId "$provider_id" '
            {
              policies: (
                [.policies[] |
                  select(.model != "claude-sonnet-4-6") |
                  {
                    model,
                    isDefault,
                    defaultProviderType,
                    credentialScope,
                    modelProviderId
                  }
                ] + [
                  {
                    model: "claude-sonnet-4-6",
                    isDefault: false,
                    defaultProviderType: "anthropic-api-key",
                    credentialScope: "org",
                    modelProviderId: $providerId
                  }
                ]
              )
            }
          ' <<< "$policies")
          curl -fsS "${headers[@]}" \
            -X PUT \
            -d "$policy_payload" \
            "${api_url}/api/okou/model-policies" \
            >/dev/null

          curl -fsS "${headers[@]}" \
            -X POST \
            -d '{"switches":{"realAgentInPreview":true}}' \
            "${api_url}/api/okou/feature-switches" \
            | jq -e '.effectiveSwitches.realAgentInPreview == true' \
            >/dev/null
        env:
          ANTHROPIC_API_KEY: ${{ secrets.CI_ANTHROPIC_API_KEY }}
          CF_ACCESS_CLIENT_ID: ${{ matrix.runtime == 'cloudflare' && secrets.CF_API_PREVIEW_ACCESS_CLIENT_ID || '' }}
          CF_ACCESS_CLIENT_SECRET: ${{ matrix.runtime == 'cloudflare' && secrets.CF_API_PREVIEW_ACCESS_CLIENT_SECRET || '' }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

  cli-e2e-03-runner:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: cli-e2e-03-runner-${{ matrix.runtime }}-${{ matrix.index }}-${{ needs.prepare.outputs.job-ref }}
      cancel-in-progress: true
    needs:
      - prepare
      - cli-e2e-03-runner-shards
      - deploy-api
      - deploy-api-vercel
      - deploy-runner-prepare
      - deploy-runner-start
      - cli-e2e-03-runner-prepare
      - cli-e2e-03-runner-bootstrap
    if: |
      always() &&
      needs.prepare.outputs.job-ref != '' &&
      needs.prepare.outputs.turbo-runner-consumer-needed == 'true' &&
      needs.cli-e2e-03-runner-shards.result == 'success' &&
      needs.deploy-api.result == 'success' &&
      needs.deploy-api-vercel.result == 'success' &&
      needs.deploy-runner-prepare.result == 'success' &&
      needs.deploy-runner-start.result == 'success' &&
      needs.cli-e2e-03-runner-prepare.result == 'success' &&
      needs.cli-e2e-03-runner-bootstrap.result == 'success'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.cli-e2e-03-runner-shards.outputs.matrix) }}
    env:
      E2E_RUNNER_RUNTIME: ${{ matrix.runtime }}
      E2E_RUNNER_CREDENTIAL_INDEX: ${{ matrix.credentialIndex }}
      E2E_RUNNER_SHARD_INDEX: ${{ matrix.index }}
      E2E_RUNNER_SHARD_TOTAL: ${{ matrix.total }}
      E2E_RUNNER_TEST_FILES_JSON: ${{ toJSON(matrix.files) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - name: Install pnpm
        run: corepack enable pnpm
      - name: Install E2E dependencies
        run: cd e2e && pnpm install --frozen-lockfile
      - name: Download runner E2E API tokens
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: e2e-tokens-${{ matrix.runtime }}
          path: /tmp
      - name: Setup runner E2E API credentials
        shell: bash
        run: |
          set -euo pipefail
          for credential_file in \
            /tmp/e2e-api-credentials-runner-1.json \
            /tmp/e2e-api-credentials-runner-2.json \
            /tmp/e2e-api-credentials-runner-3.json \
            /tmp/e2e-api-credentials-runner-4.json \
            /tmp/e2e-api-credentials-runner-real-codex.json \
            /tmp/e2e-api-credentials-runner-real-claude.json \
            /tmp/e2e-api-credentials-runner-mock-claude.json; do
            jq -er '.token | select(type == "string" and length > 0)' "$credential_file" >/dev/null
            jq -er '.apiUrl | select(type == "string" and length > 0)' "$credential_file" >/dev/null
          done
          : "${E2E_RUNNER_CREDENTIAL_INDEX:?runner credential index is required}"
          credential_file="/tmp/e2e-api-credentials-runner-${E2E_RUNNER_CREDENTIAL_INDEX}.json"
          token=$(jq -er '.token' "$credential_file")
          api_url=$(jq -er '.apiUrl' "$credential_file")
          organization_index=$((E2E_RUNNER_CREDENTIAL_INDEX - 1))
          echo "::add-mask::$token"
          {
            echo "E2E_API_TOKEN=$token"
            echo "E2E_API_URL=$api_url"
            echo "E2E_CLERK_ORG_ID=$(jq -er --argjson index "$organization_index" '.runnerOrganizationIds[$index]' /tmp/e2e-runner-accounts.json)"
            echo "E2E_RUNNER_CODEX_ORG_ID=$(jq -er '.codexOrganizationId' /tmp/e2e-runner-accounts.json)"
            echo "E2E_RUNNER_CLAUDE_ORG_ID=$(jq -er '.claudeOrganizationId' /tmp/e2e-runner-accounts.json)"
            echo "E2E_RUNNER_MOCK_CLAUDE_ORG_ID=$(jq -er '.mockClaudeOrganizationId' /tmp/e2e-runner-accounts.json)"
            echo "E2E_RUNNER_EMAIL=$(jq -er --argjson index "$organization_index" '.runnerEmails[$index]' /tmp/e2e-runner-accounts.json)"
            echo "E2E_RUNNER_CODEX_EMAIL=$(jq -er '.codexEmail' /tmp/e2e-runner-accounts.json)"
            echo "E2E_RUNNER_CLAUDE_EMAIL=$(jq -er '.claudeEmail' /tmp/e2e-runner-accounts.json)"
            echo "E2E_RUNNER_MOCK_CLAUDE_EMAIL=$(jq -er '.mockClaudeEmail' /tmp/e2e-runner-accounts.json)"
          } >> "$GITHUB_ENV"
      - name: Initialize runner E2E shard
        shell: bash
        run: |
          set -euo pipefail
          : "${E2E_CLERK_ORG_ID:?runner E2E organization is required}"
          : "${E2E_RUNNER_CODEX_ORG_ID:?runner Codex E2E organization is required}"
          : "${E2E_RUNNER_CLAUDE_ORG_ID:?runner Claude E2E organization is required}"
          : "${E2E_RUNNER_MOCK_CLAUDE_ORG_ID:?runner mock Claude E2E organization is required}"
          : "${E2E_RUNNER_EMAIL:?runner E2E account is required}"
          : "${E2E_RUNNER_CODEX_EMAIL:?runner Codex E2E account is required}"
          : "${E2E_RUNNER_CLAUDE_EMAIL:?runner Claude E2E account is required}"
          : "${E2E_RUNNER_MOCK_CLAUDE_EMAIL:?runner mock Claude E2E account is required}"
          : "${E2E_API_TOKEN:?runner E2E API token is required}"
          : "${E2E_API_URL:?runner E2E API URL is required}"
          : "${E2E_RUNNER_RUNTIME:?runner E2E runtime is required}"
          : "${E2E_RUNNER_CREDENTIAL_INDEX:?runner credential index is required}"
          jq -e '
            type == "array" and length > 0 and
            all(.[]; type == "string" and length > 0)
          ' <<<"$E2E_RUNNER_TEST_FILES_JSON" >/dev/null
          test_count="$(jq 'length' <<<"$E2E_RUNNER_TEST_FILES_JSON")"
          echo "Runner E2E shard ${E2E_RUNNER_SHARD_INDEX}/${E2E_RUNNER_SHARD_TOTAL} has ${test_count} file(s)"
      - name: Run runner E2E tests (shard ${{ matrix.index }})
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t test_files < <(jq -er '.[]' <<<"$E2E_RUNNER_TEST_FILES_JSON")
          if (( ${#test_files[@]} == 0 )); then
            echo "::error::Runner E2E shard has no test files"
            exit 1
          fi

          cd e2e
          for test_file in "${test_files[@]}"; do
            if [[ ! -f "$test_file" ]]; then
              echo "::error::Runner E2E test file does not exist: $test_file"
              exit 1
            fi
          done

          result_directory="results/runner-${E2E_RUNNER_RUNTIME}-${E2E_RUNNER_SHARD_INDEX}"
          mkdir -p "$result_directory"
          BATS_TEST_TIMEOUT=240 ./test/libs/bats/bin/bats \
            -T \
            --report-formatter junit \
            --output "$result_directory" \
            "${test_files[@]}"
        env:
          CF_ACCESS_CLIENT_ID: ${{ matrix.runtime == 'cloudflare' && secrets.CF_API_PREVIEW_ACCESS_CLIENT_ID || '' }}
          CF_ACCESS_CLIENT_SECRET: ${{ matrix.runtime == 'cloudflare' && secrets.CF_API_PREVIEW_ACCESS_CLIENT_SECRET || '' }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      - name: Print runner E2E trace log
        if: always()
        shell: bash
        run: |
          if [[ -f /tmp/e2e-trace.log ]]; then
            cat /tmp/e2e-trace.log
          fi
      - name: Upload runner E2E test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: e2e-runner
          files: e2e/results/runner-${{ matrix.runtime }}-${{ matrix.index }}/*.xml
          report_type: test_results
      - name: Upload runner E2E JUnit XML
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e2e-runner-junit-${{ matrix.runtime }}-${{ matrix.index }}
          path: e2e/results/runner-${{ matrix.runtime }}-${{ matrix.index }}/
          retention-days: 7

  cli-e2e-03-runner-cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        runtime: [cloudflare, vercel]
    concurrency:
      group: cli-e2e-03-runner-cleanup-${{ matrix.runtime }}-${{ needs.prepare.outputs.job-ref }}
      cancel-in-progress: true
    needs:
      - prepare
      - cli-e2e-03-runner-prepare
      - cli-e2e-03-runner
    if: |
      always() &&
      needs.prepare.outputs.job-ref != '' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) &&
      needs.cli-e2e-03-runner-prepare.result != 'skipped'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - name: Install pnpm
        run: corepack enable pnpm
      - name: Install E2E dependencies
        run: cd e2e && pnpm install --frozen-lockfile
      - name: Cleanup runner E2E accounts
        run: cd e2e && pnpm exec tsx playwright/runner-account.ts cleanup
        env:
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          JOB_REF: ${{ matrix.runtime == 'vercel' && format('{0}-vercel', needs.prepare.outputs.job-ref) || needs.prepare.outputs.job-ref }}

  lint-runtime-api-compat:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    needs: [detect-release]
    if: needs.detect-release.outputs.skip != 'true'
    # Report-only: this surfaces schema generation/compat issues without blocking CI.
    continue-on-error: true
    container:
      image: ghcr.io/vm0-ai/vm0-toolchain:20260622
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/toolchain-init

      - name: Download online runtime API schema
        env:
          GH_TOKEN: ${{ github.token }}
          SCHEMA_RELEASE_TAG: runtime-api-schema-prod
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/runtime-api-schema

          if gh release view "$SCHEMA_RELEASE_TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            if gh release download "$SCHEMA_RELEASE_TAG" \
              --repo "${{ github.repository }}" \
              --pattern current.json \
              --dir /tmp/runtime-api-schema \
              --clobber; then
              echo "Downloaded online runtime API schema"
            else
              echo "::warning::Runtime API schema release exists, but current.json is not available yet."
            fi
          else
            echo "::warning::Runtime API schema release $SCHEMA_RELEASE_TAG does not exist yet; compatibility report will be skipped."
          fi

      - name: Check runtime API compatibility (report only)
        working-directory: turbo
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/runtime-api-schema

          pnpm --filter @vm0/api-contracts run build:runtime-api-schema -- --out /tmp/runtime-api-schema/candidate.json

          if [ -f /tmp/runtime-api-schema/current.json ]; then
            pnpm --filter @vm0/api-contracts run lint-runtime-api-compat -- \
              --against /tmp/runtime-api-schema/current.json \
              --current /tmp/runtime-api-schema/candidate.json \
              --report-out /tmp/runtime-api-schema/report.json \
              --warn-only
          else
            echo "::warning::No online runtime API schema found. Generated candidate schema only."
            printf '{"findings":[],"skipped":"online schema not found"}\n' > /tmp/runtime-api-schema/report.json
          fi

      - name: Upload runtime API compatibility report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: runtime-api-compat-report
          path: |
            /tmp/runtime-api-schema/candidate.json
            /tmp/runtime-api-schema/current.json
            /tmp/runtime-api-schema/report.json
          if-no-files-found: warn
          retention-days: 14

  # Lighthouse CI audit for web homepage (failure blocks merge, skip is allowed)
  ci-gate-turbo:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Runner cleanup is handled by cleanup.yml (pull_request_target:closed).
    needs:
      - detect-release
      - validate-release-presence
      - detect-turbo-ts-checks
      - prepare
      - file-size-check
      - lint-eslint
      - lint-types
      - lint-types-apps
      - lint-format
      - lint-knip
      - test-migrate
      - test-cli
      - test-app
      - test-api
      - test-other
      - deploy-api
      - deploy-api-vercel
      - deploy-app
      - deploy-stripe-listener
      - deploy-cli
      - cli-e2e-02-browser
      - cli-e2e-02-playwright
      - cli-e2e-01-serial
      - cli-e2e-03-runner-shards
      - cli-e2e-03-runner-prepare
      - cli-e2e-03-runner-bootstrap
      - cli-e2e-03-runner
      - cli-e2e-03-runner-cleanup
      - deploy-runner-prepare
      - deploy-runner-start
    # Always run so the gate reports an explicit result (not "skipped").
    # Release-please PRs skip CI jobs — auto-pass the gate for them.
    if: always()
    steps:
      - name: Validate CI results
        env:
          EVENT_NAME: ${{ github.event_name }}
          IS_RELEASE: ${{ needs.detect-release.outputs.skip }}
          RELEASE_PRESENCE_RESULT: ${{ needs.validate-release-presence.result }}
          RELEASE_DEPLOY_APP_RESULT: ${{ needs.deploy-app.result }}
          RELEASE_DEPLOY_CLI_RESULT: ${{ needs.deploy-cli.result }}
        run: |
          # Auto-pass for release-please PRs, commits, and merge queue entries
          if [[ "$IS_RELEASE" == "true" ]]; then
            if [[ "$EVENT_NAME" == "merge_group" && "$RELEASE_PRESENCE_RESULT" != "success" ]]; then
              echo "::error::validate-release-presence: expected success, got $RELEASE_PRESENCE_RESULT"
              exit 1
            fi
            if [[ "$EVENT_NAME" == "merge_group" && "$RELEASE_DEPLOY_APP_RESULT" != "success" ]]; then
              echo "::error::deploy-app: expected success, got $RELEASE_DEPLOY_APP_RESULT"
              exit 1
            fi
            if [[ "$EVENT_NAME" == "merge_group" && "$RELEASE_DEPLOY_CLI_RESULT" != "success" ]]; then
              echo "::error::deploy-cli: expected success, got $RELEASE_DEPLOY_CLI_RESULT"
              exit 1
            fi
            echo "✅ Release-please — skipping CI gate"
            exit 0
          fi

          echo "::group::CI Gate Results"
          FAILED=0
          TS_CHECK_SKIP_ALLOWED=""
          if [ "${{ needs.detect-turbo-ts-checks.outputs.turbo-ts-checks-needed }}" = "false" ]; then
            TS_CHECK_SKIP_ALLOWED="skipped"
          fi
          RUNNER_DEPLOY_SKIP_ALLOWED="true"
          if [ "${{ needs.prepare.outputs.turbo-runner-consumer-needed }}" = "true" ] ||
            [ "${{ needs.prepare.outputs.playwright-runner-consumer-needed }}" = "true" ]; then
            RUNNER_DEPLOY_SKIP_ALLOWED=""
          fi
          RUNNER_E2E_SKIP_ALLOWED="true"
          if [ "${{ needs.prepare.outputs.turbo-runner-consumer-needed }}" = "true" ]; then
            RUNNER_E2E_SKIP_ALLOWED=""
          fi
          CF_APP_SKIP_ALLOWED=""
          API_DEPLOY_SKIP_ALLOWED="skipped"
          if [ "${{ needs.prepare.outputs.api-changed }}" = "true" ] ||
            [ "${{ needs.prepare.outputs.platform-changed }}" = "true" ] ||
            [ "${{ needs.prepare.outputs.cli-changed }}" = "true" ] ||
            [ "${{ needs.prepare.outputs.crates-changed }}" = "true" ] ||
            [ "${{ needs.prepare.outputs.ci-changed }}" = "true" ] ||
            [ "${{ needs.prepare.outputs.e2e-changed }}" = "true" ]; then
            API_DEPLOY_SKIP_ALLOWED=""
          fi
          LIVE_E2E_SKIP_ALLOWED="skipped"
          if [ "${{ needs.prepare.outputs.api-changed }}" = "true" ] ||
            [ "${{ needs.prepare.outputs.platform-changed }}" = "true" ] ||
            [ "${{ needs.prepare.outputs.cli-changed }}" = "true" ] ||
            [ "${{ needs.prepare.outputs.ci-changed }}" = "true" ] ||
            [ "${{ needs.prepare.outputs.e2e-changed }}" = "true" ]; then
            LIVE_E2E_SKIP_ALLOWED=""
          fi
          if [ "${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}" = "true" ]; then
            # External fork PRs cannot access runner infra secrets, so their
            # runner deployment and runner E2E jobs are expected to skip.
            RUNNER_DEPLOY_SKIP_ALLOWED="true"
            RUNNER_E2E_SKIP_ALLOWED="true"
            CF_APP_SKIP_ALLOWED="true"
            API_DEPLOY_SKIP_ALLOWED="skipped"
            LIVE_E2E_SKIP_ALLOWED="skipped"
          fi
          if [ "${{ github.actor == 'dependabot[bot]' }}" = "true" ]; then
            CF_APP_SKIP_ALLOWED="true"
            LIVE_E2E_SKIP_ALLOWED="skipped"
          fi

          check_result() {
            local job="$1" result="$2" allow_skip="$3"
            if [ "$result" = "success" ]; then
              echo "✅ $job: $result"
            elif { [ "$allow_skip" = "skipped" ] || [ "$allow_skip" = "true" ]; } && [ "$result" = "skipped" ]; then
              echo "⏭️ $job: $result (allowed)"
            elif [ "$allow_skip" = "true" ] && [ "$result" = "cancelled" ]; then
              echo "⚠️ $job: $result (cancelled by concurrency group, allowed)"
            elif [ "$allow_skip" = "informational" ]; then
              echo "ℹ️ $job: $result (informational, not blocking)"
            else
              if [ "$allow_skip" = "true" ]; then
                echo "::error::$job: expected success or skipped, got $result"
              else
                echo "::error::$job: expected success, got $result"
              fi
              FAILED=1
            fi
          }

          # Required foundation jobs: only 'success' is acceptable.
          check_result "detect-release" "${{ needs.detect-release.result }}" ""
          check_result "detect-turbo-ts-checks" "${{ needs.detect-turbo-ts-checks.result }}" ""
          check_result "prepare" "${{ needs.prepare.result }}" ""
          check_result "file-size-check" "${{ needs.file-size-check.result }}" ""
          # Turbo TypeScript checks: only 'success' is acceptable unless
          # detect-turbo-ts-checks classified this as a crates-only change set.
          check_result "lint-eslint" "${{ needs.lint-eslint.result }}" "$TS_CHECK_SKIP_ALLOWED"
          check_result "lint-types" "${{ needs.lint-types.result }}" "$TS_CHECK_SKIP_ALLOWED"
          check_result "lint-types-apps" "${{ needs.lint-types-apps.result }}" "$TS_CHECK_SKIP_ALLOWED"
          check_result "lint-format" "${{ needs.lint-format.result }}" "$TS_CHECK_SKIP_ALLOWED"
          check_result "lint-knip" "${{ needs.lint-knip.result }}" "$TS_CHECK_SKIP_ALLOWED"
          check_result "test-cli" "${{ needs.test-cli.result }}" "$TS_CHECK_SKIP_ALLOWED"
          check_result "test-app" "${{ needs.test-app.result }}" "$TS_CHECK_SKIP_ALLOWED"
          check_result "test-api" "${{ needs.test-api.result }}" "$TS_CHECK_SKIP_ALLOWED"
          check_result "test-other" "${{ needs.test-other.result }}" "$TS_CHECK_SKIP_ALLOWED"

          # May-skip: 'success' or 'skipped' are both acceptable
          check_result "test-migrate" "${{ needs.test-migrate.result }}" "true"
          check_result "deploy-api" "${{ needs.deploy-api.result }}" "$API_DEPLOY_SKIP_ALLOWED"
          check_result "deploy-api-vercel" "${{ needs.deploy-api-vercel.result }}" "$API_DEPLOY_SKIP_ALLOWED"
          check_result "deploy-app" "${{ needs.deploy-app.result }}" "$CF_APP_SKIP_ALLOWED"
          check_result "deploy-stripe-listener" "${{ needs.deploy-stripe-listener.result }}" "true"
          check_result "deploy-cli" "${{ needs.deploy-cli.result }}" "$CF_APP_SKIP_ALLOWED"
          check_result "cli-e2e-02-browser" "${{ needs.cli-e2e-02-browser.result }}" "$LIVE_E2E_SKIP_ALLOWED"
          check_result "cli-e2e-02-playwright" "${{ needs.cli-e2e-02-playwright.result }}" "$LIVE_E2E_SKIP_ALLOWED"
          check_result "cli-e2e-01-serial" "${{ needs.cli-e2e-01-serial.result }}" "true"
          check_result "cli-e2e-03-runner-shards" "${{ needs.cli-e2e-03-runner-shards.result }}" "$RUNNER_E2E_SKIP_ALLOWED"
          check_result "cli-e2e-03-runner-prepare" "${{ needs.cli-e2e-03-runner-prepare.result }}" "$RUNNER_E2E_SKIP_ALLOWED"
          check_result "cli-e2e-03-runner-bootstrap" "${{ needs.cli-e2e-03-runner-bootstrap.result }}" "$RUNNER_E2E_SKIP_ALLOWED"
          check_result "cli-e2e-03-runner" "${{ needs.cli-e2e-03-runner.result }}" "$RUNNER_E2E_SKIP_ALLOWED"
