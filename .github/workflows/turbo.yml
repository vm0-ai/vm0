name: Turbo

on:
  pull_request:
  push:
    branches:
      - main
  merge_group:

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || (github.event_name == 'merge_group' && format('merge-queue-{0}', github.run_id) || 'staging') }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Detect release-please context across all event types (PR, push, merge queue).
  # github.head_ref is empty in merge_group events, so we extract the PR number
  # from the merge queue head_ref and check via GitHub API.
  detect-release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: Check for release-please
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_REF: ${{ github.head_ref || '' }}
          COMMIT_MSG: ${{ github.event.head_commit.message || '' }}
          EVENT_NAME: ${{ github.event_name }}
          MQ_HEAD_REF: ${{ github.event.merge_group.head_ref || '' }}
          REPO: ${{ github.repository }}
        run: |
          # PR event: check branch name
          if [[ "$HEAD_REF" == release-please--branches--* ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Release-please PR detected (branch: $HEAD_REF)"
            exit 0
          fi

          # Push event: check commit message
          if [[ "$EVENT_NAME" == "push" ]] && [[ "$COMMIT_MSG" == chore:\ release* ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Release-please push detected (message: $COMMIT_MSG)"
            exit 0
          fi

          # Merge queue event: extract PR number, check branch via API
          if [[ "$EVENT_NAME" == "merge_group" ]] && [[ -n "$MQ_HEAD_REF" ]]; then
            PR_NUM=$(echo "$MQ_HEAD_REF" | grep -oE 'pr-[0-9]+' | head -1 | sed 's/pr-//')
            if [[ -n "$PR_NUM" ]]; then
              # Fail closed because a missed release classification would bypass
              # release-presence validation.
              PR_BRANCH=$(gh pr view "$PR_NUM" --repo "$REPO" --json headRefName --jq .headRefName)
              if [[ "$PR_BRANCH" == release-please--branches--* ]]; then
                echo "skip=true" >> "$GITHUB_OUTPUT"
                echo "Release-please merge queue entry detected (PR #$PR_NUM, branch: $PR_BRANCH)"
                exit 0
              fi
            fi
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "Not a release-please context"

  validate-release-presence:
    name: Validate release presence
    needs: [detect-release]
    if: ${{ github.event_name == 'merge_group' && needs.detect-release.outputs.skip == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Check intervening component releases
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          MERGE_GROUP_HEAD_REF: ${{ github.event.merge_group.head_ref }}
          MERGE_GROUP_HEAD_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          pr_number=$(
            printf '%s\n' "$MERGE_GROUP_HEAD_REF" |
              grep -oE 'pr-[0-9]+' |
              head -1 |
              sed 's/pr-//'
          )
          if [ -z "$pr_number" ]; then
            echo "::error::Could not resolve pull request number from merge queue ref: $MERGE_GROUP_HEAD_REF"
            exit 1
          fi

          release_pr_head=$(
            gh pr view "$pr_number" \
              --repo "$REPO" \
              --json headRefOid \
              --jq .headRefOid
          )
          git fetch --no-tags origin "$release_pr_head"

          .github/scripts/check-release-please-component-releases.sh \
            "$MERGE_GROUP_BASE_SHA" \
            "$MERGE_GROUP_HEAD_SHA" \
            "$release_pr_head"

  detect-turbo-ts-checks:
    needs: [detect-release]
    if: needs.detect-release.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      turbo-ts-checks-needed: ${{ steps.detect.outputs.turbo-ts-checks-needed }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 2

      - name: Detect Turbo TypeScript check need
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          CHECKOUT_REF: ${{ github.ref }}
          PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: |
          BASE_REF=$(.github/scripts/changed-base-ref.sh)
          echo "${{ github.event_name }} mode: comparing against base $BASE_REF"

          CHANGED_FILES=$(git diff --name-only "$BASE_REF" HEAD)

          TURBO_TS_CHECKS_NEEDED=true
          if [ "${{ github.event_name }}" = "pull_request" ] || [ "${{ github.event_name }}" = "merge_group" ]; then
            if [ -n "$CHANGED_FILES" ] && ! printf '%s\n' "$CHANGED_FILES" | grep -qv "^crates/"; then
              echo "Turbo TypeScript checks not needed: crates-only ${{ github.event_name }} change set"
              TURBO_TS_CHECKS_NEEDED=false
            else
              echo "Turbo TypeScript checks needed"
            fi
          else
            echo "Turbo TypeScript checks needed"
          fi

          echo "turbo-ts-checks-needed=$TURBO_TS_CHECKS_NEEDED" >> "$GITHUB_OUTPUT"

  # Prepare: detect changes and set job-ref identifier
  prepare:
    needs: [detect-release]
    # Skip for release-please PRs (only version bumps and changelogs)
    if: needs.detect-release.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: ghcr.io/vm0-ai/vm0-toolchain:20260622
    outputs:
      job-ref: ${{ steps.set-job-ref.outputs.job-ref }}
      runner-image-job-ref: ${{ steps.set-job-ref.outputs.runner-image-job-ref }}
      app-preview-url: ${{ steps.preview-urls.outputs.app-url }}
      api-preview-url: ${{ steps.preview-urls.outputs.api-url }}
      vercel-app-preview-url: ${{ steps.preview-urls.outputs.vercel-app-url }}
      vercel-api-preview-url: ${{ steps.preview-urls.outputs.vercel-api-url }}
      api-changed: ${{ steps.detect.outputs.api-changed }}
      cli-changed: ${{ steps.detect.outputs.cli-changed }}
      platform-changed: ${{ steps.detect.outputs.platform-changed }}
      migration-changed: ${{ steps.detect.outputs.migration-changed }}
      crates-changed: ${{ steps.detect.outputs.crates-changed }}
      ci-changed: ${{ steps.detect.outputs.ci-changed }}
      e2e-changed: ${{ steps.detect.outputs.e2e-changed }}
      turbo-runner-consumer-needed: ${{ steps.runner-e2e.outputs.turbo-runner-consumer-needed }}
      playwright-runner-consumer-needed: ${{ steps.playwright-runner.outputs.playwright-runner-consumer-needed }}
      base-ref: ${{ steps.detect.outputs.base-ref }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 2

      - name: Configure Git safe directory
        run: git config --global --add safe.directory /__w/vm0/vm0

      - name: Detect changes
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          CHECKOUT_REF: ${{ github.ref }}
          PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: |
          echo "Checking for changes..."

          BASE_REF=$(.github/scripts/changed-base-ref.sh)
          echo "${{ github.event_name }} mode: comparing against base $BASE_REF"

          echo "base-ref=$BASE_REF" >> "$GITHUB_OUTPUT"
          CHANGED_FILES=$(git diff --name-only "$BASE_REF" HEAD)

          # Run changed.sh to get all package changes in one go
          CHANGES_JSON=$(./scripts/changed.sh "$BASE_REF")

          # Parse JSON and set outputs for each app
          for app_dir in turbo/apps/*/; do
            app=$(basename "$app_dir")
            # Get the package name from package.json
            if [ -f "turbo/apps/$app/package.json" ]; then
              PKG_NAME=$(jq -r '.name' "turbo/apps/$app/package.json")
              CHANGED=$(echo "$CHANGES_JSON" | jq -r ".\"$PKG_NAME\" // false")

              if [ "$CHANGED" = "true" ]; then
                echo "Changes detected in $app ($PKG_NAME)"
                echo "${app}-changed=true" >> "$GITHUB_OUTPUT"
              else
                echo "No changes in $app ($PKG_NAME)"
                echo "${app}-changed=false" >> "$GITHUB_OUTPUT"
              fi
            else
              echo "No package.json for $app, skipping"
              echo "${app}-changed=false" >> "$GITHUB_OUTPUT"
            fi
          done

          if printf '%s\n' "$CHANGED_FILES" | grep -qE '^turbo/packages/db/(src/(migrations|schema|jsonb-contracts)/|scripts/(migration-runner|test-migration-runner-timeouts)\.ts$)'; then
            echo "Migration, schema, JSONB contract, or migration runner changes detected"
            echo "migration-changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No migration, schema, JSONB contract, or migration runner changes"
            echo "migration-changed=false" >> "$GITHUB_OUTPUT"
          fi

          if printf '%s\n' "$CHANGED_FILES" | grep -q "^crates/"; then
            echo "Crates changes detected"
            echo "crates-changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No crates changes"
            echo "crates-changed=false" >> "$GITHUB_OUTPUT"
          fi

          if printf '%s\n' "$CHANGED_FILES" | grep -qE "^\.github/workflows/(turbo|crates|runner-image)\.yml$|^\.github/actions/(setup-ssh-tunnel|provision)/|^\.github/scripts/|^ansible/"; then
            echo "CI workflow changes detected"
            echo "ci-changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No CI workflow changes"
            echo "ci-changed=false" >> "$GITHUB_OUTPUT"
          fi

          if printf '%s\n' "$CHANGED_FILES" | grep -q "^e2e/"; then
            echo "E2E test changes detected"
            echo "e2e-changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No E2E test changes"
            echo "e2e-changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Select runner E2E consumer
        id: runner-e2e
        env:
          EVENT_NAME: ${{ github.event_name }}
          API_CHANGED: ${{ steps.detect.outputs.api-changed }}
          CLI_CHANGED: ${{ steps.detect.outputs.cli-changed }}
          CRATES_CHANGED: ${{ steps.detect.outputs.crates-changed }}
          CI_CHANGED: ${{ steps.detect.outputs.ci-changed }}
          E2E_CHANGED: ${{ steps.detect.outputs.e2e-changed }}
        run: .github/scripts/runner-image-context.sh turbo-consumer

      - name: Select Playwright runner consumer
        id: playwright-runner
        env:
          API_CHANGED: ${{ steps.detect.outputs.api-changed }}
          PLATFORM_CHANGED: ${{ steps.detect.outputs.platform-changed }}
          CLI_CHANGED: ${{ steps.detect.outputs.cli-changed }}
          CI_CHANGED: ${{ steps.detect.outputs.ci-changed }}
          E2E_CHANGED: ${{ steps.detect.outputs.e2e-changed }}
        run: .github/scripts/runner-image-context.sh playwright-consumer

      - name: Set job-ref
        id: set-job-ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # Skip runner deployment if the PR was already merged or closed.
            # A late pull_request:synchronize run can reach here after
            # cleanup.yml has already stopped the runner — deploying again
            # would resurrect a stale service that no cleanup will ever reach.
            #
            # Retry transient API failures, then fail loudly if the state
            # stays unknown. Silently skipping would let the PR merge without
            # runner coverage; fail-open would risk deploying a zombie runner.
            # A red check is the right middle ground — re-run the job once
            # the API recovers.
            STATE=$(curl -fsSL --retry 3 --retry-delay 2 --retry-all-errors \
              -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}" \
              | jq -r .state)
            if [ -z "$STATE" ]; then
              echo "::error::Failed to query PR #${{ github.event.pull_request.number }} state from GitHub API after retries"
              exit 1
            fi
            if [ "$STATE" != "open" ]; then
              echo "::warning::PR #${{ github.event.pull_request.number }} is ${STATE}, skipping job-ref to prevent stale runner deployment"
              exit 0
            fi
            echo "job-ref=pr-${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
            echo "runner-image-job-ref=pr-${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
            echo "Job ref set to: pr-${{ github.event.pull_request.number }}"
          elif [ "${{ github.event_name }}" = "merge_group" ]; then
            MQ_REF="${{ github.event.merge_group.head_ref }}"
            PR_NUM=$(echo "$MQ_REF" | grep -oE 'pr-[0-9]+' | head -1 | sed 's/pr-//')
            if [ -n "$PR_NUM" ]; then
              echo "job-ref=pr-${PR_NUM}" >> "$GITHUB_OUTPUT"
              echo "runner-image-job-ref=pr-${PR_NUM}" >> "$GITHUB_OUTPUT"
              echo "Job ref set to: pr-${PR_NUM}"
            else
              echo "::error::Failed to extract PR number from merge_group head_ref: $MQ_REF"
              exit 1
            fi
          else
            SHORT_SHA=$(printf '%s' "$GITHUB_SHA" | cut -c1-12)
            echo "job-ref=staging" >> "$GITHUB_OUTPUT"
            echo "runner-image-job-ref=staging-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
            echo "Job ref set to: staging"
          fi

      - name: Set preview URLs
        id: preview-urls
        env:
          CF_PAGES_PROJECT_NAME: ${{ vars.CF_PAGES_PROJECT_NAME }}
          CF_WORKERS_SUBDOMAIN: ${{ vars.CF_WORKERS_SUBDOMAIN }}
        run: |
          JOB_REF="${{ steps.set-job-ref.outputs.job-ref }}"
          CF_PAGES_PREVIEW_DOMAIN="${{ vars.CF_PAGES_PREVIEW_DOMAIN }}"
          PREVIEW_DOMAIN="${{ vars.PREVIEW_DOMAIN }}"

          if [ -n "$CF_PAGES_PREVIEW_DOMAIN" ] && [ -n "$CF_PAGES_PROJECT_NAME" ] && [ -n "$CF_WORKERS_SUBDOMAIN" ] && [ -n "$PREVIEW_DOMAIN" ] && [ -n "$JOB_REF" ]; then
            APP_URL="$(bash .github/scripts/resolve-app-preview-url.sh \
              "$JOB_REF" \
              "$CF_PAGES_PREVIEW_DOMAIN")"
            {
              echo "app-url=${APP_URL}"
              echo "api-url=https://${JOB_REF}-vm0-api-preview.${CF_WORKERS_SUBDOMAIN}.workers.dev"
              echo "vercel-app-url=https://${JOB_REF}-vercel-app.${CF_PAGES_PROJECT_NAME}.pages.dev"
              echo "vercel-api-url=https://${JOB_REF}-vercel-api.${PREVIEW_DOMAIN}"
            } >> "$GITHUB_OUTPUT"
            echo "Resolved isolated Worker and Vercel API/app preview URLs"
          else
            {
              echo "app-url="
              echo "api-url="
              echo "vercel-app-url="
              echo "vercel-api-url="
            } >> "$GITHUB_OUTPUT"
            echo "Preview URLs not set (Pages project, preview domains, Worker subdomain, or job-ref is empty)"
          fi

  file-size-check:
    needs: [detect-release]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Skip for release-please PRs, commits, and merge queue entries
    if: needs.detect-release.outputs.skip != 'true'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 2

      - name: Check file sizes
        env:
          EVENT_NAME: ${{ github.event_name }}
          CHECKOUT_REF: ${{ github.ref }}
          PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: |
          BASE_SHA=$(.github/scripts/changed-base-ref.sh)

          # Get list of added/modified files (exclude deleted)
          CHANGED_FILES=$(git diff --name-only --diff-filter=AM "$BASE_SHA" HEAD)

          if [ -z "$CHANGED_FILES" ]; then
            echo "No files changed"
            exit 0
          fi

          # Filter out whitelisted files
          FILTERED_FILES="$CHANGED_FILES"

          if [ -z "$FILTERED_FILES" ]; then
            echo "All changed files are whitelisted"
            exit 0
          fi

          # Check file sizes (word splitting is intentional to pass multiple files)
          # shellcheck disable=SC2086
          ./scripts/check-file-size.sh $FILTERED_FILES

  # Lint jobs - split into 4 parallel jobs for faster CI
  lint-eslint:
    needs: [detect-turbo-ts-checks]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: needs.detect-turbo-ts-checks.outputs.turbo-ts-checks-needed == 'true'
    container:
      image: ghcr.io/vm0-ai/vm0-toolchain:20260622
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1
      - uses: ./.github/actions/toolchain-init
      - name: Check DB ownership boundary
        run: .github/scripts/check-db-boundary.sh
      - name: Validate oxlintrc.json react allowImportNames
        working-directory: turbo
        run: |
          allowed=$(jq -r '.overrides[0].rules."no-restricted-imports"[1].paths[0].allowImportNames | sort | join(",")' apps/platform/.oxlintrc.json)
          expected="Component,StrictMode"
          if [ "$allowed" != "$expected" ]; then
            echo "::error::platform oxlintrc.json allowImportNames must be [\"StrictMode\", \"Component\"], got: $allowed"
            exit 1
          fi
      - name: Lint
        working-directory: turbo
        run: pnpm lint

  lint-types:
    needs: [detect-turbo-ts-checks]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: needs.detect-turbo-ts-checks.outputs.turbo-ts-checks-needed == 'true'
    container:
      image: ghcr.io/vm0-ai/vm0-toolchain:20260622
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/toolchain-init
      # The two heavy app type-checks (api, @vm0/app ≈ 57% of the former
      # serial total) run in the separate lint-types-apps job below. Here we
      # check everything else. Dependency packages resolve via source
      # (exports point at src/*.ts, no build step), so the apps job can run
      # its tsc standalone without re-running these — no duplicated work.
      - name: Type Check (shared packages)
        working-directory: turbo
        run: pnpm turbo run check-types --concurrency=1 --filter='!api' --filter='!@vm0/app'

  lint-types-apps:
    needs: [detect-turbo-ts-checks]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: needs.detect-turbo-ts-checks.outputs.turbo-ts-checks-needed == 'true'
    container:
      image: ghcr.io/vm0-ai/vm0-toolchain:20260622
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/toolchain-init
      # Heaviest tsc projects, split off lint-types so they run on their own
      # runner. Kept serial (one tsc at a time) to stay within runner memory —
      # the same reason the root check-types uses --concurrency=1. Each app's
      # check-types is invoked directly (pnpm --filter, not turbo) so turbo's
      # dependsOn ^check-types does not re-run the shared packages here.
      - name: Type Check (api)
        working-directory: turbo
        run: |
          set +e
          result_file=".memory-results/api-check-types.jsonl"
          rm -f "$result_file"

          node scripts/measure-memory.mjs \
            --label ci-api-check-types \
            --json "$result_file" \
            -- pnpm --filter api run check-types
          status=$?

          # shellcheck disable=SC2016
          node -e '
            const fs = require("node:fs");
            const file = process.argv[1];
            if (!fs.existsSync(file)) {
              process.exit(0);
            }

            const lines = fs.readFileSync(file, "utf8").trim().split(/\n/).filter(Boolean);
            if (lines.length === 0) {
              process.exit(0);
            }

            const result = JSON.parse(lines[lines.length - 1]);
            const durationSeconds = (result.durationMs / 1000).toFixed(1);
            const summary = [
              "### Type Check (api) memory",
              "",
              `- Peak RSS: ${result.peakRssMiB} MiB (${result.peakRssKiB} KiB)`,
              `- Duration: ${durationSeconds}s`,
              `- Exit code: ${result.exitCode}`,
              "",
            ].join("\n");

            console.log(`Peak RSS (api check-types): ${result.peakRssMiB} MiB (${result.peakRssKiB} KiB), duration ${durationSeconds}s`);
            if (process.env.GITHUB_STEP_SUMMARY) {
              fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary);
            }
          ' "$result_file"

          exit "$status"
      - name: Type Check (@vm0/app)
        working-directory: turbo
        run: pnpm --filter @vm0/app run check-types

  lint-format:
    needs: [detect-turbo-ts-checks]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    if: needs.detect-turbo-ts-checks.outputs.turbo-ts-checks-needed == 'true'
    container:
      image: ghcr.io/vm0-ai/vm0-toolchain:20260622
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/toolchain-init
      - name: Prettier
        working-directory: turbo
        run: pnpm prettier --check .

  lint-knip:
    needs: [detect-turbo-ts-checks]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: needs.detect-turbo-ts-checks.outputs.turbo-ts-checks-needed == 'true'
    container:
      image: ghcr.io/vm0-ai/vm0-toolchain:20260622
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/toolchain-init
      - name: Knip
        working-directory: turbo
        run: pnpm knip

  # Test jobs - split into 4 parallel jobs by project
  bench-api:
    needs: [detect-turbo-ts-checks, prepare]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Run on every PR commit and on pushes to main (baseline). Skipped in the
    # merge queue: benches only report numbers, they must not delay merges.
    if: |
      needs.detect-turbo-ts-checks.outputs.turbo-ts-checks-needed == 'true' && (
        github.event_name == 'pull_request' ||
        (github.event_name == 'push' && github.ref == 'refs/heads/main')
      )
    container:
      image: ghcr.io/vm0-ai/vm0-toolchain:20260622
    services:
      postgres:
        image: ghcr.io/vm0-ai/pgvector@sha256:d229d4e975e7102b7df031cbfcf5c4463ee21c84d0373d7a736191a2603dddfd
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 3s
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/toolchain-init
      - name: Run Database Migrations
        working-directory: turbo
        env:
          DATABASE_URL: postgresql://postgres@postgres:5432/postgres
        run: pnpm --filter @vm0/db db:migrate
      - name: Bench API
        working-directory: turbo
        env:
          DATABASE_URL: postgresql://postgres@postgres:5432/postgres
        run: pnpm -F api exec vitest bench --run --outputJson bench-results.json
      - name: Print bench summary
        if: success() || failure()
        working-directory: turbo/apps/api
        run: node scripts/print-bench-summary.mjs bench-results-p90.json
      - name: Upload bench results
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: bench-api-results
          path: |
            turbo/apps/api/bench-results.json
            turbo/apps/api/bench-results-p90.json
          if-no-files-found: warn

  bench-app:
    needs: [detect-turbo-ts-checks, prepare]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Run on every PR commit and on pushes to main (baseline). Skipped in the
    # merge queue: benches only report numbers, they must not delay merges.
    if: |
      needs.detect-turbo-ts-checks.outputs.turbo-ts-checks-needed == 'true' && (
        github.event_name == 'pull_request' ||
        (github.event_name == 'push' && github.ref == 'refs/heads/main')
      )
    container:
      image: ghcr.io/vm0-ai/vm0-toolchain:20260622
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/toolchain-init
      - name: Bench App
        working-directory: turbo
        run: pnpm -F @vm0/app exec vitest bench --run --outputJson bench-results.json
      - name: Print bench summary
        if: success() || failure()
        working-directory: turbo/apps/platform
        run: node scripts/print-bench-summary.mjs bench-results-p90.json
      - name: Upload bench results
        if: success() || failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bench-app-results
          path: |
            turbo/apps/platform/bench-results.json
            turbo/apps/platform/bench-results-p90.json
          if-no-files-found: warn

  test-migrate:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 12
    # Only run when migration, schema, or persistent JSONB contract files changed
    if: needs.prepare.outputs.migration-changed == 'true'
    container:
      image: ghcr.io/vm0-ai/vm0-toolchain:20260622
    services:
      postgres:
        image: ghcr.io/vm0-ai/pgvector@sha256:d229d4e975e7102b7df031cbfcf5c4463ee21c84d0373d7a736191a2603dddfd
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 3s
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 2
      - uses: ./.github/actions/toolchain-init
      - name: Prompt for JSONB Contract Changes
        run: |
          BASE_REF="${{ needs.prepare.outputs.base-ref }}"
          CHANGED=$(git diff --name-only "$BASE_REF" -- \
            'turbo/packages/db/src/jsonb-contracts/**')

          if [ -n "$CHANGED" ]; then
            echo "::warning title=Persistent JSONB contracts changed::Review production compatibility before merging."
            echo ""
            echo "Persistent JSONB contract files changed:"
            echo "$CHANGED"
            echo ""
            echo "Before merging, confirm:"
            echo "- Existing production rows remain readable by new API code."
            echo "- Removed/renamed keys have read-time normalization or a data migration."
            echo "- Strict response schemas tolerate legacy persisted rows, or legacy rows are migrated."
            echo "- Regression tests cover any legacy persisted JSON shape that should remain readable."
          fi
      - name: Check JSONB Contract Usage
        working-directory: turbo/packages/db
        run: pnpm lint:jsonb-contracts
      - name: Check Migration Immutability
        if: vars.CI_CHECK_IMMUTABLE_MIGRATE != '0'
        run: |
          BASE_REF="${{ needs.prepare.outputs.base-ref }}"
          MIGRATION_BASELINE=808
          # The squashed baseline and its history may be removed. Migrations after
          # the baseline must not be deleted once they land on main.
          DELETED=$(git diff --diff-filter=D --name-only "$BASE_REF" -- \
            'turbo/packages/db/src/migrations/*.sql' \
            'turbo/packages/db/src/migrations/meta/*_snapshot.json' | \
            awk -v baseline="$MIGRATION_BASELINE" '
              {
                name = $0
                sub(/^.*\//, "", name)
                if (name !~ /^[0-9][0-9][0-9][0-9]_/) {
                  print
                  next
                }
                if ((substr(name, 1, 4) + 0) > baseline) {
                  print
                }
              }
            ')

          # Migration SQL and snapshots are append-only at every index, including
          # the baseline.
          MODIFIED=$(git diff --diff-filter=M --name-only "$BASE_REF" -- \
            'turbo/packages/db/src/migrations/*.sql' \
            'turbo/packages/db/src/migrations/meta/*_snapshot.json')

          # _journal.json is modified on every new migration, so only flag deletion
          DELETED_JOURNAL=$(git diff --diff-filter=D --name-only "$BASE_REF" -- \
            'turbo/packages/db/src/migrations/meta/_journal.json')

          FAILED=0
          if [ -n "$DELETED" ]; then
            echo "::error::Migration files above baseline $MIGRATION_BASELINE must not be deleted once on main:"
            echo "$DELETED"
            FAILED=1
          fi
          if [ -n "$MODIFIED" ]; then
            echo "::error::Migration files must never be modified once on main:"
            echo "$MODIFIED"
            FAILED=1
          fi
          if [ -n "$DELETED_JOURNAL" ]; then
            echo "::error::Migration journal must not be deleted:"
            echo "$DELETED_JOURNAL"
            FAILED=1
          fi
          if [ "$FAILED" -eq 1 ]; then
            echo ""
            echo "These files may already be deployed to production."
            echo "Create a NEW migration instead of modifying existing ones."
            exit 1
          fi
      - name: Test Migration Consistency
        working-directory: turbo/packages/db
        env:
          DATABASE_URL: postgresql://postgres@postgres:5432/postgres
        run: pnpm test:migration-consistency

