name: Backfill Custom Connector Credentials

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Dry-run reports readiness; apply repairs shared targets"
        required: true
        type: choice
        options:
          - dry-run
          - apply
        default: dry-run
      confirmed_apply:
        description: "I reviewed a dry-run and authorize production writes"
        required: true
        type: choice
        options:
          - "no"
          - "yes"
        default: "no"
      batch_size:
        description: "Keyset page size (1-1000)"
        required: true
        type: string
        default: "100"
      cursor:
        description: "Optional report resume cursor; blank starts from the beginning"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: production-custom-connector-credential-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: ghcr.io/vm0-ai/vm0-toolchain:20260622
    environment: production
    defaults:
      run:
        shell: bash
    steps:
      - name: Gate production apply
        if: inputs.mode == 'apply' && inputs.confirmed_apply != 'yes'
        run: |
          echo "::error::confirmed_apply must be yes before applying production writes."
          exit 1

      # Workflow inputs are data only. Production-write code always comes from main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Initialize toolchain
        uses: ./.github/actions/toolchain-init

      - name: Validate inputs
        env:
          BATCH_SIZE: ${{ inputs.batch_size }}
          CURSOR: ${{ inputs.cursor }}
        run: |
          set -euo pipefail
          if [[ ! "$BATCH_SIZE" =~ ^[0-9]+$ ]] || (( BATCH_SIZE < 1 || BATCH_SIZE > 1000 )); then
            echo "::error::batch_size must be an integer between 1 and 1000."
            exit 1
          fi
          if [[ -n "$CURSOR" ]] && [[ ! "$CURSOR" =~ ^(values|legacy-secrets):[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$ ]]; then
            echo "::error::cursor must be values:<uuid> or legacy-secrets:<uuid>."
            exit 1
          fi

      - name: Install neonctl
        run: npm install -g neonctl@2.15.0

      - name: Get production database URL
        id: database
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
        run: |
          set -euo pipefail
          database_url=$(
            neonctl connection-string production \
              --project-id "$NEON_PROJECT_ID" \
              --database-name neondb \
              --role-name neondb_owner \
              --pooled
          )
          echo "::add-mask::$database_url"
          echo "database_url=$database_url" >> "$GITHUB_OUTPUT"

      - name: Backfill custom connector credentials
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          BACKFILL_MODE: ${{ inputs.mode }}
          BATCH_SIZE: ${{ inputs.batch_size }}
          CURSOR: ${{ inputs.cursor }}
          DATABASE_URL: ${{ steps.database.outputs.database_url }}
          REPORT_PATH: ${{ runner.temp }}/custom-connector-credential-backfill.json
        run: |
          set -euo pipefail
          args=(--batch-size "$BATCH_SIZE" --report-path "$REPORT_PATH")
          if [[ "$BACKFILL_MODE" == "apply" ]]; then
            args+=(--migrate)
          fi
          if [[ -n "$CURSOR" ]]; then
            args+=(--cursor "$CURSOR")
          fi
          cd turbo
          pnpm --filter @vm0/db exec tsx \
            scripts/migrations/012-custom-connector-credentials/backfill.ts \
            "${args[@]}"

      - name: Upload sanitized report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: custom-connector-credential-backfill-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/custom-connector-credential-backfill.json
          if-no-files-found: warn
          retention-days: 14
