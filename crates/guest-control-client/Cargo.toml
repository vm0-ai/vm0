[package]
name = "guest-control-client"
version = "0.18.6"
edition.workspace = true
description = "Runner-side client for controlling guest operations"

[dependencies]
guest-contracts.workspace = true
nix = { workspace = true, features = ["net"] }
sandbox.workspace = true
serde_json.workspace = true
shell-quote.workspace = true
tokio = { workspace = true, features = ["net", "io-util", "time", "rt", "macros", "sync", "fs"] }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
guest-control-proto.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tracing-subscriber = { workspace = true }
tracing-test-support.workspace = true

[lints]
workspace = true
