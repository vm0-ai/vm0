[package]
name = "vsock-host"
version = "0.17.103"
edition.workspace = true
description = "Vsock host client for Firecracker VM communication"

[dependencies]
guest-contracts.workspace = true
nix = { workspace = true, features = ["net"] }
sandbox.workspace = true
shell-quote.workspace = true
tokio = { workspace = true, features = ["net", "io-util", "time", "rt", "macros", "sync", "fs"] }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
vsock-proto.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tracing-subscriber = { workspace = true }
tracing-test-support.workspace = true

[lints]
workspace = true
