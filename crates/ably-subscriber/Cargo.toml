[package]
name = "ably-subscriber"
version = "1.0.19"
edition.workspace = true

[dependencies]
base64 = { workspace = true }
futures-util = { workspace = true }
reqwest = { workspace = true }
rmp-serde = { workspace = true }
rmpv = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "sync", "time"] }
tokio-tungstenite = { workspace = true, features = ["connect", "rustls-tls-native-roots"] }
tokio-util = { workspace = true, features = ["rt"] }
tracing = { workspace = true }
url = { workspace = true }

[dev-dependencies]
hmac = { workspace = true }
httpmock = { workspace = true }
proptest.workspace = true
sha2 = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "test-util", "net", "io-util"] }
tracing-subscriber = { workspace = true }
tracing-test-support = { workspace = true }

[[test]]
name = "integration"
path = "tests/integration/mod.rs"

[lints]
workspace = true
