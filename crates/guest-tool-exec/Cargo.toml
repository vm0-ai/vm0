[package]
name = "guest-tool-exec"
version = "0.1.53"
edition.workspace = true
description = "Explicit shell-tool cgroup launcher and runtime hook adapter for VM0 guests"

[dependencies]
guest-contracts.workspace = true
libc = { workspace = true, features = ["std"] }
process-control-ipc.workspace = true
serde = { workspace = true, features = ["derive", "std"] }
serde_json = { workspace = true, features = ["std"] }

[dev-dependencies]
tempfile = { workspace = true, features = ["getrandom"] }

[lints]
workspace = true
