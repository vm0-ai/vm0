- name: Inspect runner garbage collection capabilities
  ansible.builtin.command:
    argv:
      - "{{ bin_dir }}/runner"
      - gc
      - --help
  register: runner_gc_help
  changed_when: false
  failed_when: false

- name: Discover explicitly managed runner service units
  ansible.builtin.find:
    paths: "{{ runner_systemd_unit_dir | default('/etc/systemd/system') }}"
    patterns: vm0-runner-*.service
    file_type: file
  register: runner_gc_service_units
  when:
    - runner_gc_help.rc == 0
    - "'--deployment-service-suffix' in runner_gc_help.stdout"

- name: Build explicit runner deployment inventory
  ansible.builtin.set_fact:
    runner_gc_service_suffixes: >-
      {{
        (
          [runner_release]
          + (
            runner_gc_service_units.files
            | map(attribute='path')
            | map('basename')
            | map('regex_replace', '^vm0-runner-', '')
            | map('regex_replace', '\.service$', '')
            | list
          )
        )
        | unique
        | sort
      }}
  when:
    - runner_gc_help.rc == 0
    - "'--deployment-service-suffix' in runner_gc_help.stdout"

- name: Run serialized runner garbage collection
  ansible.builtin.command:
    argv: >-
      {{
        [
          'flock',
          '--exclusive',
          data_dir ~ '/locks/deployment-gc.lock',
          bin_dir ~ '/runner',
          'gc',
          '--keep-latest',
          '6',
          '--keep-bin-dirname',
          runner_release,
          '--keep-runner-dirname',
          runner_release
        ]
        + (
          runner_gc_service_suffixes
          | map('regex_replace', '^', '--deployment-service-suffix=')
          | list
        )
      }}
  when:
    - runner_gc_help.rc == 0
    - "'--deployment-service-suffix' in runner_gc_help.stdout"
