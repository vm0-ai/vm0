- name: Inspect runner garbage collection capabilities
  ansible.builtin.command:
    argv:
      - "{{ bin_dir }}/runner"
      - gc
      - --help
  register: runner_gc_help
  changed_when: false
  failed_when: false

- name: Run serialized runner garbage collection
  ansible.builtin.command:
    argv:
      - flock
      - --exclusive
      - "{{ data_dir }}/locks/deployment-gc.lock"
      - "{{ bin_dir }}/runner"
      - gc
      - --keep-latest
      - "6"
      - --keep-service-suffix
      - "{{ runner_release }}"
      - --keep-bin-dirname
      - "{{ runner_release }}"
      - --keep-runner-dirname
      - "{{ runner_release }}"
  when:
    - runner_gc_help.rc == 0
    - "'--keep-service-suffix' in runner_gc_help.stdout"
